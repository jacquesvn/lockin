  }
  function hideLightbox(){
    var el=document.getElementById("lightbox");LIGHT=null;
    if(el){el.classList.remove("show");el.innerHTML="";}
    if(showLightbox._k){document.removeEventListener("keydown",showLightbox._k);showLightbox._k=null;}
  }
  // state + pictures together, for export and the desktop mirror. Pictures are kept OUT of
  // localStorage, so a backup has to carry them explicitly or a restore would lose every one.
  function stateForBackup(st){
    var out={},k;
    for(k in st)if(st.hasOwnProperty(k))out[k]=st[k];
    var used={},any=false,lns=st.lineups||{};
    for(var m in lns){var arr=lns[m]||[];
      for(var i=0;i<arr.length;i++){var im=arr[i].im||[];
        for(var j=0;j<im.length;j++)if(IMGS[im[j]]){used[im[j]]=IMGS[im[j]];any=true;}}}
    if(any)out._images=used;
    return out;
  }
  // pull pictures out of a restored backup into IndexedDB, and hand back state safe for localStorage
  function takeBackupImages(o){
    if(o&&o._images){
      for(var id in o._images)if(typeof o._images[id]==="string")imgPut(id,o._images[id]);
      delete o._images;
    }
    return o;
  }

  /* ---------- v0.28: lineup spaced review ----------
     A light flashcard pass over the user's own saved lineups. Active recall: the card
     shows only the map + name; you say the throw out loud, THEN reveal and self-grade.
     Fixed ladder (days below) — GOT IT climbs a rung, SHAKY drops back to the start, so
     each throw comes back right before you'd forget it. Honest labelling: the spacing
     science is solid for remembering facts; applying it to lineups is our adaptation. */
  var LSRS=[1,3,7,14,30];
  // a lineup with no review record is due immediately — it was just learned
  function lineupIsDue(l,tk){var d=l&&l.srs&&l.srs.due;return !d||d<=tk;}
  function dueLineups(st,now){
    var tk=dateKey(now||new Date()),out=[],lns=st.lineups||{};
    for(var i=0;i<MAPS.length;i++){var arr=lns[MAPS[i].id]||[];
      for(var j=0;j<arr.length;j++)if(lineupIsDue(arr[j],tk))out.push({map:MAPS[i],idx:j,l:arr[j]});}
    return out;
  }
  // self-grade the current card: climb or reset the ladder and schedule the next review
  function srsAnswer(l,ok,now){
    var s=(ok&&l.srs)?Math.min(l.srs.s+1,LSRS.length-1):0;
    l.srs={s:s,due:dateKey(addDays(now||new Date(),LSRS[s]))};
    return l;
  }
  var LREV=false;   // is the current review card's throw revealed?
  function lineupReviewCard(st,revealed){
    var due=dueLineups(st);
    if(!due.length)return "";
    var cur=due[0],more=due.length-1;
    var g=cur.l.g?' · '+esc(String(cur.l.g).toUpperCase()):'';
    return '<div class="card" style="margin-bottom:10px;">'+
      '<div class="ml" style="color:var(--hero-ink);">LINEUP REVIEW · '+due.length+' DUE</div>'+
      '<p class="mhow" style="margin:6px 0 10px;">Say the throw out loud before you peek — recalling it is what makes it stick.</p>'+
      '<div class="lnrow" style="border-bottom:0;padding-bottom:0;"><div class="lnb">'+
        '<b>'+esc(cur.map.n).toUpperCase()+g+' — '+esc(cur.l.n)+'</b>'+
        // the picture IS the answer, so it stays hidden until you've had a go at recalling it
        (revealed?'<span>'+esc(cur.l.t||"")+'</span>'+picStrip(cur.l,"big"):'')+
      '</div></div>'+
      (revealed
        ?'<div style="display:flex;gap:8px;margin-top:10px;"><button class="gbtn" data-lrok="1">GOT IT</button><button class="gbtn" data-lrno="1">SHAKY</button></div>'
        :'<div style="margin-top:10px;"><button class="pbtn" data-lrshow="1">SHOW THE THROW</button></div>')+
      (more>0?'<p class="help" style="margin:8px 0 0;">'+more+' more after this one.</p>':'')+
      '<p class="help" style="margin:8px 0 0;">Got it right? It comes back later (1 → 3 → 7 → 14 → 30 days). Shaky? Tomorrow again. Spacing reviews out is proven for remembering facts — using it for lineups is our adaptation.</p>'+
    '</div>';
  }
  function mapPrep(st){

    function jobList(arr){return '<div class="jobs">'+arr.map(function(j,i){
      return '<div class="job"><i>'+(i+1)+'</i><span>'+esc(j)+'</span></div>';}).join("")+'</div>';}
    var tSide='<div class="card"><div class="ml" style="color:var(--hero-ink);">T SIDE · WHAT YOUR UTILITY IS FOR</div>'+jobList(M.t)+'</div>';
    var ctSide='<div class="card" style="margin-top:10px;"><div class="ml">CT SIDE · WHAT TO DENY</div>'+jobList(M.ct)+'</div>';

      M.r.map(function(x){return '<div class="rt"><b>'+esc(x[0])+'</b><span>'+esc(x[1])+'</span></div>';}).join("")+'</div>';
    var lns=((st.lineups||{})[sel])||[],tk0=dateKey(new Date());
    var lnList;
    if(lns.length){

      lns.forEach(function(l,i){var g=(l.g||"").trim();if(!(g in groups)){groups[g]=[];order.push(g);}groups[g].push({l:l,i:i});});
      var hasGroups=order.some(function(g){return g;});
      lnList=order.map(function(g){

  /* ---------- PROGRESS: calendar + Leetify checkpoints ---------- */
  function htmlProgress(st){
    var plan=st.plan,now=new Date();
    var hd='<div class="hd"><div><div class="ml">TRACK IT</div><h1 class="dsp">PROGRESS</h1></div></div>';
    var vy=viewDate.getFullYear(),vm=viewDate.getMonth();
    var title=viewDate.toLocaleDateString(undefined,{month:"long",year:"numeric"});
    var cal='<div class="card"><div class="calhd"><span class="ml">'+esc(title).toUpperCase()+'</span><span class="nav"><button data-cal="-1" aria-label="Previous month">‹</button><button data-cal="1" aria-label="Next month">›</button></span></div><div class="cal">';
    ["M","T","W","T","F","S","S"].forEach(function(h){cal+='<div class="ch">'+h+'</div>';});
    var first=new Date(vy,vm,1),pad=(first.getDay()+6)%7,dim=new Date(vy,vm+1,0).getDate();
    var tk=dateKey(now),todayMid=midnight(now).getTime();
    var createdMid=(plan&&plan.created)?parseKey(plan.created).getTime():0; // floor the "missed" paint at the plan start
    for(var p=0;p<pad;p++)cal+='<div class="cell pad"></div>';
    for(var d=1;d<=dim;d++){var day=new Date(vy,vm,d),dk2=dateKey(day),s=st.sessions[dk2],cls="cell";
      var dm=midnight(day).getTime(),fut=dm>todayMid,req=isTrainingDay(plan,day),before=dm<createdMid,lab;
      if(s&&s.warm){cls+=s.deep?" deep":" warm";lab=s.deep?"full session":"trained";}
      else if(!fut&&dk2!==tk&&req&&!before){cls+=" miss";lab="missed";}
      else lab=fut?"upcoming":"";
      if(dk2===tk){cls+=" today";lab=(lab?lab+", ":"")+"today";}
      cal+='<div class="'+cls+'" role="img" aria-label="'+day.getDate()+(lab?" — "+lab:"")+'">'+d+'</div>';}
    cal+='</div><div class="calleg"><span><i class="swatch" style="background:color-mix(in oklab,var(--hero) 12%,transparent);border:1px solid var(--hero)"></i>trained</span><span><i class="swatch" style="background:var(--hero)"></i>full session</span><span><i class="swatch" style="background:transparent;border:1px dashed var(--bad)"></i>missed weekday</span></div></div>';
    var pw=programWeek(plan,now);
    var due=pw>=12?"w12":pw>=8?"w8":pw>=4?"w4":"base";
    var mx='<div class="divi"><span class="ml" role="heading" aria-level="2">LEETIFY CHECKPOINTS · WK '+pw+'/12</span></div><div class="card">';
    mx+='<p class="mhow" style="margin-top:0;">Type your Leetify numbers in at the start (BASE) and again at weeks 4 / 8 / 12. The chip shows movement from base.</p>'+'<p class="help" style="margin:0 0 12px;">Optional — Leetify’s free tier covers these. Skip it if you don’t use it: your streak, calendar and drills work without any of it.</p>';
    plan.targets.forEach(function(t,ti){
      var key=tkey(t.n), v=(st.metrics||{})[key]||{};
      var lb=!!t.lower;
      var latest=null;["w12","w8","w4"].some(function(kk){if(v[kk]!=null){latest=v[kk];return true;}return false;});
      var chip;
      if(v.base==null||latest==null)chip='<span class="delta na">—</span>';
      else{var dlt=Math.round((latest-v.base)*100)/100;var better=lb?dlt<0:dlt>0;
        chip=dlt===0?'<span class="delta na">±0</span>':'<span class="delta '+(better?"good":"bad")+'">'+(dlt>0?"+":"")+dlt+(better?" ▲":" ▼")+'</span>';}
      mx+='<div class="metric"><div class="mh"><span class="mname">'+esc(t.n)+'</span>'+chip+'</div><div class="mhow">'+esc(t.h)+benchHint(t.n,plan.profile)+'</div><div class="cps">';
      [["base","BASE"],["w4","WK 4"],["w8","WK 8"],["w12","WK 12"]].forEach(function(cp){
        mx+='<div class="'+(due===cp[0]?"due":"")+'"><label>'+cp[1]+'</label><input type="number" inputmode="decimal" step="any" aria-label="'+esc(t.n)+' — '+cp[1]+'" data-mk="'+key+'" data-mp="'+cp[0]+'" value="'+esc(v[cp[0]]!=null?v[cp[0]]:"")+'" placeholder="—"></div>';});
      mx+='</div></div>';});
    mx+='</div>';
    // the leak sits directly ABOVE the audit that produced it, so the claim and its
    // evidence are adjacent and you can check the one against the other
    // the contradiction sits directly UNDER the audit that produced it, so the evidence is adjacent
    // evidence sits after the audit that feeds it: what closed, what changed, and the case
    // you could actually make to someone who doesn't believe you
    return hd+youVsYou()+insightsCard(st)+milestoneRail(st)+milestonesCard(st)+cal+leakCard(st)+deathCard(st)+bottleneckCard(st)+
      leakHistoryCard(st)+changedCard(st)+proofCard(st)+mx+glossary();
  }

  // accept a pasted profile link, or a bare id, in whatever shape it arrives
  function lfyParseId(s){

  //
  // Only aim / positioning / utility come back on Leetify's 0-100 skill scale, so
  // only those three can be ranked against each other. clutch and opening are
  // returned on a different, rating-style scale (~0.05 where the others are ~80) —
  // verified against live profiles Jul 2026. Comparing across the two scales would
  // tick "clutch" and "entry" for every player alive, so those two options are
  // deliberately left to the user. Same for consistency and movement, which the
  // API has no field for at all.
  //
  // Counter-strafing and crosshair placement are judged on their own against the
  // per-bracket benchmarks the app already ships, independent of the aim score.
  function lfySuggest(d,profile){
    if(!d)return {ticks:[],why:{}};
    var rt=d.rating||{},s=d.stats||{},ticks=[],why={},rank=(profile&&profile.rank)||"unsure";
    var cats=[["_aim",lfyNum(rt.aim)],["positioning",lfyNum(rt.positioning)],["utility",lfyNum(rt.utility)]];
    var have=cats.filter(function(c){return c[1]!==null;});
    if(have.length>=2){
      have.sort(function(a,b){return a[1]-b[1];});
      var lo=have[0],hi=have[have.length-1];
      // only call something a weakness if it actually stands apart from the rest
      if(hi[1]-lo[1]>=8&&lo[0]!=="_aim"){
        ticks.push(lo[0]);
        why[lo[0]]="Leetify scores this "+Math.round(lo[1])+" where your strongest area is "+Math.round(hi[1]);
      }
    }
    var cs=lfyPct(s.counter_strafing_good_shots_ratio),bcs=LFY_BENCH.cstrafe[rank];
    if(cs!==null&&bcs&&cs<bcs){ticks.push("cstrafe");why.cstrafe="Counter-strafing "+cs+" against roughly "+bcs+"% average for your bracket";}
    var pa=lfyNum(s.preaim),bpa=LFY_BENCH.placement[rank];
    if(pa!==null&&bpa&&pa>bpa){ticks.push("placement");why.placement="Crosshair placement "+(Math.round(pa*10)/10)+" against roughly "+bpa+"° average for your bracket";}
    return {ticks:ticks,why:why};
  }
  function lfyProfileUrl(d){
    var sid=d&&d.steam64_id;
    return sid?"https://leetify.com/app/player/"+encodeURIComponent(sid):"https://leetify.com/";
  }
  function lfyFetch(input,cb){
    var p=lfyParseId(input);
    if(!p)return cb("That doesn't look like a Leetify link. Copy the address of your Leetify profile page.");
    if(typeof fetch!=="function")return cb("Not available here — pick manually below.");
    var q=(p.kind==="steam64"?"steam64_id=":"id=")+encodeURIComponent(p.id),done=false;
    var to=setTimeout(function(){if(!done){done=true;cb("Leetify didn't answer in time. Pick manually below.");}},9000);
    fetch(LFY_API+"/v3/profile?"+q,{method:"GET",credentials:"omit"}).then(function(r){
      if(r.status===404)throw new Error("nf");
      if(!r.ok)throw new Error("http");
      return r.json();
    }).then(function(j){
      if(done)return;done=true;clearTimeout(to);
      var pm=j&&j.privacy_mode?String(j.privacy_mode).toLowerCase():"";
      if(pm&&pm!=="public")return cb("That Leetify profile is private. Make it public, or pick manually below.");
      if(!j||(!j.stats&&!j.rating))return cb("Leetify has no stats for that profile yet. Pick manually below.");
      cb(null,j);
    })["catch"](function(e){
      if(done)return;done=true;clearTimeout(to);
      cb((e&&e.message==="nf")?"No Leetify profile found for that link.":"Couldn't reach Leetify — you may be offline. Pick manually below.");
    });
  }
  // Values are printed exactly as the API returns them — no rescaling, no added
  // units, no renaming (their section 5). Our reading of them is kept separate.
  function lfyRows(d){
    var s=d.stats||{},rt=d.rating||{},rows=[
      ["Aim",lfyNum(rt.aim)],["Positioning",lfyNum(rt.positioning)],["Utility",lfyNum(rt.utility)],
      ["Preaim",lfyNum(s.preaim)],["Spray accuracy",lfyNum(s.spray_accuracy)],
      ["Counter strafing good shots ratio",lfyNum(s.counter_strafing_good_shots_ratio)],
      ["Reaction time ms",lfyNum(s.reaction_time_ms)]
    ].filter(function(r){return r[1]!==null;});
    return rows.map(function(r){
      var v=Math.round(r[1]*100)/100;
      return '<div class="lfyrow"><span>'+esc(r[0])+'</span><b>'+v+'</b></div>';
    }).join("");
  }
  function lfyPanel(profile){

      return '<div class="card lfy">'+head+

        '<div class="lfynums">'+lfyRows(d)+'</div>'+
        '<div class="lfyattr">'+
          '<a href="'+esc(lfyProfileUrl(d))+'" target="_blank" rel="noopener noreferrer" class="lfylink">View on Leetify</a>'+

            '<img class="lfybadge dk" src="'+LFY_BADGE_DARK+'" alt="Data provided by Leetify">'+

      '<div class="lfyin"><input id="lfyUrl" type="text" inputmode="url" autocomplete="off" spellcheck="false" aria-label="Your Leetify profile link" placeholder="leetify.com/app/player/…"><button class="gbtn" id="lfyGo">USE IT</button></div>'+
      err+'</div>';
  }
  function glossary(){
    return '<div class="divi"><span class="ml" role="heading" aria-level="2">WHERE TO FIND THESE</span></div><div class="card">'+
      '<p class="mhow" style="margin:0 0 10px;">Open your <b style="color:var(--text);">Leetify</b> profile → any recent match → the <b style="color:var(--text);">Aim</b> tab. Every number below lives there.</p>'+
      '<div class="glo"><b>Counter-strafing %</b><span>Of your rifle shots (AWP &amp; crouched shots excluded), how often you were under 34% of max speed — where accuracy returns.</span></div>'+
      '<div class="glo"><b>Crosshair placement (°)</b><span>How far your crosshair sat from a head the moment you spotted someone. Lower is better.</span></div>'+
      '<div class="glo"><b>Time to Damage (ms)</b><span>Spotting an enemy → first damaging them. Your reaction, not your rank.</span></div>'+
      '<div class="glo"><b>Spray accuracy %</b><span>Of the bullets in your held sprays, how many landed on a body.</span></div>'+
      '<p class="help" style="margin-top:10px;">Heads-up: <b>Leetify Rating is zero-sum</b> (it\'s relative to your lobby, sums to zero across 10 players) — chase these skill numbers, not the rating.</p></div>';
  }
  function setMetric(key,part,val){
    var st=load();st.metrics=st.metrics||{};st.metrics[key]=st.metrics[key]||{};
    if(val===""||isNaN(parseFloat(val)))delete st.metrics[key][part];else st.metrics[key][part]=parseFloat(val);
    save(st);render();
  }

  /* ---------- v0.7: insights + sparklines ---------- */
  function warmDays(st){var o=[];for(var k in st.sessions){if(st.sessions[k]&&st.sessions[k].warm)o.push(k);}return o.sort();}
  // Best streak must honor the SAME freeze budget the live streak does, or the displayed record can
  // go backwards: while a freeze-bridged run is current, max(best,current) shows the higher (freeze)
  // value, then drops once only a strict best remains. Evaluating computeStreak (freeze-aware) from
  // each warm-day endpoint keeps the record consistent with curStreak and monotonic (the freeze
  // budget only grows as warmDays grows), and lets a freeze-bridged milestone be observed later.
  function bestStreak(st){
    var keys=warmDays(st);if(!keys.length)return 0;var fb=freezeBudget(st),best=0;
    for(var i=0;i<keys.length;i++){var s=computeStreak(st,parseKey(keys[i]),fb);if(s>best)best=s;}
    return best;}
  /* ---------- milestones / achievements (all derived from existing state) ---------- */
  function drillsTicked(st){var n=0;for(var k in st.sessions){var dr=st.sessions[k]&&st.sessions[k].drills;if(dr)for(var i in dr)if(dr[i])n++;}return n;}
  function feel5Count(st){var n=0;for(var k in st.sessions){if(st.sessions[k]&&st.sessions[k].feel===5)n++;}return n;}
  // lineup-derived counts — these reward the vault and the recall deck, which nothing did before
  function lineupCount(st){var n=0,l=st.lineups||{};for(var m in l)n+=(l[m]||[]).length;return n;}
  function lineupMaps(st){var n=0,l=st.lineups||{};for(var m in l)if((l[m]||[]).length)n++;return n;}
  function recallCount(st){return (st.settings&&st.settings.recalls)||0;}
  function hadComeback(st){var w=warmDays(st);for(var i=1;i<w.length;i++){if(Math.round((parseKey(w[i])-parseKey(w[i-1]))/86400000)>=5)return true;}return false;}
  function progWeek(st){return st.plan?programWeek(st.plan,new Date()):1;}
  /* Twelve badges. Names follow the v3 spec wherever the condition is something we can
     honestly compute; the spec's "Spray tamer", "Prefire" and "Clutch" are deliberately NOT
     here, because attributing a ticked drill to a focus after the fact is guesswork once the
     weekly rotation has been edited — a badge that might be lying is worse than no badge.
     Streak rungs beyond 14/30 belong to the milestone rail, not here, so the two don't
     duplicate each other. */
  var ACHIEVEMENTS=[
    {id:"first",t:"First Blood",d:"Tick your first drill.",goal:1,val:drillsTicked},
    {id:"wk1",t:"Week One",d:"Train four days.",goal:4,val:function(st){return warmDays(st).length;}},
    {id:"fortnight",t:"Fortnight",d:"Reach a 14-day streak.",goal:14,val:function(st){return Math.max(bestStreak(st),curStreak(st));}},
    {id:"streak30",t:"Locked In",d:"Reach a 30-day streak.",goal:30,val:function(st){return Math.max(bestStreak(st),curStreak(st));}},
    {id:"drills100",t:"Grinder",d:"Tick 100 drills.",goal:100,val:drillsTicked},
    // these three reward the vault and the recall deck — nothing did before
    {id:"vault",t:"Vault Keeper",d:"Save ten lineups of your own.",goal:10,val:lineupCount},
    {id:"cartographer",t:"Cartographer",d:"Save lineups on five different maps.",goal:5,val:lineupMaps},
    {id:"recall",t:"Recall",d:"Pass twenty-five lineup recall checks.",goal:25,val:recallCount},
    {id:"comeback",t:"Comeback",d:"Come back and train after a break.",goal:1,val:function(st){return hadComeback(st)?1:0;}},
    {id:"dialled",t:"Iron Hands",d:"Log a 5/5 hand-feel five times.",goal:5,val:feel5Count},
    {id:"days100",t:"Century",d:"100 training days in total.",goal:100,val:function(st){return warmDays(st).length;}},
    {id:"graduate",t:"Global",d:"Reach week 12 — the whole program.",goal:12,val:progWeek}
  ];
  function achState(st){return ACHIEVEMENTS.map(function(a){var cur=a.val(st)||0;return {id:a.id,t:a.t,d:a.d,cur:cur,goal:a.goal,earned:cur>=a.goal};});}
  // returns the newest just-unlocked achievement to celebrate, or null. The FIRST call
  // (after this feature ships) only baselines what's already earned — no retro-spam.
  function checkAchievements(st){
    if(!st.plan)return null;
    var first=(st.settings.seenAch===undefined),seen=st.settings.seenAch=st.settings.seenAch||{},fresh=null;
    achState(st).forEach(function(a){if(a.earned&&!seen[a.id]){seen[a.id]=1;if(!first)fresh=a;}});
    if(fresh||first)save(st);
    return fresh;
  }
  /* ---------- streak milestones: ONE source ----------
     The rail, the tier name and the share card all read this, so they can never disagree
     about what you've reached — three places quoting three different numbers is exactly
     how a progress screen stops being believable. */
  var STREAK_TIERS=[{n:3,t:"BRONZE"},{n:7,t:"SILVER"},{n:14,t:"GOLD"},
                    {n:30,t:"PLATINUM"},{n:60,t:"DIAMOND"},{n:100,t:"GLOBAL"}];
  function milestoneState(streak){
    var reached=null,next=null;
    for(var i=0;i<STREAK_TIERS.length;i++){
      if(streak>=STREAK_TIERS[i].n)reached=STREAK_TIERS[i];
      else{next=STREAK_TIERS[i];break;}
    }
    return {streak:streak,reached:reached,next:next,toGo:next?next.n-streak:0,tiers:STREAK_TIERS};
  }
  /* Freeze shields, and what they cost. A freeze used to be spent invisibly — the streak
     survived and the player learned nothing from it. Now the spent ones show dimmed, the
     spend is named, and the next earn is dated. */
  // the programme week, held still while paused — resume picks up where you left off
  function planWeek(st,now){
    var p=pauseInfo(st),when=(p&&isPausedOn(st,now||new Date()))?p.from:(now||new Date());
    return st.plan?programWeek(st.plan,when):1;
  }
  var PAUSE_WEEKS=[2,4,6];
  function pauseWord(n){return n===2?"two":n===4?"four":n===6?"six":String(n);}
  function pauseCard(st,now){
    var p=pauseInfo(st);if(!p)return "";
    var streak=curStreak(st,now);
    return '<div class="card pausecard"><div class="ml" style="color:var(--accInk);">PAUSED</div>'+
      '<p class="pausebig">Paused for '+pauseWord(p.weeks)+' weeks.</p>'+
      '<p class="mhow" style="margin:6px 0 0;">Your '+streak+'-day streak is held, not broken, and nothing is marked missed. '+
      'Come back and the plan resumes at week '+planWeek(st,now)+' — it does not restart.</p>'+
      '<button class="pbtn" data-resume="1" style="margin-top:12px;">RESUME NOW</button></div>';
  }
  function pauseSection(st){
    if(pauseInfo(st))return "";

      return '<button class="pausebtn" data-pause="'+w+'">'+w+' WEEKS</button>';}).join("");
    return '<div class="divi"><span class="ml" role="heading" aria-level="2">INJURY, EXAMS, LIFE</span></div>'+
      '<div class="card"><p class="mhow" style="margin:0 0 10px;">Stopping on purpose is not the same as dropping off. Pause and your streak is held, nothing is marked missed, and the plan waits at the week you are on.</p>'+
      '<div class="pauserow">'+btns+'</div></div>';
  }
  function freezeRow(st,now){
    var budget=freezeBudget(st);
    var det=streakDetail(st,now||new Date(),budget);
    if(!budget&&!det.spent)return "";
    var shields="";
    for(var i=0;i<budget;i++)
      shields+='<span class="frzs'+(i<det.spent?" spent":"")+'" aria-hidden="true">'+SHIELD+'</span>';
    // one freeze is earned per seven training days, so the next one is that far off
    var warm=warmDays(st).length,toNext=budget>=3?0:(7-(warm%7));
    var line=det.spent
      ? 'FREEZE '+det.spent+' OF '+budget+' SPENT'
      : 'FREEZE ×'+budget;

      ? (budget-det.spent)+' STILL HELD'+(toNext?' · EARN THE NEXT IN '+toNext+' DAY'+(toNext===1?'':'S'):'')
      : '';

      '<span class="frzrow">'+shields+'</span>'+
      '<span class="frzt">'+line+(sub?'<small>'+sub+'</small>':'')+'</span></div>';
  }
  function milestoneRail(st){
    var m=milestoneState(curStreak(st));
    var cells=STREAK_TIERS.map(function(T){
      var done=m.streak>=T.n,isNext=m.next&&m.next.n===T.n;
      return '<div class="mrcell'+(done?" on":"")+(isNext?" next":"")+'">'+
        '<div class="mrn">'+T.n+'</div><div class="mrt">'+T.t+'</div></div>';
    }).join("");
    var read=m.next
      ? '<b>'+m.toGo+'</b> day'+(m.toGo===1?"":"s")+' to '+m.next.t
      : 'Every milestone reached — '+m.streak+' days and counting.';
    return '<div class="card mrail"><div class="ml" style="color:var(--accInk);">STREAK MILESTONES'+
      (m.reached?' · '+m.reached.t:'')+'</div>'+
      '<div class="mrrow">'+cells+'</div>'+
      '<p class="mhow" style="margin:8px 0 0;">'+read+'</p></div>';
  }
  function milestonesCard(st){
    var list=achState(st),earned=list.filter(function(a){return a.earned;}).length;
    var rows=list.map(function(a){
      return '<div class="ach'+(a.earned?" on":"")+'"><span class="achico">'+MEDAL+'</span>'+
        '<div><div class="acht">'+esc(a.t)+'</div><div class="achd">'+esc(a.d)+'</div>'+
        '<div class="achp">'+(a.earned?"✓ UNLOCKED":Math.min(a.cur,a.goal)+" / "+a.goal)+'</div></div></div>';
    }).join("");
    return '<div class="divi"><span class="ml" role="heading" aria-level="2">MILESTONES · '+earned+'/'+list.length+'</span></div>'+
      '<div class="achgrid">'+rows+'</div>';
  }
  function weekCounts(st,n){var out=[],mon=mondayOf(new Date());
    for(var w=n-1;w>=0;w--){var start=addDays(mon,-7*w),c=0;
      for(var i=0;i<7;i++){var x=st.sessions[dateKey(addDays(start,i))];if(x&&x.warm)c++;}
      out.push(c);}
    return out;}
  function feelSeries(st,n){var keys=[];for(var k in st.sessions){if(st.sessions[k]&&st.sessions[k].feel>0)keys.push(k);}
    keys.sort();return keys.slice(-n).map(function(k){return st.sessions[k].feel;});}
  /* Charts carry their own numbers. The old version drew an unlabelled sparkline
     stretched to the container width, so eight empty weeks read as a row of dashes
     with one unexplained block on the end — testers found it ambiguous, fairly.
     Every bar now prints its value and the axis says what the ends mean.
     `scale` fixes the top of the axis (hand feel is always 1-5); omit it and the
     chart scales to its own tallest bar. */
  function barChart(vals,opts){
    if(!vals||!vals.length)return "";
    opts=opts||{};
    var any=false,i;
    for(i=0;i<vals.length;i++)if(vals[i]>0){any=true;break;}
    if(!any&&opts.emptyMsg)return '<div class="chempty">'+opts.emptyMsg+'</div>';
    var max=opts.scale||Math.max.apply(null,vals)||1,cols="";
    for(i=0;i<vals.length;i++){
      var v=vals[i],pct=v>0?Math.max(9,Math.round((v/max)*100)):0,last=(i===vals.length-1);
      cols+='<div class="bcol"><div class="btrack">'+
        (v>0?'<div class="bfill'+(last?" now":"")+'" style="height:'+pct+'%"></div>':'<div class="bzero"></div>')+
        '</div><div class="bval'+(v>0?"":" off")+'">'+v+'</div></div>';
    }
    // below ~4 bars the end labels are wider than the chart, so they would sit off
    // the bars they describe — the bar values alone are clear at that size
    var axis=(vals.length>=4&&(opts.from||opts.to))
      ?'<div class="baxis"><span>'+esc(opts.from||"")+'</span><span>'+esc(opts.to||"")+'</span></div>':'';
    // chart and axis share .binner so the end labels stay under the end bars
    return '<div class="bwrap">'+(opts.label?'<div class="bcap">'+esc(opts.label)+'</div>':'')+
      '<div class="binner"><div class="bchart">'+cols+'</div>'+axis+'</div></div>';
  }
  function insightsCard(st){
    var wds=warmDays(st),cur=curStreak(st),best=Math.max(bestStreak(st),cur);
    var fs=feelSeries(st,14),avg=fs.length?(fs.reduce(function(a,b){return a+b;},0)/fs.length):0;
    var tiles='<div class="stats4" data-tour="progress">'+
      '<div class="stt"><div class="v">'+cur+'</div><div class="k">Current streak</div></div>'+
      '<div class="stt"><div class="v">'+best+'</div><div class="k">Best streak</div></div>'+
      '<div class="stt"><div class="v">'+wds.length+'</div><div class="k">Days trained</div></div>'+
      '<div class="stt"><div class="v">'+(avg?avg.toFixed(1):"—")+'</div><div class="k">Avg hand feel</div></div></div>';
    var recent=fs.slice(-8);
    var bars=barChart(weekCounts(st,8),{label:"Sessions each week",from:"8 weeks ago",to:"this week",
      emptyMsg:"No sessions logged yet — your first one shows up here."});
    var feel=barChart(recent,{label:"How your hands felt, out of 5",scale:5,
      from:recent.length>1?recent.length+" sessions ago":"",to:recent.length>1?"most recent":""});
    var rows='<div class="card" style="margin-top:10px;">'+
      '<div class="sparkrow"><div class="sl"><b>Sessions / week</b><span>last 8 weeks</span></div>'+bars+'</div>'+
      '<div class="sparkrow"><div class="sl"><b>Hand feel</b><span>'+(recent.length?"out of 5":"1–5 scale")+'</span></div>'+
        (feel||'<div class="chempty">Rate your hand feel after a session and it charts here.</div>')+'</div></div>';
    return '<div class="divi"><span class="ml" role="heading" aria-level="2">INSIGHTS</span></div>'+tiles+rows+
      '<button class="btncopy" data-sharecard="1" style="margin-top:10px;">⬇ SAVE PROGRESS CARD (PNG)</button>';
  }

  /* ---------- v0.7: death audit (demo review) ---------- */
  var CAUSES=[["aim","Aim"],["pos","Position"],["util","Utility"],["info","Info"],["trade","No trade"]];
  var CAUSE_COL={aim:"var(--bad)",pos:"var(--info)",util:"var(--good)",info:"var(--hero)",trade:"var(--edge)"};
  function reviewTotals(st,days){
    var t={aim:0,pos:0,util:0,info:0,trade:0},now=new Date();
    for(var i=0;i<days;i++){var r=(st.reviews||{})[dateKey(addDays(now,-i))];
      if(r)for(var c in t){if(r[c])t[c]+=r[c];}}
    return t;}
  /* Leak of the week — the death audit already knows which cause is costing you most; it
     just never said so. Surfaced as one line, from a 7-day window, and only once there is
     enough logged to mean anything. Nothing invented: it names the cause you logged most. */
  var LEAKFIX={
    aim:"That's a mechanics week — the drills you already have are the fix.",
    pos:"Aim drills won't touch this one. Where you stand is the fix.",
    util:"Utility, not aim. Learn the throws that stop the round starting badly.",
    info:"You're dying to things you couldn't see. Slow down and get the info first.",
    trade:"You're dying alone. Play closer to someone who can trade you."
  };
  function leakOfWeek(st,minTotal){
    var t=reviewTotals(st,7),total=0,top=null;

  /* "You said aim. Your deaths say position." Re-reads the audit's OWN rows rather than

  var OFFPLAN=[["dm","Deathmatch"],["aim","Aim trainer"],["scrim","Scrim / team"],["prac","Map practice"],["other","Something else"]];

  /* ---------- Group D: evidence ----------
     Everything here is a receipt. The rule throughout: every number names where it came

  function reviewRange(st,now,fromDaysAgo,toDaysAgo){
    var t={aim:0,pos:0,util:0,info:0,trade:0},total=0;
    for(var i=toDaysAgo;i<=fromDaysAgo;i++){
      var r=(st.reviews||{})[dateKey(addDays(now||new Date(),-i))];
      if(!r)continue;
      for(var c in t){if(r[c]){t[c]+=r[c];total+=r[c];}}

  // A leak is "closed" when its SHARE of your deaths fell between an early window and a
  // recent one. Shares, not counts — logging more deaths overall must not read as a leak.
  function leakHistory(st,now){
    now=now||new Date();
    var early=reviewRange(st,now,60,31),recent=reviewRange(st,now,30,0);
    if(early.total<10||recent.total<10)return [];      // not enough either side to compare
    var out=[];
    CAUSES.forEach(function(c){
      var was=Math.round(early.t[c[0]]/early.total*100),nowPct=Math.round(recent.t[c[0]]/recent.total*100);
      if(was<15||nowPct>=was-5)return;                 // must have mattered, and actually fallen
      out.push({k:c[0],label:c[1],was:was,now:nowPct,drop:was-nowPct});
    });
    out.sort(function(a,b){return b.drop-a.drop;});

  // What changed since you started: the weakness you named in the quiz, against whatever

  var WEAK_LABEL={consistency:"Inconsistent night to night",spray:"Spray / recoil control",

    utility:"Utility (smokes/flashes)",positioning:"Positioning / game sense",

      if(latest===null)return;

    });
    if(!weak.length&&!moved.length)return null;
    return {weak:weak.map(function(w){return WEAK_LABEL[w]||w;}),moved:moved,days:warmDays(st).length};
  }
  function changedCard(st){
    var c=changedSince(st);if(!c)return "";

  /* Proof for a sceptic. Every row names its SOURCE, and the sources are the real ones:
     our checkpoint figures are entered by the player from Leetify, not measured by an

     earned. Then it states what it does NOT prove — understating it is what makes it
     usable in an argument. */
  function proofRows(st,now){
    var rows=[],c=changedSince(st),a=adherence(st,now,DRIFT_DAYS);
    if(c)c.moved.forEach(function(m){

  function firstWeekCard(st,now){

  var ALT_CASE={utility:"Slower to show on a scoreboard, but it wins rounds before the duel starts.",

      if(tag){x.fillStyle="#ABA7B2";x.font="700 15px Helvetica,Arial,sans-serif";x.textAlign="right";

      x.fillStyle="#ABA7B2";x.font="600 11px ui-monospace,Consolas,monospace";x.fillText("THIS WEEK",392,170);

  /* ---------- v0.7: match-night gate + stop-loss ---------- */
  /* ---------- arousal reappraisal (match nights) ----------
     The one psychological intervention in this app with FPS-specific, pre-registered
     evidence behind it: Sharpe et al. (2024), Applied Psychology 73(4), N=44 Counter-
     Strike players, within-subjects, counterbalanced. Reading a reappraisal script
     before playing under pressure raised shooting ACCURACY 66%→72% (d=0.51, p=.001).
     It did NOT significantly improve completion time (p=.111), so this must never be
     sold as making you faster — that null is underpowered, i.e. unproven rather than
     disproven. Raw means are shown rather than effect sizes because they are what a
     player can actually interpret. */
  function reappraisalCard(){
    return '<div class="card reapp" style="margin-bottom:12px;">'+
      '<div class="ml" style="color:var(--hero-ink);">NERVES · READ THIS BEFORE YOU QUEUE</div>'+
      '<p class="reapp-body">Heart up. Hands tense. Breathing gone shallow.</p>'+
      // deliberately no claim about reaction speed here: the study found no speed
      // benefit, so the script must not imply one either
      '<p class="reapp-body">That is not a warning that you are about to lose — it is your body getting ready. A racing heart is delivering more oxygen to your brain and your arm. That is what preparing to compete feels like, and the players who hold up under pressure feel it too.</p>'+
      '<p class="reapp-body"><b>You do not need to calm down. You need to let it work.</b></p>'+
      '<p class="reapp-cite">In the one controlled Counter-Strike experiment on this — 44 players, pre-registered — reading a script like this before playing under pressure raised shooting accuracy from <b>66% to 72%</b>. It did <b>not</b> make them faster, only more accurate. University-level players, on a practice map rather than ranked 5v5, measured on a single occasion.</p>'+
      '</div>';
  }
  function gateCard(sess){
    var g=sess.gate||{},losses=sess.losses||0;
    function chk(k,label){return '<button class="gcheck'+(g[k]?" on":"")+'" data-gate="'+k+'" aria-pressed="'+(g[k]?"true":"false")+'"><span class="gbox">'+CHK+'</span><span>'+label+'</span></button>';}
    var stop=losses>=2?'<div class="warnbanner" style="margin-top:13px;">🛑 <b>Stop-loss hit.</b> Two on the bounce — the next one gets played tilted. Call it here and come back warm.</div>':"";
    var auto=gsiLive()?'<div style="margin:10px 0 0;">'+statusChip("live","CS2 auto-tracking on")+'</div><p class="help" style="margin:6px 0 0;">Finished matches and losses log themselves.</p>':"";
    return '<div class="card gate" style="margin-bottom:12px;"><div class="ml" style="color:var(--hero-ink);">THE GATE · BEFORE YOU QUEUE</div>'+
      chk("warm","I warmed up — not cold-queueing")+
      chk("calm","I'm not tilted or fried")+
      '<div class="field" style="margin-top:12px;"><label for="pgoal">One process goal tonight</label>'+
      '<input id="pgoal" type="text" data-goal aria-label="Process goal for tonight" value="'+esc(sess.goal||"")+'" placeholder="e.g. stop before every shot"></div>'+
      '<div class="losswrap"><div><div class="ml">LOSSES TONIGHT</div><div class="lossn" style="color:'+(losses>=2?"var(--bad)":"var(--text)")+'">'+losses+'</div></div>'+
      '<div style="display:flex;gap:8px;"><button class="gbtn" data-loss="1">+1 LOSS</button><button class="gbtn" data-loss="0">RESET</button></div></div>'+
      auto+stop+'</div>';
  }

  /* ---------- interactions ---------- */
  function wire(st){
    var root=document.body;
    var gos=root.querySelectorAll("[data-go]");
    for(var i=0;i<gos.length;i++)(function(b){b.onclick=function(){go(b.getAttribute("data-go"));};})(gos[i]);
    var dst=root.querySelectorAll("[data-dest]");
    for(var di=0;di<dst.length;di++)(function(b){b.onclick=function(){goDest(b.getAttribute("data-dest"));};})(dst[di]);
    var advI=root.querySelector("[data-advice]");
    if(advI)advI.onchange=function(e){
      var s2=load();s2.settings.advice=String(e.target.value||"").trim().slice(0,140);save(s2);render();};
    var gr=root.querySelectorAll("[data-grad]");
    for(var gri=0;gri<gr.length;gri++)(function(b){b.onclick=function(){
      var s2=load();s2.settings.gradAck=b.getAttribute("data-grad");save(s2);render();};})(gr[gri]);
    var hx=root.querySelector("[data-hxcopy]");
    if(hx)hx.onclick=function(){var p=document.getElementById("hxpre");if(p)copyText(p.textContent,hx);};
    var sk=root.querySelectorAll("[data-skip]");
    for(var ski=0;ski<sk.length;ski++)(function(b){b.onclick=function(){
      var k=b.getAttribute("data-skip");
      // "easier" and "keep" are acknowledgements; only "swap" edits the plan, and it sends
      // you to the rotation rather than silently choosing a replacement for you
      if(k==="swap")go("plan");
      else{var s2=load();s2.settings.skipAck=dateKey(new Date());save(s2);render();}};})(sk[ski]);
    var df=root.querySelector("[data-driftfocus]");
    if(df)df.onclick=function(){go("plan");};   // the rotation is editable there, tap any day
    var ca=root.querySelectorAll("[data-coach]");
    for(var cai=0;cai<ca.length;cai++)(function(b){b.onclick=function(){
      var s2=load();applyCoachAnswer(s2,b.getAttribute("data-coach"),new Date());save(s2);render();};})(ca[cai]);
    var op=root.querySelectorAll("[data-offplan]");
    for(var opi=0;opi<op.length;opi++)(function(b){b.onclick=function(){
      var s2=load(),dk=dateKey(actDate());
      s2.offPlan=s2.offPlan||{};s2.offPlan[dk]=s2.offPlan[dk]||[];
      s2.offPlan[dk].push({k:b.getAttribute("data-offplan")});
      save(s2);render();};})(op[opi]);
    var od=root.querySelectorAll("[data-offdel]");
    for(var odi=0;odi<od.length;odi++)(function(b){b.onclick=function(){
      var s2=load(),dk=dateKey(actDate()),ix=parseInt(b.getAttribute("data-offdel"),10);
      if(s2.offPlan&&s2.offPlan[dk]){s2.offPlan[dk].splice(ix,1);save(s2);render();}};})(od[odi]);
    var td=root.querySelector("[data-tiltdismiss]");
    if(td)td.onclick=function(){tiltDismissed=true;render();};
    var wy=root.querySelectorAll("[data-why]");
    for(var wyi=0;wyi<wy.length;wyi++)(function(b){b.onclick=function(){
      var ix=parseInt(b.getAttribute("data-why"),10);
      openWhy=(openWhy===ix)?null:ix;render();};})(wy[wyi]);
    var rl=root.querySelectorAll("[data-restlog]");
    for(var rli=0;rli<rl.length;rli++)(function(b){b.onclick=function(){
      var dk=b.getAttribute("data-restlog"),s2=load();
      var sx=s2.sessions[dk]||{warm:false,deep:false,feel:0,drills:{}};
      sx.rest=!sx.rest;s2.sessions[dk]=sx;save(s2);render();};})(rl[rli]);
    var pz=root.querySelectorAll("[data-pause]");
    for(var pzi=0;pzi<pz.length;pzi++)(function(b){b.onclick=function(){
      var s2=load();s2.settings.pause={weeks:parseInt(b.getAttribute("data-pause"),10),from:dateKey(new Date())};
      save(s2);go("today");};})(pz[pzi]);
    var rsm=root.querySelector("[data-resume]");
    if(rsm)rsm.onclick=function(){
      var s2=load(),p=pauseInfo(s2);if(!p)return;
      // hold the programme clock: push plan.created forward by however long you were away,
      // so week 3 is still week 3 when you come back rather than the plan having moved on
      var now=new Date(),end=midnight(now)<midnight(p.until)?now:p.until;
      var days=Math.max(0,Math.round((midnight(end)-midnight(p.from))/86400000));
      if(s2.plan&&s2.plan.created&&days)s2.plan.created=dateKey(addDays(parseKey(s2.plan.created),days));
      delete s2.settings.pause;save(s2);render();};
    var mct=root.querySelector("[data-morecards]");
    if(mct)mct.onclick=function(){moreCards=mct.getAttribute("data-morecards")==="1";render();};
    var dgo=root.querySelectorAll("[data-duego]");
    for(var dgi=0;dgi<dgo.length;dgi++)(function(b){b.onclick=function(){
      var k=b.getAttribute("data-duego");
      if(k==="maps")go("maps");
      else{showReview=true;render();}};})(dgo[dgi]);
    var th=root.querySelectorAll("[data-theme-set]");
    for(var t=0;t<th.length;t++)(function(b){b.onclick=function(){setTheme(b.getAttribute("data-theme-set"));};})(th[t]);
    var rk=root.querySelectorAll('[data-act="retake"]');
    for(var r=0;r<rk.length;r++)rk[r].onclick=retake;
    var tct=root.querySelectorAll('[data-act="tour"]');
    for(var tci=0;tci<tct.length;tci++)tct[tci].onclick=function(){startTour();};
    var cb=root.querySelectorAll("[data-cal]");
    for(var cbi=0;cbi<cb.length;cbi++)(function(b){b.onclick=function(){viewDate=new Date(viewDate.getFullYear(),viewDate.getMonth()+parseInt(b.getAttribute("data-cal"),10),1);render();};})(cb[cbi]);
    var mi=root.querySelectorAll("[data-mk]");
    for(var mii=0;mii<mi.length;mii++)(function(el){el.onchange=function(){setMetric(el.getAttribute("data-mk"),el.getAttribute("data-mp"),el.value);};})(mi[mii]);
    var bft=root.querySelectorAll("[data-backfill]");
    for(var bi=0;bi<bft.length;bi++)bft[bi].onclick=function(){backfill=!backfill;render();};
    var eds=root.querySelectorAll("[data-editday]");
    for(var edi=0;edi<eds.length;edi++)(function(b){b.onclick=function(){
      var d=parseInt(b.getAttribute("data-editday"),10);
      editDay=(editDay===d)?null:d;render();};})(eds[edi]);
    var sds=root.querySelectorAll("[data-setday]");
    for(var sdi=0;sdi<sds.length;sdi++)(function(b){b.onclick=function(){
      if(editDay===null||editDay===undefined)return;

  function toggleDrill(i){
    var st=load(),plan=st.plan,act=actDate(),actK=dateKey(act),actDow=act.getDay();

    // nothing later: the weekly rotation is editable, so re-reading plan.weekly to decide
    // what index 2 was six weeks ago is a guess. Stamped days can be attributed exactly.

  var celeT, celeKey;
  /* ---------- "the assemble" — the signature moment ----------

     the streak numeral rolls up. Under 1.3s and SELF-CLEARING — it never asks to be

  /* ---------- last-resort failure surface ----------
