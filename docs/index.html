<script>
(function(){
  "use strict";
  var KEY="lockin.v1";
  var VERSION="0.42.0";
  var storageOk=true, mem=null;

  /* ---------- svg bits ---------- */
  // The v3 mark: the player's own two-shard emblem with a FULL-BLEED crosshair knocked out
  // over it. The knockout lines are stroked in the CONTAINER'S OWN background, so each call
  // site passes its background in — `bg` — or the cut renders as a visible line instead of a
  // hole. Stroke scales with size (size/22, clamped 1.1–2.6) so the cut stays proportional.
  // Never place a knockout line where it falls inside the emblem's negative space: there it
  // paints background over a hole and simply disappears.
  var EMBLEM_A="M31.25 0.88L31.31 1.31L29.81 6.5L23.81 26.19L16.38 30.88L10.13 27.31L10.19 27.13L16.5 23.5L17.5 22.75L18.31 21.56L20.5 14.38L20.69 12.38L20.13 11.13L19.63 10.63L16.5 8.81L16.5 8.63L22.44 5.19L31.25 0.94Z";
  var EMBLEM_B="M15.88 1.06L21.63 4.44L21.88 4.75L15.31 8.69L14.44 9.44L13.69 10.56L11.69 17.06L11.31 19.31L11.63 20.31L12.25 21.19L15.5 23.31L9.5 26.81L0.63 31.13L1.19 28.81L8.19 6L15.88 1.13Z";
  function emblem(size,bg){
    var s=Math.max(1.1,Math.min(2.6,(size||32)/22));
    return '<svg viewBox="0 0 32 32" fill="currentColor" aria-hidden="true">'+
      '<path d="'+EMBLEM_A+'"/><path d="'+EMBLEM_B+'"/>'+
      '<g stroke="'+(bg||"var(--knock,var(--bg))")+'" stroke-width="'+s.toFixed(2)+'" stroke-linecap="butt">'+
        '<path d="M16 0V32"/><path d="M0 16H32"/>'+
      '</g></svg>';
  }
  var RET=emblem(32,"var(--bg)");
  var RET_OLD='<svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" aria-hidden="true"><path d="M3 9V3h6M23 3h6v6M3 23v6h6M29 23v6h-6"/><path d="M16 8.5v3.5M16 20v3.5M8.5 16h3.5M20 16h3.5"/><circle cx="16" cy="16" r="1.9" fill="currentColor" stroke="none"/></svg>';
  var CHK='<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="square" aria-hidden="true"><path d="M3 8.5l3.5 3.5L13 4.5"/></svg>';
  var GEAR='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.8v3M12 18.2v3M2.8 12h3M18.2 12h3M5.5 5.5l2.1 2.1M16.4 16.4l2.1 2.1M18.5 5.5l-2.1 2.1M7.6 16.4l-2.1 2.1"/></svg>';
  var LIST='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3 6h.5M3 12h.5M3 18h.5"/></svg>';
  var DL='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" aria-hidden="true"><path d="M12 3v11M7 10l5 5 5-5M4 20h16"/></svg>';
  var UL='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" aria-hidden="true"><path d="M12 14V3M7 8l5-5 5 5M4 20h16"/></svg>';
  var CAL='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>';
  var MAPICON='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" aria-hidden="true"><path d="M12 21s7-6.3 7-11a7 7 0 1 0-14 0c0 4.7 7 11 7 11z"/><circle cx="12" cy="10" r="2.4"/></svg>';
  var COMPASS='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/></svg>';
  var TARGET='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4.6"/><circle cx="12" cy="12" r="1.3" fill="currentColor" stroke="none"/></svg>';
  var MOUSE='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" aria-hidden="true"><rect x="6" y="3" width="12" height="18" rx="6"/><path d="M12 7v4"/></svg>';
  var CAM='<svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true" style="vertical-align:-2px;"><path d="M3 8h4l2-2h6l2 2h4v12H3z"/><circle cx="12" cy="13" r="3.4"/></svg>';
  var SHIELD='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l7 3v5c0 4.5-3 8-7 10-4-2-7-5.5-7-10V6z"/></svg>';
  var MEDAL='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" aria-hidden="true"><circle cx="12" cy="14.5" r="5.5"/><path d="M8 3h8M9.5 3l2.5 6M14.5 3l-2.5 6"/></svg>';

  /* ---------- coaching catalog (research-corrected Jul 2026) ---------- */
  // where = the map or server you load; sub = how to approach it once there;
  // cue = the compressed live reminder (TIP on the drill screen); why = the fuller
  // read-ahead explanation shown in the Plan library. why is APPENDED last so the
  // existing arg positions never shift (inserting a param mid-signature broke the
  // protocol once already).
  // Fields, in the order the drill screen reads them: where=MAP, sub=DO,
  // goal=GOAL (what you're building), cue=MINDSET, m=RIGHT (a good rep),
  // rule=WRONG (a bad rep). why=the fuller read-ahead shown in the Plan library.
  // goal is APPENDED last so no existing arg position shifts.
  function D(t,where,sub,m,dur,core,cue,rule,why,goal){return {t:t,where:where||"",sub:sub,m:m,dur:dur,core:!!core,cue:cue||"",rule:rule||"",why:why||"",goal:goal||""};}
  var FOCI={
    cstrafe:{name:"Counter-strafing",why:"Your rifle regains accuracy the instant you slow below ~34% of top speed — a counter-strafe gets you there instantly (not a full stop, just a slow walk). Highest-leverage fix up to the mid ranks; it matters less at the very top.",drills:[
      D("Peek-stop-tap","aim_botz, with cl_showpos 1","Peek out, counter-strafe, fire the instant you stop","First bullet hits the head — you fired the instant you stopped, not a moment later.",8,true,"Stop, then shoot.","You fire while still moving, or you wait for a full stop you don't need — both give you away.","Your rifle only regains accuracy once you drop below ~34% of run speed. A counter-strafe — tapping the opposite key — gets you there instantly, so you can peek and fire in one motion instead of waiting for a full stop.","Fire the instant the counter-strafe slows you — accurate again well before a full stop."),
      D("Stop-then-shoot","aim_botz — the peek/spray walls","A-stop-fire, then D-stop-fire — both directions","The first bullet lands, with no gap between stopping and firing.",7,true,"Stop and fire as one move.","A gap between stopping and firing, or a shot while still sliding. Reset the rep.","Drills the timing until the stop and the click are one action. The moment your counter-strafe slows you is the moment to fire — wait for a full stop and you've given the peek away.","Make the stop and the shot a single motion."),
      D("Duels under fire","Aim Arena, or TRAINING.01 — combat mode","Dynamic bots that move and rush you, not static targets","You plant and fire cleanly even as they close on you.",5,false,"Strafe, plant, then fire.","You panic-spray on the move the moment one rushes you.","Doing this in an empty range is easy — doing it against something that moves is the real skill. Bots that rush you force you to counter-strafe under pressure instead of panic-spraying on the move.","Hold the stop-then-shoot discipline while they come at you.")]},
    consistency:{name:"Aim consistency",why:"Your aim's already there on good nights. The job is a routine that makes it show up every night — not new skill.",drills:[
      D("Tracking warm-up","aim_botz — moving bots on","Smooth-track a moving bot, then wide flicks between two — loosen the wrist the whole time","You keep the crosshair on the moving bot, and each flick lands first try.",10,true,"Smooth first, sharp later.","Cold-starting on hard one-taps, or turning it into a deathmatch.","Cold hands cost you the first ten minutes of every session. Opening with smooth tracking and easy flicks warms the wrist so the precision one-taps that follow start from a warm baseline. These three drills, in this order, are your fixed routine — run them the same way every time.","Warm and loose before precision — never cold into one-taps."),
      D("100 micro-adjust one-taps","aim_botz, or CS2Labs","Heads only on aim_botz — body hits don't count — or the MicroAdjust mode on CS2Labs","Each shot fires only after the crosshair has settled — slow and clean.",6,true,"Settle. Confirm. Click.","Clicking before it settles. A rushed rep is wasted; redo it.","Most missed one-taps come from clicking before the crosshair has settled. Slow, clean reps build the habit of confirming the shot first — speed follows accuracy, never the other way round.","Make the settled, confirmed one-tap your default shot."),
      D("Reaction baseline","TRAINING.01 — reaction mode","Same settings every session — write your number down","You log today's number and compare it to your usual one.",4,false,"React. Do not predict.","Guessing at the target instead of reacting, or not logging a bad number.","A reaction number you track over time tells you whether you're actually warm or just guessing. Slower than your usual means keep warming up, not queue.","Get an honest read on whether you're actually warm.")]},
    placement:{name:"Crosshair placement",why:"Keep the dot at head height and pre-aimed, so you win the first shot before it's a fight.",drills:[
      D("Prefire lines","Yprac Hub — prefire mode, or a timed prefire course","Run your map's route against the clock","Your crosshair stays at head height the whole route, and your time drops week to week.",8,true,"Head height, the whole way.","Crosshair drifts below head height. Restart the route.","Good players die less because their crosshair is already on the head when an angle opens. Running a fixed route against the clock trains head-height placement and makes clean-and-fast measurable.","Arrive on every angle already aimed at head height."),
      D("Head-height resets","aim_botz","Re-place to head level between every tap","After every tap your crosshair returns to head height on its own.",6,true,"Reset before you look.","Crosshair drops toward the floor between kills.","Between kills your crosshair drifts toward the floor, so the next duel starts with a flick you shouldn't need. Re-placing to head level after every tap makes the right position automatic.","Make re-placing to head level automatic between shots."),
      D("Randomised prefire","Aim Arena — prefire mode","Random angles, so no line can be memorised","You're pre-aimed before the angle opens, no flick needed.",5,false,"Pre-aim it, do not react to it.","You had to flick to the target — the placement failed.","Memorising one prefire line is a trick; placing your crosshair right on angles you can't predict is the skill. Random spawns force real placement instead of a rehearsed route.","Place correctly on angles you can't predict or memorise.")]},
    spray:{name:"Spray / recoil",why:"Learn the pattern so your held sprays land instead of leaking off target.",drills:[
      D("AK / M4 patterns","Recoil Master","Guided pattern reps, one weapon at a time","Your grouping tightens set to set as you pull the pattern down smoothly.",8,true,"Pull the pattern, don't fight it.","Fighting the recoil or yanking to centre. Reset fully between sprays.","Every rifle's recoil follows a fixed pattern. Once you know it you pull against it smoothly instead of yanking back to centre — guided reps drill the pattern into muscle memory.","Learn each rifle's recoil pattern so you can pull against it."),
      D("Spray transfers","aim_botz, or TRAINING.01 — spray mode","Burst and spray with hits-to-kill raised","You drag the recoil onto the second body without lifting off.",6,true,"Drag through. Do not re-aim.","Releasing to re-aim — that resets the pattern and ends the rep.","Two enemies close together should fall in one spray. Dragging the recoil from the first onto the second keeps the bullets landing; lifting off to re-aim resets the pattern and wastes it.","Kill a second target inside the same spray."),
      D("Range bursts","Target Training — shrink the targets, step back","Push the distance out, shrink the target","Each burst lands inside the ring; you reset between them.",5,false,"Four rounds, then breathe.","A burst longer than about six rounds. It doesn't count.","At distance a full spray throws bullets everywhere. Short bursts stay accurate and let the pattern reset between them — the further the target, the shorter the burst.","Stay accurate at distance with short, controlled bursts."),
      D("Commit to the torso","aim_botz — moving bots, or Aim Arena","Aim centre-mass on a mover and hold the spray in, instead of resetting for the head","You keep bullets on the body rather than lifting off to hunt for a headshot.",5,false,"Land it, then climb.","Lifting off a landing spray to re-aim at the head, and hitting nothing at all.","Chasing headshots you don't reliably hit loses duels you'd otherwise win. Body hits are not wasted damage: they tag the target (slowing them — how much depends on the weapon they're holding, and it stacks with hits in quick succession) and they aim-punch, kicking their view off you. A landing torso spray takes their movement and their aim away at the same time, and often climbs onto the head by itself.","Take the duel with body damage instead of losing it hunting heads.")]},
    utility:{name:"Utility",why:"Good util wins duels before they're duels — fewer coinflips, more rounds on your terms.",drills:[
      D("5 core smokes","Your best map — own server, or Yprac Hub utility mode","The five smokes that decide rounds, until automatic","All five land correctly with no mid-round lineup check.",8,true,"Line it up, then throw.","Checking the lineup while you throw. Redo it.","The handful of smokes that decide rounds on your map should be automatic, with no checking a lineup mid-round. Drill the same five until you can throw them under pressure.","Throw your map's round-deciding smokes without thinking."),
      D("2 entry pop-flashes","Your best map — own server","Only the flashes that support your own entries","Your peek lands while the flash is still active.",6,true,"Flash for the peek, not the kill.","You peeked after it popped, or flashed yourself. Redo.","A pop-flash only helps if you're peeking as it pops. Practise the flashes that support your own entry so the enemy is blind exactly when you swing, not a second too early.","Blind the enemy exactly as you swing, not a moment before."),
      D("Molotov denials","Your best map — own server","The standard clears, thrown from cover","The bounce and spread land on the spot; you're never exposed throwing it.",5,false,"Deny the spot, not the player.","Stepping into the open to throw, or missing the spot.","A molotov's job is to make a spot unholdable and buy time or space, not to farm a kill. Learn the standard clears so you can deny a plant or a hold from behind cover.","Make a spot unholdable while staying safe behind cover."),
      D("Open a smoke with HE","Your own server — smoke a choke, then HE it","Throw an HE into a live smoke and take the gap it opens","You get a clear look through the gap and take the duel on your timing.",5,false,"Punch the hole, then look.","Waiting for the smoke to clear. It won't — you get a window, not an opening.","CS2 smoke is a real volume rather than a flat screen, so it can be pushed around — this is the part players carrying old habits still get wrong. An HE thrown into a live smoke tears a large gap for roughly two to three seconds before the cloud fills back in. It never clears the whole thing, because the smoke spreads wider than the blast. Bullets do a smaller version of the same, and heavier calibres cut wider windows. That gap is a duel taken on your timing instead of walking in blind.","Buy a two-second window through a smoke, on your timing.")]},
    positioning:{name:"Positioning & game sense",why:"Being in the right place beats out-aiming from the wrong one. Cheaper wins, less variance.",drills:[
      D("Death audit","Your own demos","One death per round — name what actually killed you","For each death you name the real cause and tally it honestly.",10,true,"Was this fight mine to take?","Blaming your aim for a fight you should never have taken.","Most deaths are avoidable fights, not aim losses. Reviewing one death per round and naming the real cause turns “I keep dying” into a specific, fixable pattern.","Turn “I keep dying” into a named, fixable pattern."),
      D("Pro POV study","A pro demo on your map","Follow one player in your role, start to finish","You note three spots or timings from your role that you never play.",8,true,"Watch the position, not the aim.","Watching their crosshair instead of where they stand and when.","Watching a pro in your role shows you where to be, not just how they click. Note the positions and timings you never use — that gap is the difference between your game and theirs.","Steal positions and timings you don't currently use."),
      D("Off-angle setups","Your main map — own server","Build crossfires instead of head-on holds","You set a crossfire or off-angle; first contact is on your terms.",5,false,"First contact on your terms.","Holding the obvious head-on angle everyone already pre-aims.","Holding the angle everyone expects means you trade fairly at best. An off-angle or crossfire means you see them first and the duel is yours before it starts.","See the enemy first by holding where they don't expect.")]},
    clutch:{name:"Clutch craft",why:"Clutches are won on info, isolation and time — all trainable, not luck.",drills:[
      D("Retake 1vX reps","Retake servers, or TRAINING.01 — combat mode","Several opponents at once, so the fights stack up","You use angles and time so you only ever fight one at once.",10,true,"One fight at a time.","Taking two at the same time, or double-peeking the same angle.","A clutch is won by isolating each enemy into a 1v1, never by taking them all at once. Retake reps against multiple bots train you to use angles and time so you only ever fight one at a time.","Break a multi-kill situation into separate 1v1s."),
      D("Clock craft","Your own server, or a retake server","Fake defuses and sound baits against the timer","You fake a defuse or bait a step to force them to commit first.",6,true,"The timer is a weapon.","Rushing the fight when time was already on your side.","In a clutch the clock is on your side as often as your aim. The numbers you're playing against are fixed: the bomb runs 40 seconds from the plant, a defuse takes 10 seconds without a kit and 5 with one, and planting itself takes 3.5. Those tell you exactly how long you can afford to wait and the moment they have to commit — so faking a defuse, baiting a step, or forcing them to come to you wins rounds your crosshair alone wouldn't.","Win with the clock, not just the crosshair."),
      D("Sound-only reads","Your own demos, or a live match","Name the position from audio before you peek","You call the position from audio, then confirm it on the peek.",5,false,"Call it before you look.","Peeking blind before you've placed them by sound. Redo.","Good clutchers know where the enemy is before they peek. Practise naming positions from footsteps and shots alone so you enter every duel already knowing where to aim.","Know where they are before you ever peek.")]},
    entry:{name:"Opening duels",why:"Win the opening pick on your terms, not on a 50/50 wide-swing.",drills:[
      D("Opening-angle prefires","Aim Arena — prefire mode, or a timed prefire course","Only the angles you meet on first contact","You're already aimed at the first-contact angle as you enter.",8,true,"Already aimed when you arrive.","Arriving with your crosshair off the common angle.","As an entry you meet the same first-contact angles every round. Prefiring only those means your first bullet is on the head the instant you arrive, before they've reacted.","Put the first bullet on the head the instant you arrive."),
      D("Info jiggles","Your main map — own server","Shoulder-peek to bait, then commit","You bait the shot and get the position without committing.",5,true,"Info first. Duel second.","Committing to the duel before you actually have the info.","A shoulder-peek that draws a shot without committing tells your team exactly where the enemy is — worth more than a coin-flip duel. Bait the shot, then choose whether to commit.","Trade a shoulder-peek for information, not a coin-flip duel."),
      D("Trade timing","With a duo, or TRAINING.01 — rush mode","Enter together and refrag immediately","You enter with a teammate and refrag inside a couple of seconds.",6,false,"Die traded, never alone.","Entering alone, or trading too slowly to matter.","An entry's death only pays off if a teammate refrags immediately. Practise entering together and trading inside a second or two, so even your deaths win the round.","Make your death win the round by being traded instantly.")]},
    awp:{name:"AWP",why:"The AWP needs a near-full stop to be pinpoint — stricter than rifles — so counter-strafe into the shot; add repeek so a miss isn't a death.",drills:[
      D("One-taps → flicks","aim_botz, then Target Training","Statics first, then moving dots at 0.5 scale","The crosshair arrives, stops on the dot, and the shot confirms before you click. Hit rate over speed.",8,true,"Aim where it is going.","Flicking past and dragging back, or spraying at movers and hoping.","The AWP kills in one shot, so placement and timing beat raw speed. Statics build the one-tap; moving dots train you to lead the target and shoot where it's going, not where it is.","Trade speed for certainty — one shot has to land."),
      D("Stop-into-shot","aim_botz, or your main map","Counter-strafe straight into the scoped shot","You counter-strafe to a near-full stop before the click.",6,true,"Full stop, then click.","Clicking while you're still moving. The shot doesn't count.","The AWP is inaccurate unless you're almost fully stopped — stricter than a rifle. Counter-strafing straight into the scoped shot lets you take the angle and still land the near-stationary bullet it needs.","Take the angle and still land the near-stationary AWP shot."),
      D("Repeek discipline","Your main map — own server","Shot, then reposition before the next angle","After each shot you reposition and peek a fresh angle.",5,false,"Never the same pixel twice.","Re-peeking the same pixel the enemy is now aimed at.","After an AWP shot the enemy knows exactly where you were. Repositioning before the next peek means you show up somewhere new each time instead of dying to a prefire on your old spot.","Never die to a prefire on the spot you just shot from.")]},
    rifle:{name:"Rifling",why:"A reliable rifle so you stop bleeding the rounds you can't play for picks.",drills:[
      D("Pattern reps","Recoil Master","AK first, then M4 — full patterns","Your grouping tightens set to set as you pull the pattern down.",8,true,"Pull the pattern, don't fight it.","Fighting the recoil instead of pulling with it.","The AK and M4 each have a fixed recoil pattern. Learning to pull against it smoothly — AK first, it's the harder one — turns spraying from a gamble into a controllable tool.","Turn spraying from a gamble into a controllable tool."),
      D("Transfers","aim_botz","Multi-bot spray transfers, no re-aiming","You drag the recoil onto the second man without re-aiming.",6,true,"Drag through the second man.","Lifting off to re-aim, which resets the pattern.","Two enemies caught in the open should both fall in one spray. Dragging the recoil onto the second target without re-aiming keeps the pattern intact and the bullets landing.","Drop a second target inside the same spray."),
      D("Prefire angles","Yprac Hub — prefire mode, or a timed prefire course","Your main map, the full route every run","Your crosshair stays at head height the whole route, and your time keeps improving.",5,false,"Head height, the whole way.","Crosshair drifting off head height between angles.","On your main map you meet the same angles every round. Running the route with your crosshair at head height the whole way means you're pre-aimed on every common spot before it opens.","Be pre-aimed on every common spot before it opens.")]},
    movement:{name:"Movement",why:"Clean air-strafes and efficient jump pathing get you between fights faster and make you harder to hit inside them — and a peek you do not have to think about is a peek you win.",drills:[
      D("Air-strafe laps","Movement Mirage","Jump the objects, hold the strafe through corners","You hold the strafe through every corner with no speed lost.",8,true,"Hold the curve. Do not tap it.","Tapping the keys, or bleeding speed on the turns.","Air-strafing keeps or builds speed by holding a smooth curve, not tapping the keys. Jumping the objects on a movement map and holding the strafe through every corner trains the fluid input it needs.","Keep or build speed by holding a smooth curve."),

  /* ---------- date/streak core (unchanged, tested) ---------- */
  function two(n){return (n<10?"0":"")+n;}
  function dateKey(d){return d.getFullYear()+"-"+two(d.getMonth()+1)+"-"+two(d.getDate());}
  function parseKey(k){return new Date(k+"T00:00:00");}
  function addDays(d,n){var x=new Date(d);x.setDate(x.getDate()+n);return x;}
  function midnight(d){var x=new Date(d);x.setHours(0,0,0,0);return x;}
  function mondayOf(d){var x=midnight(d);return addDays(x,-((x.getDay()+6)%7));}
  function isFreebie(d){return d.getDay()<1||d.getDay()>4;}
  // a day counts as "training" per the plan (not a rest/match day); falls back to Mon–Thu with no plan.
  // Streak/miss logic keys off THIS, not a hard-coded weekday, so a low-days plan's prescribed rest
  // days neither break the streak nor paint as "missed".
  function isTrainingDay(plan,d){var wk=plan&&plan.weekly,f=wk?wk[d.getDay()]:null;if(f)return f!=="rest"&&f!=="match";return !isFreebie(d);}
  // freezes>0 lets the walk-back bridge that many missed TRAINING days without breaking —
  // the streak-freeze. Default 0 keeps it a strict streak (unchanged for every existing caller).
  /* ---------- a deliberate pause: injury, exams, life ----------
     A paused day is not a missed day. Nothing inside the window counts against the streak,
     nothing is painted as missed, and the programme clock does not advance — on resume the
     plan picks up at the week you left, it does not restart. */
  function pauseInfo(st){
    var p=st&&st.settings&&st.settings.pause;
    if(!p||!p.from||!p.weeks)return null;
    var from=parseKey(p.from),until=addDays(from,p.weeks*7);
    return {from:from,until:until,weeks:p.weeks,fromKey:p.from};
  }
  function isPausedOn(st,d){
    var p=pauseInfo(st);if(!p)return false;
    var t=midnight(d).getTime();
    return t>=midnight(p.from).getTime()&&t<midnight(p.until).getTime();
  }
  function isPaused(st,now){return isPausedOn(st,now||new Date());}
  // One walk, two answers: how long the streak is AND how many freezes it cost to hold it.
  // The streak used to survive a miss silently, which taught the player nothing.
  function streakDetail(st,today,freezes){
    var s=0,spent=0,d=new Date(today),budget=freezes||0,t=st.sessions[dateKey(d)];
    // Stop at the day the plan was created. Before freezes the walk simply broke on the first
    // untrained day, so pre-history was harmless; with a freeze budget it would instead SPEND
    // a freeze on days that existed before the user did, silently eating what they'd earned.
    var createdMid=(st.plan&&st.plan.created)?midnight(parseKey(st.plan.created)).getTime():0;
    if(!t||!t.warm)d=addDays(d,-1);
    while(true){
      if(midnight(d).getTime()<createdMid)break;
      var x=st.sessions[dateKey(d)];
      if(x&&x.warm){s++;d=addDays(d,-1);}
      else if(isPausedOn(st,d)){d=addDays(d,-1);}          // paused days are skipped, never spent on
      else if(!isTrainingDay(st.plan,d)){d=addDays(d,-1);}
      else if(budget>0){budget--;spent++;d=addDays(d,-1);}
      else break;}
    return {days:s,spent:spent,held:budget};
  }
  function computeStreak(st,today,freezes){return streakDetail(st,today,freezes).days;}
  // one freeze earned per 7 training days, capped at 3 — so a bad day can't wipe a long streak.
  function freezeBudget(st){return Math.min(3,Math.floor(warmDays(st).length/7));}
  function curStreak(st,now){return computeStreak(st,now||new Date(),freezeBudget(st));}
  // how many training days the plan defines (a user can put them anywhere in the week)
  function trainingDayCount(plan){var wk=plan&&plan.weekly;if(!wk)return 4;var n=0;for(var d=0;d<7;d++){var f=wk[d];if(f&&f!=="rest"&&f!=="match")n++;}return n;}
  function weekdayCount(st,mon){var c=0;for(var i=0;i<7;i++){var day=addDays(mon,i);if(!isTrainingDay(st.plan,day))continue;var x=st.sessions[dateKey(day)];if(x&&x.warm)c++;}return c;}
  /* ---------- week-4 / week-8 plan review ----------
     A coach looks at a block of training and adjusts. This reads only what's
     already on the device — ticked drills, logged deaths, Leetify checkpoints —
     and proposes ONE change with the evidence for it. It never invents movement:
     a metric is only reported when both the base and the checkpoint exist, and
     with too little logged it explicitly declines to suggest anything. */
  var LEAK_FOCUS={pos:"positioning",info:"positioning",util:"utility",trade:"entry",aim:"placement"};
  function planReview(st,now){
    var plan=st&&st.plan;if(!plan||!plan.created)return null;
    now=now||new Date();
    var wk=programWeek(plan,now),done=st.planReviews||{},n=null;
    // Once week 9 is reached the week-4 window is long past; showing it late (e.g. to
    // someone who was away weeks 5–8) is wrong, and letting it re-appear right after the
    // week-8 review is completed reads as a bug. So n=4 is only offered before week 9.
    if(wk>=9&&!done["8"])n=8;else if(wk>=5&&wk<9&&!done["4"])n=4;
    if(!n)return null;
    var c=parseKey(plan.created),from=addDays(c,n===4?0:28),to=addDays(c,n===4?28:56);
    if(to>now)to=now;
    // Everything below is bounded to THIS block's window [from,to). The card says "in
    // the block", so the leaks and hand-feel it cites come from the block — not the
    // last-28-days-from-today that reviewTotals/feelSeries return, which drift for anyone
    // who opens the review late (exactly the returning-after-a-lapse case).
    var trained=0,planned=0,leaks={aim:0,pos:0,util:0,info:0,trade:0},feelSum=0,feelN=0;
    for(var d=new Date(from);d<to;d=addDays(d,1)){
      var dk=dateKey(d);
      if(isTrainingDay(plan,d))planned++;
      var s=(st.sessions||{})[dk];if(s&&s.warm)trained++;
      if(s&&s.feel>0){feelSum+=s.feel;feelN++;}
      var rr=(st.reviews||{})[dk];if(rr)for(var ck in leaks){if(rr[ck])leaks[ck]+=rr[ck];}
    }
    // metric movement — only where the user actually entered both numbers
    var moved=[],cur=(n===4)?"w4":"w8";
    (plan.targets||[]).forEach(function(t){
      var m=(st.metrics||{})[tkey(t.n)];if(!m)return;
      var base=m.base,val=m[cur];
      if(base==null||val==null)return;
      var lower=!!t.lower,delta=Math.round((val-base)*100)/100;
      moved.push({n:t.n,base:base,val:val,delta:delta,
        better:lower?delta<0:delta>0, flat:Math.abs(delta)<0.01});
    });
    var sum=0,top=null;
    for(var k in leaks){sum+=leaks[k];if(top===null||leaks[k]>leaks[top])top=k;}
    var favg=feelN?Math.round((feelSum/feelN)*10)/10:null;
    var rv={n:n,weeks:(n===4?"1–4":"5–8"),next:(n===4?"5–8":"9–12"),
      trained:trained,planned:planned,moved:moved,leaks:leaks,leakTop:top,leakSum:sum,
      feel:favg,thin:(trained<5),suggest:null};
    if(rv.thin)return rv;                                  // too little logged to conclude anything
    // 1) a dominant logged leak that isn't what you're already training
    if(sum>=8&&top&&leaks[top]/sum>=0.35){
      var f=LEAK_FOCUS[top];
      if(f==="placement"&&plan.keystone==="placement")f="spray";
      if(f&&FOCI[f]&&f!==plan.keystone){
        var lbl=CAUSES.filter(function(x){return x[0]===top;})[0][1];
        rv.suggest={key:f,name:FOCI[f].name,
          why:lbl.toUpperCase()+" was "+leaks[top]+" of your "+sum+" logged deaths — the biggest single leak in the block."};
        return rv;
      }
    }
    // 2) counter-strafing past its plateau stops separating players (researched: ~78%)
    if(plan.keystone==="cstrafe"){
      for(var i=0;i<moved.length;i++){
        if(/Counter-strafing/i.test(moved[i].n)&&moved[i].val>=78){
          rv.suggest={key:"placement",name:FOCI.placement.name,
            why:"Counter-strafing is at "+moved[i].val+"%, past the ~78% plateau where it stops separating players. Crosshair placement still does."};
          return rv;
        }
      }
    }
    return rv;                                             // nothing to change — say so plainly
  }
  // Applies the recommendation WITHOUT resetting the programme: the created date,
  // history and the user's own match-night placement all survive.
  /* ---------- what a coach would ask ----------
     One question a week, and each answer does something GENUINELY different — including
     the answer that changes nothing, which says so rather than pretending to act. The
     adjustments are real edits to the weekly rotation, not copy.
     Asked on Sundays, answered once per week (settings.askWeek holds the Monday key). */
  /* ---------- plan drift ----------
     Silent failure is the worst outcome for a free coach: someone shows up for three weeks,
     nothing moves, and the app says nothing. This fires only when BOTH halves are evidenced —
     high adherence from the session log, and a checkpoint metric the player entered that has
     barely moved. If either is missing it stays quiet rather than guessing. It blames the
     PLAN, never the player. */
  /* ---------- the drill you keep skipping ----------
     Per-drill adherence, computed ONLY from sessions carrying a focus stamp (s.fk). Days
     logged before stamping existed are skipped rather than guessed at — the rotation is
     editable, so re-deriving what index 2 meant weeks ago would be fiction. The bars render
     the real percentages. It names the outlier and offers three EQUAL responses, because
     "too hard" and "wrong for you" are as likely as "lazy". */
  function drillAdherence(st,days,now){
    now=now||new Date();
    var seen={};
    for(var i=0;i<(days||DRIFT_DAYS);i++){
      var dk=dateKey(addDays(now,-i)),s=st.sessions[dk];
      if(!s||!s.fk)continue;                                  // unattributable — skip it
      var F=FOCI[s.fk];if(!F)continue;
      var list=drillList(F,st.plan);
      list.forEach(function(it){
        var key=s.fk+":"+it.i;
        seen[key]=seen[key]||{name:it.d.t,focus:F.name,shown:0,done:0};
        seen[key].shown++;
        if(s.drills&&s.drills[it.i])seen[key].done++;
      });
    }
    var out=[];
    for(var k in seen){var r=seen[k];r.pct=r.shown?Math.round(r.done/r.shown*100):0;out.push(r);}
    out.sort(function(a,b){return a.pct-b.pct;});
    return out;
  }
  function skippedDrill(st,now){
    var rows=drillAdherence(st,DRIFT_DAYS,now).filter(function(r){return r.shown>=4;});
    if(rows.length<2)return null;                             // need something to compare against
    var worst=rows[0],rest=rows.slice(1);
    var restMin=Math.min.apply(null,rest.map(function(r){return r.pct;}));
    if(worst.pct>=40||restMin<70)return null;                 // only when it's a genuine outlier
    return {worst:worst,rows:rows,restMin:restMin};
  }
  function skippedCard(st,now){
    var s=skippedDrill(st,now);if(!s)return "";
    var bars=s.rows.map(function(r){
      return '<div class="skrow"><span class="skname">'+esc(r.name)+'</span>'+
        '<span class="skbar"><i style="width:'+r.pct+'%"'+(r===s.worst?' class="bad"':'')+'></i></span>'+
        '<span class="skpct">'+r.pct+'%</span></div>';}).join("");
    return '<div class="card skipcard"><div class="ml" style="color:var(--accInk);">THE DRILL YOU KEEP SKIPPING</div>'+
      '<div class="skwrap">'+bars+'</div>'+
      '<p class="mhow" style="margin:8px 0 0;">You have done <b style="color:var(--text);">'+esc(s.worst.name)+'</b> in '+s.worst.pct+'% of the sessions it was on, while everything else sits above '+s.restMin+'%. That is not laziness — a drill skipped this consistently is either too hard or wrong for you.</p>'+
      '<div class="skopts">'+
      '<button class="gbtn" data-skip="easier">MAKE IT EASIER</button>'+
      '<button class="gbtn" data-skip="swap">SWAP IT OUT</button>'+
      '<button class="gbtn" data-skip="keep">KEEP IT</button></div></div>';
  }
  var DRIFT_DAYS=21, DRIFT_ADHERENCE=0.75, DRIFT_FLAT=0.03;
  function adherence(st,now,days){
    now=now||new Date();var planned=0,trained=0;
    for(var i=0;i<(days||DRIFT_DAYS);i++){
      var d=addDays(now,-i);
      if(isPausedOn(st,d))continue;
      if(!isTrainingDay(st.plan,d))continue;
      planned++;
      var s=st.sessions[dateKey(d)];
      if(s&&s.warm)trained++;
    }
    return {planned:planned,trained:trained,pct:planned?trained/planned:0};
  }
  // the biggest movement across any checkpoint the player actually filled in
  function metricMove(st){
    var best=null,ms=st.metrics||{},targets=(st.plan&&st.plan.targets)||[];
    targets.forEach(function(t){
      var m=ms[tkey(t.n)];if(!m||m.base==null)return;
      var latest=null;["w12","w8","w4"].forEach(function(p){if(latest===null&&m[p]!=null)latest=m[p];});
      if(latest===null)return;
      var base=+m.base,now=+latest;
      if(!isFinite(base)||!isFinite(now)||!base)return;
      var rel=Math.abs((now-base)/base);
      if(!best||rel<best.rel)best={n:t.n,base:base,now:now,rel:rel,delta:+(now-base).toFixed(2)};
    });
    return best;
  }
  function driftCheck(st,now){
    if(!st.plan)return null;
    var a=adherence(st,now);
    if(a.planned<8||a.pct<DRIFT_ADHERENCE)return null;      // not enough shown up, or not enough days
    var m=metricMove(st);
    if(!m||m.rel>DRIFT_FLAT)return null;                    // no entered metric, or it did move
    return {adherence:Math.round(a.pct*100),trained:a.trained,planned:a.planned,metric:m};
  }
  function driftCard(st,now){
    var d=driftCheck(st,now);if(!d)return "";
    var m=d.metric;
    return '<div class="card driftcard"><div class="ml" style="color:var(--accInk);">THE PLAN IS NOT WORKING</div>'+
      '<p class="driftbig">You showed up '+d.trained+' of '+d.planned+' days. The habit is not the problem.</p>'+
      '<div class="driftrow"><span>Adherence</span><b>'+d.adherence+'%</b></div>'+
      '<div class="driftrow"><span>'+esc(m.n)+'</span><b>'+m.base+' → '+m.now+'</b></div>'+
      '<p class="mhow" style="margin:8px 0 0;">'+esc(m.n)+' has barely moved while you kept turning up. That means the plan is wrong, not you — and the fix is to change the plan.</p>'+
      '<div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;">'+
      '<button class="pbtn" data-act="retake">RETAKE THE QUIZ</button>'+
      '<button class="gbtn" data-driftfocus="1">CHANGE ONE FOCUS</button></div></div>';
  }
  var COACH_Q="Which round did you lose this week that you should have won?";
  var COACH_ANSWERS=[
    {k:"eco",  t:"An eco round",          fx:"utility",
     changes:"Utility takes one of your training days this week. Losing to an eco is usually a util problem, not an aim one."},
    {k:"buy",  t:"A full-buy gun round",  fx:null,
     changes:"Nothing changes. Losing a fair gun round is the game working as intended — the plan you're on already trains for it."},
    {k:"clutch",t:"A 1v1 clutch",         fx:"clutch",
     changes:"Clutch scenarios go on your last training day of the week, so you practise them tired rather than fresh."},
    {k:"none", t:"Nothing stands out",    fx:null,
     changes:"The plan holds. I'll ask again on Sunday — if nothing stands out two weeks running, that's worth knowing too."}
  ];
  function coachAsk(st,now){
    now=now||new Date();
    if(!st.plan)return null;
    if(now.getDay()!==0)return null;                        // Sundays only
    var wk=dateKey(mondayOf(now));
    if(st.settings&&st.settings.askWeek===wk)return null;   // already answered this week
    return {week:wk};
  }
  // apply an answer to the actual weekly rotation
  function applyCoachAnswer(st,k,now){
    var a=null;COACH_ANSWERS.forEach(function(x){if(x.k===k)a=x;});
    if(!a)return st;
    st.settings=st.settings||{};
    st.settings.askWeek=dateKey(mondayOf(now||new Date()));
    st.settings.askAnswer=k;
    if(a.fx&&FOCI[a.fx]&&st.plan&&st.plan.weekly){
      // take the LAST training day of the week so the new work lands late, not first
      var slot=null;
      for(var d=0;d<7;d++){var f=st.plan.weekly[d];if(f&&f!=="rest"&&f!=="match")slot=d;}
      if(slot!==null){
        st.plan.weekly[slot]=a.fx;

    return st;
  }
  function coachCard(st,now){
    var ask=coachAsk(st,now);
    var answered=st.settings&&st.settings.askAnswer&&st.settings.askWeek===dateKey(mondayOf(now||new Date()));
    if(!ask&&!answered)return "";
    if(answered){
      var a=null;COACH_ANSWERS.forEach(function(x){if(x.k===st.settings.askAnswer)a=x;});
      if(!a)return "";
      return '<div class="card coachcard"><div class="ml" style="color:var(--accInk);">WHAT CHANGES</div>'+
        '<p class="mhow" style="margin:6px 0 0;"><b style="color:var(--text);">'+esc(a.t)+'</b> — '+esc(a.changes)+'</p></div>';
    }
    var opts=COACH_ANSWERS.map(function(a){
      return '<button class="coachopt" data-coach="'+a.k+'">'+esc(a.t)+'</button>';}).join("");
    return '<div class="card coachcard"><div class="ml" style="color:var(--accInk);">WHAT A COACH WOULD ASK</div>'+
      '<p class="coachq">'+esc(COACH_Q)+'</p><div class="coachopts">'+opts+'</div></div>';
  }
  function applyReview(st,key){
    var old=st.plan,p2=generatePlan(old.profile||{},key);
    var seq=[],d;
    for(d=0;d<7;d++){var f=p2.weekly[d];if(f!=="match"&&f!=="rest")seq.push(f);}
    var w={},i=0;
    for(d=0;d<7;d++){
      var slot=old.weekly[d];
      if(slot==="match"||slot==="rest")w[d]=slot;          // their match nights stay theirs
      else if(seq.length)w[d]=seq[i++%seq.length];

  }
  /* ---------- coming back after a gap ----------
     The point where habit apps lose people: you return to a zeroed streak, a
     calendar of misses and a banner telling you off. This detects a real lapse
     and replaces the telling-off with the smallest possible way back in.
     Counted in MISSED TRAINING DAYS, not calendar days — five days away is
     normal on a two-day-a-week plan and a genuine lapse on a four-day one. */
  var LAPSE_MIN=3;
  function lapseInfo(st,now){
    var plan=st&&st.plan;if(!plan)return null;
    now=now||new Date();
    var warm=warmDays(st);
    if(!warm.length)return null;                      // never trained yet — that's onboarding, not a lapse
    var last=parseKey(warm[warm.length-1]);
    var gap=Math.round((midnight(now)-midnight(last))/86400000);
    if(gap<2)return null;
    var missed=0;
    for(var d=addDays(last,1);midnight(d)<midnight(now);d=addDays(d,1))
      if(isTrainingDay(plan,d)&&!isPausedOn(st,d))missed++;   // a paused day was never missed
    if(missed<LAPSE_MIN)return null;                  // a normal gap for their own cadence
    var nextName="";
    if(!isTrainingDay(plan,now)){
      for(var i=1;i<=7;i++){var nd=addDays(now,i);
        if(isTrainingDay(plan,nd)){nextName=nd.toLocaleDateString(undefined,{weekday:"long"});break;}}
    }
    return {days:gap,missed:missed,week:programWeek(plan,now),best:bestStreak(st),
      total:warm.length,canTrainToday:isTrainingDay(plan,now),next:nextName};
  }
  function lapseCard(lp){
    if(!lp)return "";
    var back=lp.canTrainToday
      ? '<p class="lapseback">One drill. Five minutes. That is all it takes to be back on.</p>'+
        '<div class="revacts"><button class="pbtn" data-quickstart="1">START A 5-MIN SESSION</button></div>'
      : '<p class="lapseback">Today is not a training day on your plan'+(lp.next?' — your next one is <b>'+esc(lp.next)+'</b>':'')+'. Nothing to make up.</p>';
    return '<div class="card lapsecard"><div class="ml" style="color:var(--hero-ink);">WELCOME BACK'+(playerTag()?', '+esc(playerTag().toUpperCase()):'')+'</div>'+
      '<p class="lapselede">You were away '+lp.days+' days — '+lp.missed+' training '+(lp.missed===1?"day":"days")+
      ' missed. That happens, and <b>the plan does not restart.</b></p>'+
      '<div class="lapsestats">You are still in <b>week '+lp.week+'</b> of 12 · best streak <b>'+lp.best+
      '</b> '+(lp.best===1?"day":"days")+' · <b>'+lp.total+'</b> '+(lp.total===1?"day":"days")+' trained in total</div>'+
      back+'</div>';
  }
  function reviewCard(st,rv){
    if(!rv)return "";
    var lines="";
    // training on a rest day is legitimate, so trained can exceed planned — "13 of 12" reads broken
    lines+=(rv.trained<=rv.planned)
      ?'<div class="revrow">You trained <b>'+rv.trained+'</b> of '+rv.planned+' planned days.</div>'
      :'<div class="revrow">You trained <b>'+rv.trained+'</b> days — '+rv.planned+' were planned.</div>';
    if(rv.feel!=null)lines+='<div class="revrow">Average hand feel <b>'+rv.feel+'</b> / 5.</div>';
    rv.moved.forEach(function(m){
      var verdict=m.flat?"unchanged":(m.better?"moving":"gone the wrong way");
      lines+='<div class="revrow'+(m.flat?"":(m.better?" good":" bad"))+'">'+esc(m.n)+' <b>'+m.base+' → '+m.val+'</b> — '+verdict+'.</div>';
    });

    if(rv.leakSum>0){
      var lbl=CAUSES.filter(function(x){return x[0]===rv.leakTop;})[0][1];
      lines+='<div class="revrow">Biggest logged leak: <b>'+esc(lbl.toUpperCase())+'</b> ('+rv.leaks[rv.leakTop]+' of '+rv.leakSum+' deaths).</div>';

    else if(rv.suggest)

        '<p class="revwhy">'+esc(rv.suggest.why)+' Your match nights, streak and history all stay exactly as they are.</p>'+
        '<div class="revacts"><button class="pbtn" data-rev="apply">APPLY IT</button>'+
        '<button class="gbtn" data-rev="keep">KEEP MY PLAN</button></div>';

    return '<div class="card revcard"><div class="ml" style="color:var(--hero-ink);">WEEK '+rv.n+' REVIEW · WEEKS '+rv.weeks+'</div>'+
      lines+tail+'</div>';
  }

  /* ---------- feedback loop: post-match debrief + weekly recap ----------
     The debrief turns a match into one honest data point (a leak, a win, how you felt);
     the recap rolls the week up on the next Monday and points at next week's focus. */
  var MOODS=[["fried","Fried"],["flat","Flat"],["fine","Fine"],["good","Good"],["locked","Locked in"]];
  /* Auto-logged match summary. GSI has been recording the result all along and never showed
     it back — this reads the matches already stored for the day and states them plainly, so
     the debrief starts from what happened rather than from memory. Nothing is invented: if
     GSI never ran, there are no matches and this renders nothing. */
  function autoDebrief(st,dk){
    var ms=((st.matches||{})[dk])||[];
    if(!ms.length)return "";
    var rows=ms.slice(-3).map(function(m){
      var score=(m.ct!=null&&m.t!=null)?(m.ct+"–"+m.t):"";
      var word=m.result==="win"?"Won":m.result==="loss"?"Lost":m.result==="tie"?"Tied":"Played";
      var map=m.map?String(m.map).replace(/^de_/,""):"";
      return '<div class="adrow"><b>'+esc(word)+'</b>'+
        (map?'<span>'+esc(map)+'</span>':'')+
        (score?'<span class="adsc">'+esc(score)+'</span>':'')+'</div>';
    }).join("");
    var n=ms.length;
    return '<div class="card adcard"><div class="adtop"><div class="ml" style="color:var(--accInk);">TONIGHT</div>'+
      statusChip("cap","Auto-logged")+'</div>'+rows+
      '<p class="mhow" style="margin:8px 0 0;">'+n+' match'+(n===1?"":"es")+' recorded by CS2 auto-tracking. Nothing to confirm — it already counted.</p></div>';
  }
  function debriefCard(st,dk){
    var db=(st.debriefs||{})[dk]||{};
    var leakChips=CAUSES.map(function(c){
      return '<button class="mchip'+(db.leak===c[0]?" on":"")+'" aria-pressed="'+(db.leak===c[0]?"true":"false")+'" data-dbleak="'+c[0]+'">'+esc(c[1])+'</button>';}).join("");
    var moodChips=MOODS.map(function(m){
      return '<button class="mchip'+(db.mood===m[0]?" on":"")+'" aria-pressed="'+(db.mood===m[0]?"true":"false")+'" data-dbmood="'+m[0]+'">'+esc(m[1])+'</button>';}).join("");
    return '<div class="divi"><span class="ml" role="heading" aria-level="2">AFTER THE MATCH</span></div>'+
      '<div class="card"><p class="mhow" style="margin-top:0;">One honest read on tonight — it becomes your week’s data.</p>'+
      '<div class="dbk">WHAT LET YOU DOWN MOST</div><div class="mapchips">'+leakChips+'</div>'+
      '<div class="dbk" style="margin-top:12px;">ONE THING THAT CLICKED</div>'+
      '<div class="field"><input type="text" data-dbwin maxlength="80" autocomplete="off" placeholder="e.g. held my crosshair at head height all night" value="'+esc(db.win||"")+'"></div>'+
      '<div class="dbk" style="margin-top:12px;">WALKING AWAY FEELING</div><div class="mapchips">'+moodChips+'</div></div>';
  }
  function weeklyRecap(st,now){
    if(!st.plan)return null;
    now=now||new Date();
    var thisKey=dateKey(mondayOf(now));
    if((st.settings.lastRecap||"")===thisKey)return null;              // already shown this week
    var lastMon=addDays(mondayOf(now),-7),lastSun=addDays(mondayOf(now),-1);
    var trained=0,planned=0,feelSum=0,feelN=0,leaks={aim:0,pos:0,util:0,info:0,trade:0};
    for(var d=new Date(lastMon);d<=lastSun;d=addDays(d,1)){
      var dk=dateKey(d);

  // Top-of-app update notice. Desktop only — the web/PWA build auto-updates
  // through the service worker, so it never needs one. Rendered into #updbar on
  // every tab (not just Today) so a new version can't hide in Setup. Dismiss is a
  // session-only flag: it reappears next launch or if a newer version is found.
  function updateBanner(){
    if(!isNative)return "";
    if(UPD.state==="installing")
      return '<div class="updbar-in"><span class="ml">⬆ UPDATING…</span>'+
        '<span class="updbar-sub">Lockin will relaunch on its own.</span></div>';
    if(UPD.state!=="available"||UPD.dismissed===UPD.version)return "";
    return '<div class="updbar-in">'+
      '<span class="ml">⬆ UPDATE READY · v'+esc(UPD.version)+'</span>'+
      '<span class="updbar-sub">A few seconds, and your streak is kept.</span>'+
      '<span class="updbar-act"><button class="updbar-go" data-updnow="1">UPDATE NOW</button>'+
      '<button class="updbar-x" data-upddismiss="1" aria-label="Dismiss until next launch">✕</button></span></div>';
  }

  function reminderTick(){
    if(!isNative&&!notifyGranted())return;
    var st=load(),r=st.settings.reminder;
    if(!r||!r.on||!r.time)return;
    var now=new Date(),tk=dateKey(now);
    if(st.settings.remLast===tk)return;                       // already nudged today
    var hm=/^(\d{1,2}):(\d{2})$/.exec(r.time);if(!hm)return;
    var target=new Date(now);target.setHours(+hm[1],+hm[2],0,0);
    if(now.getTime()<target.getTime())return;                 // level-triggered: fires at/after the time, with catch-up
    st.settings.remLast=tk;save(st);
    var s=st.sessions[tk];
    if(!(s&&s.warm))pushNotify("Time to lock in — ten focused minutes. Don't hand them the worst version of you.");
  }

  /* ---------- onboarding ---------- */

        '</div></div>';

        '<div class="dsp" style="font-size:clamp(26px,7vw,34px);">YOUR POCKET CS2 COACH.</div>'+
        '<p style="color:var(--muted);font-size:15px;max-width:42ch;">Answer '+QUIZ.length+' quick questions and Lockin builds you a personalised training plan you can actually stick to — free, forever. No coach required.</p>'+

        '<button class="pbtn" id="beginBtn" style="padding:14px 30px;">BUILD MY PLAN ▸</button>'+
        '<div class="ml">YOUR ANSWERS STAY ON YOUR DEVICE</div>'+
        '</div></div>';
      document.getElementById("beginBtn").onclick=function(){
        var ti=document.getElementById("tagIn"),tag=ti?String(ti.value||"").trim().slice(0,24):"";
        var s=load();s.settings.tag=tag;save(s);          // kept in settings, survives quiz + retake

    }
    var qi=step-1,item=QUIZ[qi];
    var sel=answers[item.id]||(item.multi?[]:null);
    var segs="";for(var s2=0;s2<QUIZ.length;s2++)segs+='<div class="seg'+(s2<step?" on":"")+'"></div>';
    var itemOpts=(typeof item.opts==="function")?item.opts(answers):item.opts;

    // first) and arrow keys move between them — the semantics role="radio" promises.
    var rove=0;if(!item.multi){for(var fi=0;fi<itemOpts.length;fi++){if(sel===itemOpts[fi][0]){rove=fi;break;}}}
    var opts=itemOpts.map(function(o,oi){
      var on=item.multi?(sel.indexOf(o[0])>=0):(sel===o[0]);

    }).join("");
    var canNext=item.multi?true:(sel!=null);
    host.innerHTML='<div class="wrap" style="max-width:480px;padding-top:26px;">'+
      '<div style="display:flex;justify-content:space-between;align-items:center;"><span class="wordmark">LOCK<b>IN</b></span><span class="ml">0'+step+' / 0'+QUIZ.length+'</span></div>'+

      (item.id==="weak"?lfyPanel(answers):'')+

    var os=host.querySelectorAll(".opt");
    for(var i=0;i<os.length;i++)(function(b){b.onclick=function(){

        if(!down&&!up)return;

        if(ci<0)ni=down?0:vals.length-1;else ni=down?(ci+1)%vals.length:(ci-1+vals.length)%vals.length;

      var run=function(){
        var inp=document.getElementById("lfyUrl"),val=inp?inp.value:"";

        lfyFetch(val,function(err,data){
          if(err){LFY.state="err";LFY.err=err;LFY.data=null;renderOnboard();return;}
          LFY.state="ok";LFY.data=data;

            LFY.applied=true;
            var arr=(answers.weak||[]).slice(),t=lfySuggest(data,answers).ticks;
            for(var i=0;i<t.length;i++)if(arr.indexOf(t[i])<0)arr.push(t[i]);

      };

    document.getElementById("nextB").onclick=function(){
      if(step<QUIZ.length){step++;obFocus="q";renderOnboard();}
      else{
        generating=true;renderOnboard();
        setTimeout(function(){
          var st=load();var plan=generatePlan(answers);plan.created=(st.plan&&st.plan.created)?st.plan.created:dateKey(new Date());
          st.plan=plan;save(st);
          // Leetify's guidelines ask that their data not be stored. The plan above is
          // built from the user's own answers; the response itself is dropped here.
          LFY={state:"idle",data:null,err:"",applied:false};
          generating=false;revealed=plan;renderOnboard();
        },1400);
      }
    };
    // Restore keyboard focus after the innerHTML swap: to the question heading on a step
    // change (so a screen reader announces the new question), or back to the option you
    // just toggled. Without this, every render drops focus to <body>.
    if(obFocus==="q"){var qh=document.getElementById("qq");if(qh)qh.focus();}
    else if(obFocus&&obFocus.v){var of=host.querySelector('.opt[data-v="'+obFocus.v+'"]');if(of)of.focus();}

  }

  /* ---------- app shell ---------- */
  function boot(scr){
    screen=scr||"today";
    document.getElementById("onboard").style.display="none";
    document.getElementById("app").style.display="";
    document.getElementById("tabbar").style.display="";   // let the breakpoint decide: tabs on mobile, sidebar on desktop
    render();
    // baseline already-earned milestones on first run (no retro-spam); later, a time-based
    // unlock (e.g. reaching week 6) gets its moment on launch.
    try{var _a=checkAchievements(load());if(_a)celebrate(0,esc(_a.t.toUpperCase()),"MILESTONE UNLOCKED");}catch(_){}
  }
  /* ---------- v3 navigation: five destinations, not seven ----------
     Seven icon-only tabs at 375px was the core failure. Five destinations with permanently
     visible labels replace it; two of them group a pair of screens behind sub-tabs. The
     screen model underneath is unchanged, so every existing data-go="plan" pointer, the
     tour anchors and the deep links all keep working. */
  var DESTS=[
    {k:"today",   l:"TODAY",    ic:RET,     screens:["today"]},
    // "Practice", never "Train" — a TRAIN tab beside a MAPS tab collides with the map Train
    {k:"practice",l:"PRACTICE", ic:TARGET,  screens:["plan","drills"]},
    {k:"maps",    l:"MAPS",     ic:MAPICON, screens:["maps"]},
    {k:"progress",l:"PROGRESS", ic:CAL,     screens:["progress"]},
    {k:"more",    l:"MORE",     ic:GEAR,    screens:["gear","setup"]}
  ];
  function destOf(scr){
    for(var i=0;i<DESTS.length;i++)if(DESTS[i].screens.indexOf(scr)>=0)return DESTS[i];
    return DESTS[0];
  }
  // remember which screen you were last on inside a grouped destination, so tapping
  // PRACTICE returns you to Drills if that's where you were, not always to Plan
  var lastSub={practice:"plan",more:"gear"};
  function go(s){
    screen=s;
    var d=destOf(s);
    if(d.screens.length>1)lastSub[d.k]=s;
    render();
  }
  function goDest(k){
    for(var i=0;i<DESTS.length;i++){
      if(DESTS[i].k!==k)continue;
      var d=DESTS[i];
      // MORE is a sheet on mobile (where the dock has no room for two more tabs); on
      // desktop the sidebar lists Gear and Setup directly, so there's nothing to open.
      if(d.k==="more"&&window.matchMedia&&!window.matchMedia("(min-width:720px)").matches){openMore();return;}
      go(d.screens.length>1?(lastSub[d.k]||d.screens[0]):d.screens[0]);
      return;
    }
  }
  var moreKey=null;
  function openMore(){
    var el=document.getElementById("sheet");if(!el)return;
    el.innerHTML='<div class="shscrim" data-sheet-close="1"></div>'+
      '<div class="shbody" role="dialog" aria-modal="true" aria-label="More">'+
        '<div class="shgrab" aria-hidden="true"></div>'+
        '<div class="ml" style="color:var(--accInk);margin-bottom:10px;">MORE</div>'+
        '<button class="shrow" data-go="gear">'+MOUSE+'<span>Gear<small>Sens, crosshair, launch options</small></span></button>'+
        '<button class="shrow" data-go="setup">'+GEAR+'<span>Setup<small>Profile, reminders, backup, data</small></span></button>'+
        '<button class="gbtn" data-sheet-close="1" style="width:100%;margin-top:12px;">CLOSE</button>'+
      '</div>';
    el.classList.add("show");
    var app=document.getElementById("app");if(app)app.setAttribute("inert","");
    var tb=document.getElementById("tabbar");if(tb)tb.setAttribute("inert","");
    var first=el.querySelector(".shrow");if(first&&first.focus)try{first.focus();}catch(_){}
    if(!moreKey){moreKey=function(e){if(e.key==="Escape")closeMore();};document.addEventListener("keydown",moreKey);}
    var cl=el.querySelectorAll("[data-sheet-close]");
    for(var i=0;i<cl.length;i++)cl[i].onclick=closeMore;
    var gs=el.querySelectorAll("[data-go]");
    for(var j=0;j<gs.length;j++)(function(b){b.onclick=function(){closeMore();go(b.getAttribute("data-go"));};})(gs[j]);
  }
  function closeMore(){
    var el=document.getElementById("sheet");
    if(el){el.classList.remove("show");el.innerHTML="";}
    var app=document.getElementById("app");if(app)app.removeAttribute("inert");
    var tb=document.getElementById("tabbar");if(tb)tb.removeAttribute("inert");
    if(moreKey){document.removeEventListener("keydown",moreKey);moreKey=null;}
  }
  // Sub-tabs inside Practice. The selected one must be UNAMBIGUOUS — a 1px outline was too
  // subtle to read at a glance — so it takes a solid accent fill with the facet, and the
  // strip is captioned with what you're actually looking at.
  function subTabs(scr){
    if(["plan","drills"].indexOf(scr)<0)return "";
    function t(k,l){
      var on=scr===k;
      return '<button class="subtab'+(on?" on facet":"")+'" role="tab" aria-selected="'+(on?"true":"false")+'" data-go="'+k+'">'+l+'</button>';
    }

      '<div class="subcap">— VIEWING '+(scr==="drills"?"DRILLS":"PLAN")+'</div>';
  }

  /* ---------- first-run guided tour (spotlight coach-marks) ----------
     A dark overlay with a lit cut-out around one element at a time, walking a new user
     through every section so features aren't missed. Skippable, replayable from the
     sidebar, and shown once automatically (settings.tourSeen). The overlay lives outside
     #main, so navigating between screens mid-tour never disturbs it. */
  var TOUR=[
    {title:"Welcome to Lockin",body:"A quick tour of where everything lives, so nothing gets missed. Skip whenever you like."},
    {screen:"today",sel:".snav, #tabbar",k:"GETTING AROUND",title:"Move around here",body:"Five places, that's the whole app: Today, Practice, Maps, Progress and More. Practice holds your plan and your drills; More holds your gear and settings. On mobile they're along the bottom."},
    {screen:"today",sel:'[data-tour="today"]',k:"TODAY",title:"Your day, in one place",body:"Your streak and this week up top; the day's drills to tick off are just below, with a hand-feel log. Ten focused minutes counts as a day."},
    {screen:"plan",sel:'[data-tour="plan"]',k:"PLAN",title:"Your 12-week plan",body:"Your diagnosis, the phase-by-phase arc, and a weekly rotation you can rearrange to match when you actually play."},
    {screen:"drills",sel:'[data-tour="drills"]',k:"DRILLS",title:"What to train",body:"Every drill for your focus with a read-ahead why, how to measure each one, and the coach-built protocol you can run start to finish."},
    {screen:"maps",sel:'[data-tour="maps"]',k:"MAPS",title:"Get the training maps",body:"One-click Steam Workshop downloads — the desktop app even shows which you already have — plus utility jobs and prefire routes for all seven maps."},
    {screen:"progress",sel:'[data-tour="progress"]',k:"PROGRESS",title:"See it working",body:"Streak, calendar and hand-feel trend, optional Leetify checkpoints, and a death audit that names your biggest leak."},
    {screen:"gear",sel:'[data-tour="gear"]',k:"GEAR",title:"Your config, one tap away",body:"Sens, DPI and eDPI, your crosshair code and launch options — kept here so you can copy them without leaving a match."},
    {screen:"setup",sel:'[data-tour="setup"]',k:"SETUP",title:"Make it yours",body:"Your profile, a daily reminder, backup and restore — and you can retake the quiz or replay this tour any time."},
    {title:"That's the tour",body:"Replay it whenever from the sidebar, or from Setup on mobile. Now go tick your first drill."}
  ];
  var TOUR_I=-1, tourKey=null, tourReturnFocus=null;
  function tourTarget(sel){
    if(!sel)return null;
    var els=document.querySelectorAll(sel);
    for(var i=0;i<els.length;i++){if(els[i].offsetParent!==null||els[i].getClientRects().length)return els[i];}
    return els[0]||null;
  }
  function startTour(){
    if(!load().plan)return;                       // nothing to tour without a plan
    tourReturnFocus=document.activeElement;
    // a real modal: take the app + tab bar out of the tab order so a keyboard user can't Tab onto
    // (and Space-activate) the dimmed nav behind the tour. Mirrors the guided-session overlay.
    var ap=document.getElementById("app"),tbn=document.getElementById("tabbar");
    if(ap)ap.setAttribute("inert","");if(tbn)tbn.setAttribute("inert","");
    TOUR_I=0;
    if(!tourKey){
      tourKey=function(e){
        if(TOUR_I<0)return;
        if(e.key==="Escape"){e.preventDefault();endTour();}
        else if(e.key==="ArrowRight"||e.key==="Enter"){e.preventDefault();TOUR_I++;showTourStep();}
        else if(e.key==="ArrowLeft"&&TOUR_I>0){e.preventDefault();TOUR_I--;showTourStep();}
      };
      document.addEventListener("keydown",tourKey);
    }
    showTourStep();
  }
  function endTour(){
    TOUR_I=-1;
    var t=document.getElementById("tour");if(t){t.style.display="none";t.className="";t.innerHTML="";}
    var ap=document.getElementById("app"),tbn=document.getElementById("tabbar");
    if(ap)ap.removeAttribute("inert");if(tbn)tbn.removeAttribute("inert");
    if(tourKey){document.removeEventListener("keydown",tourKey);tourKey=null;}
    var st=load();if(!st.settings.tourSeen){st.settings.tourSeen=true;save(st);}
    if(tourReturnFocus&&tourReturnFocus.focus){try{tourReturnFocus.focus();}catch(_){}}
    tourReturnFocus=null;
  }
  function showTourStep(){
    if(TOUR_I<0)return;
    if(TOUR_I>=TOUR.length){endTour();return;}
    var step=TOUR[TOUR_I];
    if(step.screen&&screen!==step.screen){screen=step.screen;render();}   // navigate first
    // synchronous: getBoundingClientRect below forces the layout we need, and this keeps
    // the tour working even where requestAnimationFrame is paused (a hidden/idle tab).
    placeTour(step);
  }
  function placeTour(step){
    var t=document.getElementById("tour");if(!t||TOUR_I<0)return;
    var el=step.sel?tourTarget(step.sel):null;
    if(el)try{el.scrollIntoView({block:"center",inline:"nearest"});}catch(_){}
    var center=!el,last=TOUR_I===TOUR.length-1;
    t.style.display="block";t.className=center?"center":"";
    t.innerHTML='<div class="tdim" data-tour-act="none"></div>'+(center?'':'<div class="tspot"></div>')+
      '<div class="tpop" role="dialog" aria-modal="true" aria-label="App tour" tabindex="-1">'+
        (step.k?'<div class="tk">'+esc(step.k)+'</div>':'')+
        '<div class="tt">'+esc(step.title)+'</div><p class="tb">'+esc(step.body)+'</p>'+
        '<div class="tnav"><span class="tsteps">'+(TOUR_I+1)+' / '+TOUR.length+'</span>'+
          (last?'':'<button class="tskip" data-tour-act="skip">Skip</button>')+
          (TOUR_I>0?'<button class="tbtn" data-tour-act="back">Back</button>':'')+
          '<button class="tbtn pri" data-tour-act="next">'+(last?"Done":"Next")+'</button>'+
        '</div></div>';
    var pop=t.querySelector(".tpop");
    if(el){
      var r=el.getBoundingClientRect(),spot=t.querySelector(".tspot"),pad=8;
      spot.style.top=(r.top-pad)+"px";spot.style.left=(r.left-pad)+"px";

  /* ---------- TODAY ---------- */
  // "Never miss twice" must not scold someone for a day before their plan existed — a
  // brand-new user has no history to have missed. Same plan.created floor the calendar uses.
  function missedYesterday(st,now){
    var plan=st&&st.plan;if(!plan)return false;
    var yday=addDays(now,-1);
    if(!isTrainingDay(plan,yday))return false;
    if(isPausedOn(st,yday))return false;                       // you were paused, not slacking
    var createdMid=plan.created?parseKey(plan.created).getTime():0;
    if(midnight(yday).getTime()<createdMid)return false;      // before this plan existed
    // "never miss twice" protects a habit you've started. Nagging someone who has never
    // trained isn't a reminder, it's just discouraging — they get the cue prompt instead.
    var sess=st.sessions||{},started=false;
    for(var k in sess){if(sess[k]&&sess[k].warm){started=true;break;}}
    if(!started)return false;
    var s=sess[dateKey(yday)];
    return !(s&&s.warm);
  }
  // Rest completes the pattern; it does not break it. Counts scheduled rest days for the
  // current week and how many you've actually logged, so a full week reads as COMPLETE.
  function restWeek(st,now){
    var mon=mondayOf(now||new Date()),planned=0,logged=0;
    for(var i=0;i<7;i++){
      var day=addDays(mon,i);
      if(!(st.plan&&st.plan.weekly&&st.plan.weekly[day.getDay()]==="rest"))continue;
      planned++;
      var s=st.sessions[dateKey(day)];
      if(s&&s.rest)logged++;
    }
    return {planned:planned,logged:logged,done:planned>0&&logged>=planned};
  }

  function weekCells(st,now){
    var mon=mondayOf(now),tk=dateKey(now),sh=["M","T","W","T","F","S","S"],full=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"],todayMid=midnight(now).getTime(),h="";
    var createdMid=(st.plan&&st.plan.created)?parseKey(st.plan.created).getTime():0; // don't mark days before the plan existed as missed
    for(var k=0;k<7;k++){var day=addDays(mon,k),dk=dateKey(day),s=st.sessions[dk];
      var isT=dk===tk,dm=midnight(day).getTime(),fut=dm>todayMid,req=isTrainingDay(st.plan,day),before=dm<createdMid;

  /* The quiet week. Coming back from a lapse to a FULL plan is precisely why people don't

     on the screen rather than done silently — a plan that shrinks without saying so just
     looks broken. QUIET_DAYS counts from the first day trained after the gap. */
  var QUIET_DAYS=4;
  function quietWeek(st,now){
    now=now||new Date();
    var warm=warmDays(st);if(warm.length<2)return null;
    // find the most recent return: a training day logged after a gap long enough to lapse
    for(var i=warm.length-1;i>0;i--){
      var cur=parseKey(warm[i]),prev=parseKey(warm[i-1]);
      var gapDays=Math.round((midnight(cur)-midnight(prev))/86400000);

  // which drills to show for a focus, given the plan's time budget — core-only for the 10-min tier.
  // Preserves each drill's ORIGINAL index (completion is stored by index) so nothing shifts.

     belongs to, whether that focus is your keystone (which the quiz picked), and the death
     audit when it independently points the same way. Nothing is asserted that isn't derived. */
  /* Deload. Every fourth week of the programme the load is actually halved — the durations

  function isDeloadWeek(st,now){

    // conditionals any more. Each card declares how fast its moment passes and the stack

  /* ---------- v0.29: lineup pictures ----------
     A lineup is visual — "aim at the antenna tip" is useless mid-match. You screenshot the
     throw once (Steam F12 / Win+Shift+S), paste it in, and it's yours offline forever.
     Pictures live in IndexedDB, NEVER localStorage: that's a ~5MB budget shared with every
     other app on this origin, and filling it would cost you your plan and streak. They are
     downscaled on the way in, and kept in memory too so export/desktop-mirror stay cheap.
     We never ship anyone else's lineup images — the per-map links point you at the sources. */
  var IMG_MAXW=1100, IMG_Q=0.72, IMG_PER=4;
  var IMGS={};            // id -> dataURL (mirror of the IndexedDB store)
  var idbP=null;
  function idb(){
    if(idbP)return idbP;
    idbP=new Promise(function(res){
      try{
        if(!window.indexedDB)return res(null);
        var rq=indexedDB.open("lockin-img",1);
        rq.onupgradeneeded=function(){try{rq.result.createObjectStore("img");}catch(_){}};
        rq.onsuccess=function(){res(rq.result);};
        rq.onerror=function(){res(null);};
        rq.onblocked=function(){res(null);};
      }catch(_){res(null);}
    });
    return idbP;
  }
  // every write is best-effort: losing a picture must never break the app or the lineup text
  function imgPut(id,data){
    IMGS[id]=data;
    return idb().then(function(db){
      if(!db)return;
      try{db.transaction("img","readwrite").objectStore("img").put(data,id);}catch(_){}
    });
  }
  function imgDrop(id){
    delete IMGS[id];
    return idb().then(function(db){
      if(!db)return;
      try{db.transaction("img","readwrite").objectStore("img")["delete"](id);}catch(_){}
    });
  }
  function imgLoadAll(){
    return idb().then(function(db){
      if(!db)return;
      return new Promise(function(res){
        try{
          var tx=db.transaction("img","readonly"),s=tx.objectStore("img");
          var kq=s.getAllKeys(),vq=s.getAll();
          tx.oncomplete=function(){
            try{var ks=kq.result||[],vs=vq.result||[];for(var i=0;i<ks.length;i++)IMGS[ks[i]]=vs[i];}catch(_){}
            res();
          };
          tx.onerror=function(){res();};
        }catch(_){res();}
      });
    });
  }
  // Downscale + recompress so a 4K screenshot doesn't cost megabytes. Read as a data: URL
  // rather than a blob: URL because the CSP allows data: for images and blob: deliberately isn't.
  function shrinkImage(file,cb){
    if(!file||!/^image\//.test(file.type||""))return cb(null);
    var fr=new FileReader();
    fr.onload=function(){
      var img=new Image();
      img.onload=function(){
        try{
          var sc=Math.min(1,IMG_MAXW/(img.width||1));
          var c=document.createElement("canvas");
          c.width=Math.max(1,Math.round(img.width*sc));
          c.height=Math.max(1,Math.round(img.height*sc));
          c.getContext("2d").drawImage(img,0,0,c.width,c.height);
          var out=c.toDataURL("image/webp",IMG_Q);
          if(out.slice(0,15)!=="data:image/webp")out=c.toDataURL("image/jpeg",IMG_Q);   // Safari
          cb(out&&out.length>32?out:null);
        }catch(_){cb(null);}
      };
      img.onerror=function(){cb(null);};
      img.src=fr.result;
    };
    fr.onerror=function(){cb(null);};
    fr.readAsDataURL(file);
  }
  function lineupAt(st,mapId,idx){var a=(st.lineups||{})[mapId];return a&&a[idx];}
  function addLineupPic(mapId,idx,file){
    shrinkImage(file,function(data){
      if(!data)return;
      var st=load(),l=lineupAt(st,mapId,idx);
      if(!l)return;
      l.im=l.im||[];
      if(l.im.length>=IMG_PER)return;                       // a lineup needs a few frames, not an album
      var id="im_"+Date.now().toString(36)+Math.random().toString(36).slice(2,8);
      l.im.push(id);
      imgPut(id,data);
      // straight on to the aim frame if the pair isn't complete — two is the baseline
      var next=l.im.length;
      PICTARGET=(next<PICROLE.length)?idx:null;
      PICSLOT=(next<PICROLE.length)?next:null;
      save(st);render();
    });
  }
  function dropLineupPics(l){var im=(l&&l.im)||[];for(var i=0;i<im.length;i++)imgDrop(im[i]);}
  // Ctrl+V anywhere while a lineup is armed drops the screenshot straight in — the whole point
  // is that grabbing a throw takes two seconds, not a file-dialog round trip.
  if(typeof document!=="undefined")document.addEventListener("paste",function(e){
    if(PICTARGET===null||!e.clipboardData)return;
    var items=e.clipboardData.items||[];
    for(var i=0;i<items.length;i++){
      if(items[i].kind==="file"&&/^image\//.test(items[i].type||"")){
        var f=items[i].getAsFile();
        if(f){e.preventDefault();addLineupPic(load().settings.mainMap||MAPS[0].id,PICTARGET,f);return;}
      }
    }
  });
  // Two frames is the baseline for a lineup: where you stand, and where you aim. Anything
  // past that is a bonus (the landing, a mid-air marker), so only the first two get a role.
  var PICROLE=["STAND HERE","AIM HERE"];
  function picRole(i){return PICROLE[i]||"EXTRA";}
  // read-only strip (the recall reveal) — labelled so the pair reads as stand/aim, not two photos
  function picStrip(l,cls){
    var im=(l&&l.im)||[];if(!im.length)return "";
    var out="";
    for(var i=0;i<im.length;i++){
      var d=IMGS[im[i]];
      if(d)out+='<div class="picslot"><button class="lnthumb" data-pic="'+esc(im[i])+'" aria-label="Enlarge: '+picRole(i)+'"><img src="'+esc(d)+'" alt=""></button>'+
        '<div class="pslab">'+picRole(i)+'</div></div>';
    }
    return out?'<div class="lnthumbs'+(cls?" "+cls:"")+'">'+out+'</div>':"";
  }
  // editable slots in the vault: both baseline slots are ALWAYS shown, so a lineup missing its
  // aim frame displays its own gap instead of looking finished.
  function picSlots(l,li){
    var im=(l&&l.im)||[],out="",n=Math.min(IMG_PER,Math.max(PICROLE.length,im.length));
    for(var i=0;i<n;i++){
      var id=im[i],d=id&&IMGS[id];
      if(d){
        out+='<div class="picslot"><button class="lnthumb" data-pic="'+esc(id)+'" aria-label="Enlarge: '+picRole(i)+'"><img src="'+esc(d)+'" alt=""></button>'+
          '<div class="pslab"><span>'+picRole(i)+'</span>'+
          '<button class="psdel" data-picdel="'+li+':'+i+'" aria-label="Remove the '+picRole(i)+' picture">✕</button></div></div>';
      }else{
        out+='<button class="picslot empty" data-picadd="'+li+'" data-picslot="'+i+'">'+CAM+'<span>'+picRole(i)+'</span></button>';
      }
    }
    return '<div class="picslots">'+out+'</div>';
  }
  var PICTARGET=null;   // index of the lineup armed to receive the next paste / file pick
  var PICSLOT=null;     // which frame that paste is meant to fill (stand / aim / extra)
  var LIGHT=null;       // id of the picture open in the lightbox
  function showLightbox(id){
    var el=document.getElementById("lightbox");if(!el)return;
    var d=IMGS[id];if(!d)return;
    LIGHT=id;
    el.innerHTML='<img src="'+esc(d)+'" alt="Lineup picture"><div class="ml lbhint">TAP OR PRESS ESC TO CLOSE</div>';
    el.classList.add("show");
