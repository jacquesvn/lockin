<style>
  /* ---------- v3 "Oblivion" identity ----------
     Colours are sampled from the player's own emblem: plum-black grounds and one violet
     lifted from the shard's brightest facet. Hue is LOCKED between 303 and 318 so the
     palette can never drift toward blue.

     Two hard rules, both of which were bugs before:
     · --acc is the FILL accent (buttons, filled cells, bars) with --onAcc text on top.
       --accInk is the accent used as TEXT or an ICON. In light theme --accInk is much
       darker than --acc; using --acc as a text colour fails AA there.
     · --line2 is DECORATIVE only (~2:1). Any border that CARRIES MEANING — an unchecked
       drill circle, a gate checkbox, a dashed rest-day cell — uses --edge, which clears
       the 3:1 non-text minimum in both themes.
     The --hero* names below are aliases kept so existing rules keep working; new code
     should use the --acc* names. */
  :root{
    /* GROUNDS DESATURATED (v0.41). The v3 palette ran the grounds at chroma 0.026–0.050,
       which was too much violet to sit in front of for an hour. This is the designer's own
       stated correction: pull the grounds toward chroma 0.02 and KEEP the accent — the hue
       stays locked at 303, and --acc/--accInk/--accH/--accGhost/--bloom are untouched, so
       the identity is intact and only the room it sits in got quieter. The gradient is
       preserved (chroma still rises with lightness) so the surfaces keep their depth. */
    --stage:oklch(0.098 0.010 303);--bg:oklch(0.132 0.013 303);
    --surface:oklch(0.185 0.017 303);--surface2:oklch(0.238 0.020 303);
    --glass:oklch(1 0 0 / .045);--glass2:oklch(1 0 0 / .085);
    --line:oklch(1 0 0 / .10);--line2:oklch(1 0 0 / .17);
    --edge:oklch(0.55 0.014 303);
    --text:oklch(0.975 0.005 303);--muted:oklch(0.735 0.016 303);--faint:oklch(0.652 0.018 303);
    --acc:oklch(0.575 0.235 318);--accH:oklch(0.635 0.235 318);--accInk:oklch(0.775 0.175 318);
    --accGhost:oklch(0.575 0.235 318 / .38);--onAcc:oklch(0.99 0.004 318);
    --bloom:oklch(0.62 0.26 316);
    --good:oklch(0.815 0.145 165);--bad:oklch(0.695 0.195 16);
    --good-ink:oklch(0.815 0.145 165);--bad-ink:oklch(0.695 0.195 16);
    --info:oklch(0.775 0.175 318);
    --dock:oklch(0.205 0.045 303 / .86);--scrim:oklch(0.09 0.026 303 / .72);
    /* legacy aliases — one edit flips every existing rule onto the new palette */
    --hero:var(--acc);--hero2:var(--accH);--onhero:var(--onAcc);--hero-ink:var(--accInk);
    --fd:'Helvetica Neue',Helvetica,Arial,sans-serif;
    --fb:system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif;
    --fm:ui-monospace,'SF Mono','Cascadia Mono',Menlo,Consolas,monospace;
    /* the facet: a 15px chamfer cut at the shard's angle, the design's default gesture */
    --facet:polygon(0 0,calc(100% - 15px) 0,100% 15px,100% 100%,15px 100%,0 calc(100% - 15px));
  }
  [data-theme="light"]{
    /* light gets the same treatment: grounds and neutrals quieter, accent untouched */
    --stage:oklch(0.930 0.007 303);--bg:oklch(0.972 0.005 303);
    --surface:oklch(1 0 0);--surface2:oklch(0.945 0.007 303);
    --glass:oklch(0.30 0.03 303 / .04);--glass2:oklch(0.30 0.03 303 / .075);
    --line:oklch(0.28 0.025 303 / .13);--line2:oklch(0.28 0.025 303 / .22);
    --edge:oklch(0.585 0.014 303);
    --text:oklch(0.185 0.018 303);--muted:oklch(0.435 0.016 303);--faint:oklch(0.470 0.015 303);
    --acc:oklch(0.505 0.245 318);--accH:oklch(0.455 0.235 318);--accInk:oklch(0.455 0.230 318);
    --accGhost:oklch(0.505 0.245 318 / .34);--onAcc:oklch(0.995 0.003 318);
    --bloom:oklch(0.60 0.24 316);
    --good:oklch(0.47 0.13 152);--bad:oklch(0.505 0.19 27);
    --good-ink:oklch(0.47 0.13 152);--bad-ink:oklch(0.505 0.19 27);
    --info:oklch(0.455 0.230 318);
    --dock:oklch(1 0 0 / .88);--scrim:oklch(0.30 0.05 303 / .38);
  }
  /* the facet, applied. Small chips and circular elements keep normal radii. */
  .facet{clip-path:var(--facet);}
  *{box-sizing:border-box;margin:0;}
  html,body{height:100%;}
  /* reserve the scrollbar always, or short screens (Today) sit 15px wider than
     long ones and the whole layout jumps sideways when you switch tabs */
  html{scrollbar-gutter:stable;}
  body{background:var(--bg);color:var(--text);font-family:var(--fb);line-height:1.5;-webkit-font-smoothing:antialiased;}
  button{font-family:var(--fb);}
  .dsp{font-family:var(--fd);font-weight:800;text-transform:uppercase;letter-spacing:-0.02em;overflow-wrap:anywhere;}
  /* The spec's type table has TWO micro-label roles and we shipped one class doing both, at
     11px/0.14em — above the size range of either and below the kicker's tracking. Across ~50
     visible labels that is most of why the app read chunkier and less precise than the
     prototype, without any single label looking wrong.
       Data / stat label  --fm  8-10px  400/600  0.12-0.14em   ("CURRENT STREAK", "THE RULE")
       Section kicker     --fm  8-8.5px  400     0.18em        ("DRILL LIBRARY", "INSIGHTS")  */
  .ml{font-family:var(--fm);font-size:10px;letter-spacing:0.14em;text-transform:uppercase;color:var(--faint);font-weight:600;}
  .divi .ml,.ml.kicker{font-size:8.5px;font-weight:400;letter-spacing:0.18em;}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;}
  /* a card that's also a button — the Plan → Maps pointer */
  .ptrcard{width:100%;text-align:left;cursor:pointer;display:flex;align-items:center;gap:12px;color:inherit;font:inherit;}
  .ptrcard:hover{border-color:var(--hero);}
  .ptrchev{margin-left:auto;color:var(--hero-ink);font-size:22px;line-height:1;}
  /* guided tour: a lit cut-out over a dimmed app */
  #tour{position:fixed;inset:0;z-index:90;}
  #tour .tdim{position:absolute;inset:0;background:transparent;}
  #tour.center .tdim{background:rgba(0,0,0,0.62);}
  #tour .tspot{position:fixed;border-radius:12px;box-shadow:0 0 0 100vmax rgba(0,0,0,0.62);pointer-events:none;transition:top .22s,left .22s,width .22s,height .22s;}
  #tour.center .tspot{display:none;}
  #tour .tpop{position:fixed;max-width:322px;width:calc(100vw - 32px);background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--hero);border-radius:14px;padding:15px 17px;box-shadow:0 12px 44px rgba(0,0,0,0.45);}
  #tour.center .tpop{top:50%;left:50%;transform:translate(-50%,-50%);}
  #tour .tk{font-family:var(--fm);font-size:10px;letter-spacing:0.13em;color:var(--hero-ink);}
  #tour .tt{font-family:var(--fd);font-weight:800;font-size:19px;letter-spacing:-0.01em;margin:5px 0 0;}
  #tour .tb{font-size:13.5px;color:var(--muted);line-height:1.55;margin:8px 0 0;}
  #tour .tnav{display:flex;align-items:center;gap:8px;margin-top:15px;}
  #tour .tsteps{font-family:var(--fm);font-size:11px;color:var(--faint);margin-right:auto;}
  #tour .tskip{background:none;border:none;color:var(--faint);font:inherit;font-size:12px;cursor:pointer;text-decoration:underline;padding:0;}
  #tour .tbtn{border:1px solid var(--edge);background:transparent;color:var(--text);border-radius:9px;padding:8px 13px;font-family:var(--fm);font-size:12px;letter-spacing:0.05em;cursor:pointer;}
  #tour .tbtn.pri{background:var(--hero);border-color:var(--hero);color:var(--onhero);font-weight:700;}
  .profacts{display:flex;flex-direction:column;gap:7px;}
  .tourbtn{display:flex;align-items:center;justify-content:center;gap:7px;}
  .tourico{display:inline-flex;width:15px;height:15px;} .tourico svg{width:15px;height:15px;}
  .wrap{max-width:640px;margin:0 auto;padding:18px 16px 96px;}
  /* Vertical rhythm on these screens comes from .divi (20px above, 10px below).
     Where two blocks stack with no divider between them they collided at 0px —
     these are the three places that happens. */
  .hero-card + .cuebar{margin-top:10px;}
  .diagcard + .plan-cols{margin-top:10px;}
  .btncopy + .card{margin-top:10px;}
  a{color:var(--hero-ink);}

  /* ---------- app shell ---------- */
  #app{min-height:100vh;}
  #side{display:none;}
  #tabbar{position:fixed;bottom:0;left:0;right:0;z-index:40;background:var(--surface);border-top:1px solid var(--line);display:flex;padding:6px 8px calc(6px + env(safe-area-inset-bottom));gap:4px;}
  .tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;background:transparent;border:none;border-radius:10px;padding:7px 4px;cursor:pointer;color:var(--faint);}
  .tab svg{width:19px;height:19px;}
  .tab span{font-family:var(--fm);font-size:9px;letter-spacing:0.04em;font-weight:700;white-space:nowrap;}
  .tab.on{color:var(--hero-ink);background:color-mix(in oklab,var(--hero) 10%, transparent);--knock:color-mix(in oklab,var(--acc) 10%,var(--surface));}
  /* v3 dock: FIVE destinations, labels ALWAYS visible. 71x56 targets, translucent dock
     over a blur. The old build hid labels to fit seven icons — that was the bug. */
  #tabbar{background:var(--dock);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);gap:2px;padding:4px 6px calc(4px + env(safe-area-inset-bottom));}
  #tabbar .tab{min-width:71px;min-height:56px;padding:8px 4px;gap:4px;position:relative;}
  #tabbar .tab svg{width:20px;height:20px;}
  #tabbar .tab span{display:block;font-size:8.5px;letter-spacing:0.08em;}
  #tabbar .tab.on{background:var(--acc);color:var(--onAcc);--knock:var(--acc);clip-path:var(--facet);}
  .tabdue{animation:v3-pop .34s cubic-bezier(.2,.9,.2,1);position:absolute;top:4px;right:12px;min-width:15px;height:15px;padding:0 3px;border-radius:8px;
    background:var(--acc);color:var(--onAcc);font-family:var(--fm);font-size:8.5px;font-weight:700;
    display:grid;place-items:center;line-height:1;}
  #tabbar .tab.on .tabdue{background:var(--onAcc);color:var(--acc);}
  /* the dock floats over content, so the scroll container has to clear it */
  @media (max-width:719px){ .wrap{padding-bottom:104px;} }
  .scr{display:none;} .scr.show{display:block;animation:v3-rise .28s cubic-bezier(.2,.9,.2,1);}

  @media (min-width:720px){
    #app{display:grid;grid-template-columns:216px 1fr;}   /* 216px leaves 824px of content at a 1040px window */
    #tabbar{display:none;}
    #side{display:flex;flex-direction:column;gap:22px;position:sticky;top:0;height:100vh;border-right:1px solid var(--line);padding:22px 16px;background:var(--surface);}
    .wrap{max-width:880px;padding:26px 30px 48px;}
    .cols{display:grid;grid-template-columns:1fr 300px;gap:16px;align-items:start;}
    .plan-cols{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start;}
  }
  .snav{display:flex;flex-direction:column;gap:4px;}
  .snav button{display:flex;align-items:center;gap:10px;background:transparent;border:none;border-radius:10px;padding:10px 12px;cursor:pointer;color:var(--muted);font-family:var(--fm);font-size:12px;font-weight:700;letter-spacing:0.1em;text-align:left;position:relative;}
  /* desktop active state is a tracer rail + glass, NOT the mobile fill — the sidebar is
     pointer-only chrome and a solid accent slab down the side is too loud at this size */
  .snav button.on{background:var(--glass);color:var(--text);}
  .snav button.on::before{content:"";position:absolute;left:0;top:6px;bottom:6px;width:2px;background:var(--acc);border-radius:2px;}
  .snav button svg{width:16px;height:16px;}
  .navdia{width:5px;height:5px;flex:0 0 auto;transform:rotate(45deg);border:1px solid var(--edge);}
  .snav button.on .navdia{background:var(--acc);border-color:var(--acc);}
  .navdue{margin-left:auto;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--acc);color:var(--onAcc);
    font-family:var(--fm);font-size:9px;font-weight:700;display:grid;place-items:center;line-height:1;
    animation:v3-pop .34s cubic-bezier(.2,.9,.2,1);}   /* a count arriving should land, not fade in */
  /* Practice expands in place rather than hiding its two screens behind a click */
  .snsubs{display:flex;flex-direction:column;gap:2px;margin:2px 0 2px 30px;}
  .snav .snsub{padding:7px 10px;font-family:var(--fb);font-size:12px;letter-spacing:0;font-weight:600;text-transform:none;color:var(--faint);}
  /* a sub-item must still LOOK selected. This used to cancel both of the nav's selection
     affordances — background:transparent killed the glass, ::before{display:none} killed the
     tracer rail — which left a faint-to-accent TEXT COLOUR SHIFT as the only signal that you
     were on Plan rather than Drills. At 12px on a dark rail that reads as nothing.
     It keeps the same language as its parent, one step quieter: the rail is inset and short
     rather than full-height, and it sits in the indent gutter so the nesting still reads. */
  .snav .snsub.on{background:var(--glass);color:var(--accInk);}
  .snav .snsub.on::before{display:block;left:-14px;top:50%;bottom:auto;height:14px;width:2px;
    transform:translateY(-50%);background:var(--acc);border-radius:2px;}
  .snrule{display:flex;align-items:center;gap:8px;margin:14px 0 4px;}
  .snrule span{font-family:var(--fm);font-size:8px;letter-spacing:0.18em;color:var(--faint);}
  .snrule::after{content:"";flex:1;height:1px;background:var(--line);}
  /* Practice sub-tabs inside the screen. The selected one is a solid accent fill with the
     facet — a 1px outline was too subtle to read and shipped as a bug. */
  .substrip{display:flex;gap:6px;margin-bottom:6px;}
  .subtab{min-height:44px;padding:0 16px;background:transparent;border:1px solid var(--edge);border-radius:10px;
    color:var(--muted);font-family:var(--fm);font-size:11px;font-weight:700;letter-spacing:0.1em;cursor:pointer;}
  .subtab.on{background:var(--acc);border-color:var(--acc);color:var(--onAcc);border-radius:0;}
  .subcap{font-family:var(--fm);font-size:8.5px;letter-spacing:0.18em;color:var(--faint);margin-bottom:14px;}
  @media (min-width:720px){ .subtab{min-height:36px;} }
  /* MORE sheet — mobile only; desktop lists Gear/Setup in the sidebar instead */
  #sheet{position:fixed;inset:0;z-index:60;display:none;}
  #sheet.show{display:block;}
  .shscrim{position:absolute;inset:0;background:var(--scrim);}
  .shbody{position:absolute;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);
    border-radius:16px 16px 0 0;padding:10px 16px calc(18px + env(safe-area-inset-bottom));animation:v3-slide .26s cubic-bezier(.2,.9,.2,1);}
  .shgrab{width:36px;height:4px;border-radius:2px;background:var(--edge);margin:0 auto 12px;}
  .shrow{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;background:transparent;border:none;
    border-bottom:1px solid var(--line);color:var(--text);font-size:15px;text-align:left;cursor:pointer;padding:8px 2px;}
  .shrow:last-of-type{border-bottom:0;}
  .shrow svg{width:19px;height:19px;color:var(--accInk);flex:0 0 auto;}
  .shrow small{display:block;color:var(--faint);font-size:12px;margin-top:2px;}
  /* the merged DUE card — scheduled things list together instead of competing as cards */
  .duecard{margin-bottom:11px;}
  .duerow{display:flex;align-items:center;gap:11px;width:100%;min-height:44px;background:transparent;border:none;
    border-top:1px solid var(--line);color:var(--text);font-size:14px;text-align:left;cursor:pointer;padding:9px 0;}
  .duerow:first-of-type{border-top:0;}
  .duerow svg{width:17px;height:17px;color:var(--accInk);flex:0 0 auto;}
  .duerow>span:nth-child(2){flex:1;min-width:0;}
  .duerow small{display:block;color:var(--faint);font-size:12px;margin-top:2px;}
  .duerow .ptrchev{color:var(--faint);font-size:18px;}
  /* everything the stack held back, behind one 44px control */
  .moretog{width:100%;min-height:44px;background:transparent;border:1px dashed var(--edge);border-radius:11px;
    color:var(--muted);font-family:var(--fm);font-size:10px;letter-spacing:0.14em;font-weight:700;
    cursor:pointer;margin-bottom:11px;}
  .moretog:hover{border-color:var(--acc);color:var(--text);}
  .morewrap{animation:v3-slide .26s cubic-bezier(.2,.9,.2,1);}
  /* ten minutes, one tap — the single primary action on Today */
  .tenbtn{width:100%;min-height:52px;background:var(--acc);color:var(--onAcc);border:none;cursor:pointer;
    font-family:var(--fm);font-weight:800;font-size:12.5px;letter-spacing:0.12em;margin-bottom:8px;}
  .tenbtn:hover{background:var(--accH);}
  .fullbtn{width:100%;min-height:44px;background:transparent;border:1px solid var(--edge);border-radius:11px;
    color:var(--muted);font-family:var(--fb);font-size:13px;cursor:pointer;margin-bottom:12px;}
  .fullbtn:hover{border-color:var(--muted);color:var(--text);}
  /* leak of the week — one claim, its evidence directly beneath it */
  .leakcard{margin-bottom:10px;}
  .leakbig{font-family:var(--fd);font-weight:800;text-transform:uppercase;letter-spacing:-0.01em;
    font-size:26px;color:var(--accInk);margin-top:6px;}
  .yvy{font-size:13px;color:var(--muted);margin-bottom:12px;}
  .yvy b{color:var(--text);}
  /* nothing leaves this device */
  .privrow{display:flex;gap:10px;align-items:flex-start;padding:7px 0;font-size:13.5px;color:var(--muted);}
  .privrow svg{width:15px;height:15px;color:var(--good);flex:0 0 auto;margin-top:2px;}
  .privcard .mhow{border-top:1px solid var(--line);padding-top:10px;color:var(--text);font-weight:600;}
  .smini{margin-top:auto;border-top:1px solid var(--line);padding-top:16px;display:flex;flex-direction:column;gap:14px;}

  /* ---------- brand ---------- */
  .brand{display:flex;align-items:center;gap:9px;--knock:var(--surface);}
  .brand svg{width:22px;height:22px;color:var(--hero-ink);}
  .wordmark{font-family:var(--fd);font-weight:800;font-size:17px;letter-spacing:-0.02em;}
  .wordmark b{color:var(--hero-ink);}

  /* ---------- header ---------- */
  .hd{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin-bottom:16px;}
  .hd h1{font-size:30px;line-height:1;}
  .iconbtn{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--muted);cursor:pointer;display:grid;place-items:center;}
  .iconbtn svg{width:17px;height:17px;}
  .iconbtn:focus-visible,.tab:focus-visible,.snav button:focus-visible,.opt:focus-visible,.drow:focus-visible,.pbtn:focus-visible,.gbtn:focus-visible{outline:2px solid var(--hero);outline-offset:2px;}

  /* ---------- streak hero ---------- */
  .hero-card{position:relative;overflow:hidden;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;}
  .hero-card::after{content:"";position:absolute;top:-50px;right:-50px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,var(--hero),transparent 68%);opacity:.10;pointer-events:none;}
  .hero-row{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;}
  /* the hero numeral: section 5.1 puts the streak at the TOP of the display range, 68px and
     -0.045em. We were at 64/-0.03, which is a legal display size but not the headline one. */
  .big-n{font-family:var(--fd);font-weight:800;font-size:68px;line-height:.95;letter-spacing:-0.045em;color:var(--hero-ink);}
  .frz{display:flex;align-items:center;gap:8px;margin-top:8px;font-family:var(--fm);font-size:9.5px;letter-spacing:0.1em;color:var(--accInk);}
  .frzrow{display:inline-flex;gap:3px;}
  .frzs{width:14px;height:14px;color:var(--accInk);display:inline-block;}
  .frzs svg{width:14px;height:14px;}
  .frzs.spent{color:var(--faint);opacity:.55;}      /* spent, not gone — you can see what it cost */
  .frzt small{display:block;color:var(--faint);letter-spacing:0.08em;margin-top:2px;}
  /* pause — stopping on purpose is not dropping off */
  .pausecard{margin-bottom:11px;}
  .pausebig{font-family:var(--fd);font-weight:800;text-transform:uppercase;letter-spacing:-0.01em;font-size:22px;color:var(--accInk);margin-top:6px;}
  .pauserow{display:flex;gap:8px;flex-wrap:wrap;}
  .pausebtn{flex:1;min-width:92px;min-height:44px;background:transparent;border:1px solid var(--edge);border-radius:11px;
    color:var(--text);font-family:var(--fm);font-size:11px;font-weight:700;letter-spacing:0.1em;cursor:pointer;}
  .pausebtn:hover{border-color:var(--acc);color:var(--accInk);}
  @media (min-width:720px){ .pausebtn{min-height:36px;} }   /* pointer-only chrome may drop to 36 */
  /* rest as a first-class day */
  .wc.restplan{border:1px dashed var(--edge);color:var(--faint);background:transparent;cursor:pointer;}
  .wc.restplan:hover{border-color:var(--acc);color:var(--accInk);}
  .wc.restdone{border:1px solid var(--acc);color:var(--accInk);background:color-mix(in oklab,var(--acc) 14%,transparent);}
  .restline{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-top:11px;padding-top:10px;border-top:1px solid var(--line);}
  .restline .ml{color:var(--faint);}
  .restn{font-family:var(--fm);font-size:12px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums;}
  .restt{flex:1;min-width:180px;font-size:12px;color:var(--muted);}
  .restline.on .restn,.restline.on .restt{color:var(--accInk);}
  /* the earned tier as the sidebar identity */
  .tierid{display:flex;align-items:center;gap:10px;}
  .tierhex{width:38px;height:42px;flex:0 0 auto;display:grid;place-items:center;background:var(--acc);color:var(--onAcc);
    clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);}
  .tierhex b{font-family:var(--fd);font-weight:800;font-size:17px;}
  .tiertx{min-width:0;}
  .tiername{display:block;font-family:var(--fd);font-weight:800;font-size:12px;letter-spacing:-0.01em;overflow-wrap:anywhere;}
  .tiertx small{display:block;font-family:var(--fm);font-size:8px;letter-spacing:0.16em;color:var(--faint);margin-top:2px;}
  /* the quiet week, stated rather than done silently */
  .quietnote{display:flex;gap:10px;align-items:flex-start;padding:11px 12px;margin-bottom:12px;
    border:1px solid var(--accGhost);border-radius:11px;background:color-mix(in oklab,var(--acc) 8%,transparent);font-size:13px;color:var(--muted);}
  .quietnote svg{width:16px;height:16px;color:var(--accInk);flex:0 0 auto;margin-top:1px;}
  .quietnote b{color:var(--text);}
  .frz svg{width:12px;height:12px;}
  /* milestones / achievements */
  .achgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:9px;}
  /* three per row on a phone, with the labels still legible */
  @media (max-width:719px){ .achgrid{grid-template-columns:repeat(auto-fit,minmax(88px,1fr));}
    .ach{flex-direction:column;gap:6px;padding:10px 8px;} .achd{display:none;} .acht{font-size:11.5px;} }
  /* streak milestone rail — one source of truth, shared with the tier name */
  .mrail{margin-bottom:10px;}
  .mrrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(52px,1fr));gap:6px;margin-top:10px;}
  .mrcell{border:1px solid var(--edge);border-radius:9px;padding:8px 4px;text-align:center;}
  .mrcell.on{border-color:var(--acc);background:color-mix(in oklab,var(--acc) 14%,transparent);}
  .mrcell.next{border-color:var(--acc);border-style:dashed;}
  .mrn{font-family:var(--fd);font-weight:800;font-size:17px;color:var(--text);}
  .mrcell.on .mrn{color:var(--accInk);}
  .mrt{font-family:var(--fm);font-size:7.5px;letter-spacing:0.1em;color:var(--faint);margin-top:2px;}
  /* auto-logged match summary */
  .adcard{margin-bottom:10px;}
  .adtop{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px;}
  .adrow{display:flex;align-items:center;gap:9px;padding:6px 0;border-top:1px solid var(--line);font-size:13.5px;}
  .adrow:first-of-type{border-top:0;}
  .adrow b{min-width:44px;color:var(--text);}
  .adrow span{color:var(--muted);}
  .adsc{margin-left:auto;font-family:var(--fm);font-variant-numeric:tabular-nums;color:var(--text);}
  /* earned reads as accent, locked as a plain outline. Locked is NOT dimmed to .5 any more —
     a locked badge is a target you can read, not a disabled control. */
  .ach{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--edge);border-radius:12px;padding:11px 12px;background:transparent;}
  .ach.on{border-color:var(--acc);background:color-mix(in oklab,var(--acc) 12%,transparent);}
  .ach.on .achico{animation:v3-badge .42s cubic-bezier(.2,.9,.2,1);}
  .achico{flex:none;width:26px;height:26px;color:var(--faint);} .ach.on .achico{color:var(--hero-ink);} .achico svg{width:26px;height:26px;}
  .acht{font-weight:600;font-size:13px;color:var(--text);} .achd{font-size:11.5px;color:var(--muted);line-height:1.4;margin-top:2px;}
  .achp{font-family:var(--fm);font-size:9.5px;letter-spacing:0.08em;color:var(--faint);margin-top:4px;}
  .ach.on .achp{color:var(--good);}
  .hr-r{text-align:right;}
  .hr-r .n2{font-family:var(--fd);font-weight:800;font-size:26px;letter-spacing:-0.02em;}
  .status-good{color:var(--good);} .status-mut{color:var(--muted);}
  .wk7{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:16px;}
  .wd{text-align:center;}
  .wd .dl{font-family:var(--fm);font-size:9px;letter-spacing:0.1em;color:var(--faint);margin-bottom:4px;}
  .wc{height:30px;border-radius:8px;display:grid;place-items:center;font-family:var(--fm);font-size:12px;font-weight:700;border:1px solid transparent;}
  .wc.done{background:var(--hero);color:var(--onhero);}
  .wc.today{border:1.5px solid var(--hero);color:var(--hero-ink);}
  .wc.rest{border:1px dashed var(--edge);color:var(--faint);}
  .wc.up{background:var(--surface2);color:var(--faint);}
  .wc.miss{border:1px dashed var(--bad);color:var(--bad);}

  /* ---------- divider / section labels ---------- */
  .divi{display:flex;align-items:center;gap:10px;margin:20px 0 10px;}
  .divi .ml{color:var(--muted);} .divi::after{content:"";flex:1;height:1px;background:var(--line);}

  /* ---------- drill rows ---------- */
  .dlist{display:flex;flex-direction:column;gap:8px;}
  .drow{display:flex;gap:12px;align-items:flex-start;color:var(--text);background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--line);border-radius:11px;padding:13px 14px;cursor:pointer;transition:border-color .15s,opacity .15s;text-align:left;width:100%;}
  .drow.done{border-left-color:var(--hero);opacity:.72;}
  /* the row and its "why" sit side by side; neither is inside the other */
  .drowwrap{display:flex;gap:6px;align-items:stretch;}
  .drowwrap .drow{flex:1;min-width:0;}
  .drowwhy{flex:0 0 auto;width:44px;min-height:44px;background:transparent;border:1px solid var(--line);
    border-radius:11px;color:var(--faint);font-family:var(--fm);font-size:15px;font-weight:700;cursor:pointer;}
  .drowwhy:hover,.drowwhy[aria-expanded="true"]{border-color:var(--acc);color:var(--accInk);}
  .drowwrap.done .drowwhy{opacity:.72;}
  .whypanel{border:1px solid var(--accGhost);border-left:3px solid var(--acc);border-radius:11px;
    padding:12px 14px;margin:6px 0 0;background:color-mix(in oklab,var(--acc) 7%,transparent);animation:v3-slide .26s cubic-bezier(.2,.9,.2,1);}
  .whypanel p{font-size:13px;color:var(--muted);margin-top:6px;}
  .whyopt{color:var(--faint)!important;font-style:italic;}
  .whysrc{margin-top:9px;padding-top:8px;border-top:1px solid var(--line);
    font-family:var(--fm);font-size:9px;letter-spacing:0.12em;text-transform:uppercase;color:var(--faint);}
  .deloadcard{margin-bottom:12px;}
  .deloadbig{font-family:var(--fd);font-weight:800;text-transform:uppercase;letter-spacing:-0.01em;font-size:20px;color:var(--accInk);margin-top:6px;}
  /* the two evidence cards: a contradiction, and the stop-loss */
  .bottleneck{margin-top:10px;border-left:3px solid var(--acc);}
  .bnbig{font-family:var(--fd);font-weight:800;text-transform:uppercase;letter-spacing:-0.01em;font-size:19px;color:var(--accInk);margin-top:6px;}
  .tiltcard{margin-bottom:11px;border-left:3px solid var(--bad);}
  .tiltbig{font-family:var(--fd);font-weight:800;text-transform:uppercase;letter-spacing:-0.01em;font-size:21px;color:var(--bad-ink);margin-top:6px;}
  /* off-plan work: recorded, never counted for or against */
  .offcard{margin-top:12px;}
  .oftop{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;}
  .oflist{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;}
  .ofpill{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 6px 0 9px;border-radius:999px;
    background:var(--glass2);color:var(--muted);font-size:12px;}
  .ofpill button{background:none;border:0;color:var(--faint);cursor:pointer;font-size:12px;line-height:1;padding:2px 3px;}
  .ofpill button:hover{color:var(--bad-ink);}
  /* coach's question, drift, and the skipped-drill bars */
  .coachcard{margin-bottom:11px;}
  .coachq{font-size:15px;color:var(--text);margin:8px 0 12px;}
  .coachopts{display:flex;flex-direction:column;gap:7px;}
  .coachopt{min-height:44px;background:transparent;border:1px solid var(--edge);border-radius:11px;
    color:var(--text);font-size:14px;text-align:left;padding:0 14px;cursor:pointer;}
  .coachopt:hover{border-color:var(--acc);color:var(--accInk);}
  .driftcard{margin-bottom:11px;border-left:3px solid var(--acc);}
  .driftbig{font-family:var(--fd);font-weight:800;text-transform:uppercase;letter-spacing:-0.01em;font-size:18px;color:var(--accInk);margin:6px 0 10px;}
  .driftrow{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-top:1px solid var(--line);font-size:13px;color:var(--muted);}
  .driftrow b{color:var(--text);font-family:var(--fm);font-variant-numeric:tabular-nums;}
  .skipcard{margin-bottom:11px;}
  .skwrap{margin-top:10px;display:flex;flex-direction:column;gap:7px;}
  .skrow{display:flex;align-items:center;gap:9px;font-size:12.5px;}
  .skname{flex:0 0 40%;min-width:0;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .skbar{flex:1;height:8px;background:var(--glass2);border-radius:4px;overflow:hidden;}
  /* bars grow into their real width. scaleX is used deliberately rather than animating
     width, so the inline width stays the true percentage — the number is never the animation. */
  .skbar i{display:block;height:100%;background:var(--acc);transform-origin:left center;
    animation:v3-growX .45s cubic-bezier(.2,.9,.2,1);}
  .skbar i.bad{background:var(--bad);}
  .skpct{flex:0 0 auto;font-family:var(--fm);font-size:11px;color:var(--text);font-variant-numeric:tabular-nums;}
  .skopts{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;}
  .skopts .gbtn{flex:1;min-width:104px;}
  /* Group D: evidence */
  .lhcard,.chcard,.prcard{margin-top:10px;}
  .lhwrap{display:flex;flex-direction:column;gap:9px;margin-top:10px;}
  .lhrow{display:flex;align-items:center;gap:9px;font-size:12.5px;}
  .lhname{flex:0 0 34%;min-width:0;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .lhbars{flex:1;display:flex;flex-direction:column;gap:3px;}
  .lhbars i{display:block;height:6px;border-radius:3px;transform-origin:left center;
    animation:v3-growX .45s cubic-bezier(.2,.9,.2,1);}
  .lhbars i.was{background:var(--edge);}   /* the "before" bar, same 1.65:1 problem as .bfill */
  .lhbars i.now{background:var(--good);}
  .lhpct{flex:0 0 auto;font-family:var(--fm);font-size:11px;color:var(--text);font-variant-numeric:tabular-nums;}
  .chwrap{margin-top:8px;}
  .chrow{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px solid var(--line);font-size:13px;color:var(--muted);}
  .chrow:first-child{border-top:0;}
  .chrow b{color:var(--text);text-align:right;}
  .chdelta{font-family:var(--fm);font-size:11px;color:var(--faint);}
  .chdelta.up{color:var(--good-ink);} .chdelta.down{color:var(--bad-ink);}
  .prwrap{margin-top:8px;}
  .prrow{padding:9px 0;border-top:1px solid var(--line);}
  .prrow:first-child{border-top:0;}
  .prtop{display:flex;justify-content:space-between;gap:12px;font-size:13px;color:var(--muted);}
  .prtop b{color:var(--text);text-align:right;font-family:var(--fm);font-variant-numeric:tabular-nums;}
  .prsrc{font-size:11.5px;color:var(--faint);margin-top:3px;}
  .prlimit{margin-top:12px;padding-top:10px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted);}
  .prlimit b{color:var(--text);}
  .hxpre{white-space:pre-wrap;word-break:break-word;font-family:var(--fm);font-size:11px;line-height:1.6;
    color:var(--muted);background:var(--glass2);border-radius:9px;padding:12px;max-height:260px;overflow:auto;}
  /* Group E: lifecycle */
  .firstcard,.gradcard{margin-bottom:11px;}
  .firstbig,.gradbig{font-family:var(--fd);font-weight:800;text-transform:uppercase;letter-spacing:-0.01em;
    font-size:21px;color:var(--accInk);margin-top:6px;}
  .gradopts{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;}
  .gradopts .gbtn{flex:1;min-width:112px;}      /* three EQUAL choices — no primary among them */
  .altwrap{display:flex;flex-direction:column;gap:8px;}
  .altrow{border:1px solid var(--line);border-radius:11px;padding:11px 12px;}
  .altrow.picked{border-color:var(--acc);background:color-mix(in oklab,var(--acc) 9%,transparent);}
  .altk{display:flex;align-items:center;gap:8px;font-family:var(--fd);font-weight:800;font-size:13px;text-transform:uppercase;}
  .altd{font-size:12.5px;color:var(--text);margin-top:4px;}
  .altw{font-size:12px;color:var(--faint);margin-top:3px;}
  .advecho{margin-top:12px;padding:11px 12px;border-left:3px solid var(--acc);border-radius:9px;
    background:color-mix(in oklab,var(--acc) 8%,transparent);}
  .advecho p{font-size:13.5px;color:var(--text);margin-top:5px;}
  .dbox{width:26px;height:26px;border-radius:7px;flex:0 0 auto;display:grid;place-items:center;border:1.5px solid var(--edge);background:transparent;transition:all .15s;margin-top:1px;}
  .drow.done .dbox{background:var(--hero);border-color:var(--hero);}
  .dbox svg{width:14px;height:14px;color:var(--onhero);opacity:0;} .drow.done .dbox svg{opacity:1;animation:v3-tick .3s cubic-bezier(.2,.9,.2,1);}
  .dbody{flex:1;min-width:0;}
  .dname{font-weight:600;font-size:14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .drow.done .dname{color:var(--muted);}
  /* ---------- the status language: FIVE roles, ONE shell ----------
     Every state in the app speaks through this and nothing else. Before, status was
     ad-hoc — an accent chip here, an inline var(--good) there — so the same idea looked
     different on every screen. The roles:
       live  · filled dot, good      — connected, both locked in
       idle  · HOLLOW dot, faint     — not connected, nothing due. NEVER red; nothing is broken
       cap   · neutral text, NO colour — desktop-only capability. A second hue against a
               violet accent reads as a second accent rather than as information
       due   · accent                — N due, review due
       warn  · bad, and rare         — stop-loss, tilt risk
     Do not add a sixth. If a card already carries an accent action, its chip takes .ghost
     so the accent stays scarce — one accent element per card. */
  .st{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 8px;border-radius:3px;
    font-family:var(--fm);font-size:9px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;
    border:1px solid transparent;white-space:nowrap;vertical-align:middle;flex:0 0 auto;}
  .st i{width:6px;height:6px;border-radius:50%;flex:0 0 auto;}
  .st.live{color:var(--good-ink);background:color-mix(in oklab,var(--good) 13%,transparent);}
  .st.live i{background:var(--good);}
  .st.idle{color:var(--faint);border-color:var(--edge);}
  .st.idle i{border:1px solid var(--faint);}                 /* hollow — nothing is wrong */
  .st.cap{color:var(--muted);border-color:var(--edge);}      /* capability carries no colour */
  .st.due{color:var(--accInk);background:color-mix(in oklab,var(--acc) 15%,transparent);}
  .st.due i{background:var(--acc);}
  .st.warn{color:var(--bad-ink);background:color-mix(in oklab,var(--bad) 13%,transparent);}
  .st.warn i{background:var(--bad);}
  .st.ghost{background:transparent;border-color:currentColor;}
  .dwhere{font-family:var(--fm);font-size:11px;color:var(--hero-ink);margin-top:3px;}
  .dsub{font-size:12.5px;color:var(--muted);margin-top:2px;}
  .dmeas{font-family:var(--fm);font-size:11px;color:var(--faint);margin-top:5px;}
  .ddur{font-family:var(--fm);font-size:12px;color:var(--faint);white-space:nowrap;margin-top:2px;}

  /* ---------- hand feel ---------- */
  .feelgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin-top:12px;}
  .fbtn{height:40px;border-radius:9px;font-family:var(--fd);font-weight:700;font-size:15px;cursor:pointer;transition:all .12s;background:var(--surface2);color:var(--faint);border:1px solid var(--line);}
  .fbtn.on{background:var(--hero);color:var(--onhero);border-color:var(--hero);}
  .fword{font-family:var(--fm);font-size:11px;letter-spacing:0.12em;text-transform:uppercase;margin-top:10px;font-weight:700;}

  .motto{text-align:center;font-family:var(--fm);font-size:10px;letter-spacing:0.18em;color:var(--faint);margin-top:26px;text-transform:uppercase;}
  .rulecard{border-left:3px solid var(--hero);}
  .rulecard p{font-size:13px;color:var(--muted);margin-top:6px;}

  /* ---------- quiz ---------- */
  /* auto-flow so the bar stays one row whatever QUIZ.length is — this was pinned
     to 7 columns and the 8th question silently wrapped onto a second line */
  .segs{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:5px;margin:16px 0 22px;}
  .seg{height:4px;border-radius:2px;background:var(--surface2);} .seg.on{background:var(--hero);}
  .qq{font-size:24px;margin:6px 0 4px;}
  .qhint{font-size:13px;color:var(--muted);margin-bottom:16px;}
  .lfy{margin-bottom:16px;padding:14px;}
  .lfyin{display:flex;gap:8px;}
  .lfyin input{flex:1;min-width:0;background:var(--sunk);border:1px solid var(--line);color:var(--text);
    border-radius:8px;padding:10px 11px;font:inherit;font-size:13px;}
  .lfyin input:focus{outline:none;border-color:var(--hero);}
  .lfyname{font-weight:800;margin:10px 0 8px;font-size:15px;}
  .lfynums{display:grid;grid-template-columns:1fr;gap:2px;}
  .lfyrow{display:flex;justify-content:space-between;gap:12px;font-size:12.5px;
    color:var(--muted);padding:3px 0;border-bottom:1px solid var(--line);}
  .lfyrow b{color:var(--text);font-variant-numeric:tabular-nums;}
  .lfyattr{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;}
  .lfylink{color:#F84982;font-weight:700;text-decoration:underline;font-size:12px;}
  .lfybadge{height:38px;width:auto;display:block;}
  .lfybadge.lt{display:none;}
  [data-theme="light"] .lfybadge.dk{display:none;}
  [data-theme="light"] .lfybadge.lt{display:block;}
  .lfyattr{align-items:center;}
  .lfywhy{font-size:12.5px;color:var(--muted);padding:3px 0;}
  .lfywhy:before{content:"▸ ";color:var(--hero-ink);}
  .lfyerr{margin-top:9px;font-size:12.5px;color:var(--warn,#e5a03c);}
  .opts{display:flex;flex-direction:column;gap:9px;}
  .opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:14px 15px;cursor:pointer;color:var(--text);font-size:14.5px;transition:border-color .12s,background .12s;}
  .opt.on{border-color:var(--hero);background:color-mix(in oklab,var(--hero) 10%, transparent);}
  .tick{width:21px;height:21px;flex:0 0 auto;border:1.5px solid var(--edge);display:grid;place-items:center;color:transparent;}
  .tick.c{border-radius:50%;} .tick.s{border-radius:6px;}
  .opt.on .tick{background:var(--hero);border-color:var(--hero);color:var(--onhero);}
  .tick svg{width:12px;height:12px;}
  .qnav{display:flex;justify-content:space-between;gap:10px;margin-top:22px;}
  .gbtn{background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:11px;padding:12px 18px;font-family:var(--fm);font-size:12px;font-weight:700;letter-spacing:0.08em;cursor:pointer;}
  .pbtn{background:var(--hero);border:1px solid var(--hero);color:var(--onhero);border-radius:11px;padding:12px 22px;font-family:var(--fm);font-size:12px;font-weight:800;letter-spacing:0.08em;cursor:pointer;}
  .pbtn:hover{background:var(--hero2);}
  .pbtn:disabled{background:var(--surface2);border-color:var(--line);color:var(--faint);cursor:not-allowed;}

  /* generating / reveal */
  .cstage{min-height:60vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:18px;}
  .ring{width:74px;height:74px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--hero);display:grid;place-items:center;animation:v3-spin 1s linear infinite;}
  .ring svg{width:30px;height:30px;color:var(--hero-ink);animation:none;}
  .blink{animation:lk-blink 1.1s steps(1) infinite;}
  .badge{width:88px;height:88px;border-radius:20px;background:var(--hero);color:var(--onhero);display:grid;place-items:center;position:relative;animation:lk-snap .45s cubic-bezier(.2,.9,.2,1);}
  .badge svg{width:44px;height:44px;}
  .ping{position:absolute;inset:0;border-radius:20px;border:2px solid var(--hero);animation:lk-ping .9s ease-out both;}
  .rise{animation:lk-rise .45s .15s cubic-bezier(.2,.9,.2,1) both;}
  .diagcard{border-left:3px solid var(--hero);text-align:left;max-width:430px;width:100%;}
  .diagrow{display:flex;gap:12px;padding:7px 0;border-bottom:1px solid var(--line);} .diagrow:last-child{border-bottom:0;}
  .diagrow .k{font-family:var(--fm);font-size:10.5px;letter-spacing:0.14em;color:var(--faint);flex:0 0 84px;padding-top:3px;}
  .diagrow .v{font-weight:600;font-size:13.5px;}

  /* ---------- plan ---------- */
  .phrow{display:flex;gap:14px;padding:13px 0;border-bottom:1px solid var(--line);align-items:baseline;}
  .phrow:last-child{border-bottom:0;}
  .phnum{font-family:var(--fd);font-weight:800;font-size:30px;color:var(--hero-ink);flex:0 0 34px;line-height:1;}
  .phrow b{font-family:var(--fd);font-weight:800;text-transform:uppercase;letter-spacing:-0.01em;font-size:15px;}
  .phrow .wl{font-family:var(--fm);font-size:10px;letter-spacing:0.12em;color:var(--faint);margin-left:8px;}
  .phrow p{font-size:12.5px;color:var(--muted);margin-top:3px;}
  .rotgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .rotc{background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:10px 12px;width:100%;text-align:left;color:var(--text);font-family:var(--fb);cursor:pointer;}
  .rotc:hover{border-color:var(--hero-ink);}
  .rotc.editing{border:1.5px solid var(--hero-ink);}
  .rotc.now{border:1.5px solid var(--hero);background:color-mix(in oklab,var(--hero) 10%, transparent);}
  .rotc .dl2{font-family:var(--fm);font-size:9.5px;letter-spacing:0.14em;color:var(--faint);}
  .rotc .fn2{font-weight:600;font-size:13px;margin-top:3px;}
  .librow{padding:11px 0;border-bottom:1px solid var(--line);} .librow:last-child{border-bottom:0;}
  .libgrid{display:grid;grid-template-columns:1fr;}
  @media (min-width:720px){
    .libgrid{grid-template-columns:repeat(auto-fill,minmax(232px,1fr));column-gap:24px;}
  }
  .librow .cat{font-family:var(--fm);font-size:9.5px;letter-spacing:0.14em;color:var(--hero-ink);font-weight:700;}
  .librow .ln{font-weight:600;font-size:13.5px;display:flex;justify-content:space-between;gap:10px;margin-top:2px;}
  .librow .lm{font-family:var(--fm);font-size:10.5px;color:var(--faint);margin-top:3px;}
  /* the read-ahead "why" — body text you actually read in Plan, so --muted not --faint */
  .librow .lwhy{font-size:12.5px;color:var(--muted);line-height:1.5;margin-top:5px;}
  /* GET THE MAPS — one-click Workshop links. Rows are tappable cards; on desktop the app
     routes the click through the native opener (a plain _blank opens a chrome-less window). */
  .wsgrouph{font-family:var(--fm);font-size:9.5px;letter-spacing:0.14em;color:var(--faint);font-weight:700;text-transform:uppercase;margin:14px 0 8px;}
  .wsgrid{display:grid;grid-template-columns:1fr;gap:9px;}
  @media (min-width:560px){.wsgrid{grid-template-columns:repeat(auto-fill,minmax(248px,1fr));}}
  .wsrow{display:flex;flex-direction:column;gap:3px;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:11px 13px;text-decoration:none;color:inherit;transition:border-color .12s,transform .12s;}
  .wsrow:hover{border-color:var(--hero);transform:translateY(-1px);}
  .wsrow:focus-visible{outline:2px solid var(--hero);outline-offset:2px;}
  .wstop{display:flex;align-items:center;gap:7px;flex-wrap:wrap;}
  .wsname{font-weight:600;font-size:13.5px;color:var(--text);margin-right:auto;}
  .wsrecheck{background:none;border:none;color:var(--hero-ink);font:inherit;font-size:12.5px;cursor:pointer;text-decoration:underline;padding:0;}
  .wsdesc{font-size:12px;color:var(--muted);line-height:1.45;}
  .wsget{font-family:var(--fm);font-size:10px;letter-spacing:0.08em;color:var(--hero-ink);margin-top:4px;}
  .wsrow:hover .wsget{text-decoration:underline;}
  /* week-4 / week-8 review — a milestone card, so it reads as a moment not a nag */
  .revcard{border-color:color-mix(in oklab,var(--hero) 45%,transparent);margin-bottom:14px;}
  .revrow{font-size:13px;color:var(--muted);padding:5px 0;border-bottom:1px solid var(--line);}
  .revrow:first-of-type{margin-top:8px;}
  .revrow b{color:var(--text);font-variant-numeric:tabular-nums;}
  .revrow.good b{color:var(--good);} .revrow.bad b{color:var(--bad);}
  .revrow.muted{color:var(--faint);}
  .revsug{font-family:var(--fm);font-size:11px;letter-spacing:0.1em;color:var(--hero-ink);margin-top:12px;font-weight:700;}
  .revwhy{font-size:13px;color:var(--muted);line-height:1.5;margin-top:6px;}
  .revacts{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px;}
  /* coming back is not a warning — hero, never --bad. The calendar already shows
     the misses honestly; this card's job is the way forward, not the reprimand. */
  .lapsecard{border-color:color-mix(in oklab,var(--hero) 45%,transparent);margin-bottom:14px;}
  .lapselede{font-size:14px;color:var(--text);line-height:1.5;margin-top:9px;}
  .lapselede b{color:var(--hero-ink);}
  .lapsestats{font-family:var(--fm);font-size:11px;color:var(--faint);letter-spacing:0.04em;margin-top:9px;line-height:1.7;}
  .lapsestats b{color:var(--text);}
  .lapseback{font-size:13px;color:var(--muted);line-height:1.5;margin-top:11px;}
  /* reappraisal script — read, not skimmed, so it gets body-text weight; the
     citation stays visible rather than hidden, because the caveats are the point */
  .reapp{border-color:color-mix(in oklab,var(--hero) 40%,transparent);}
  .reapp-body{font-size:14px;color:var(--text);line-height:1.55;margin-top:10px;}
  .reapp-body b{color:var(--hero-ink);}
  .reapp-cite{font-size:11.5px;color:var(--faint);line-height:1.55;margin-top:13px;
    border-top:1px solid var(--line);padding-top:10px;}
  .reapp-cite b{color:var(--muted);}
  /* mindset / right / wrong, read before training — mirrors the live drill screen */
  .ldwrap{margin-top:8px;display:grid;gap:4px;}
  .ld{display:grid;grid-template-columns:58px 1fr;gap:9px;align-items:baseline;font-size:12px;line-height:1.4;}
  .ld .ldk{font-family:var(--fm);font-size:9px;letter-spacing:0.1em;color:var(--faint);}
  .ld-mind span:last-child{color:var(--hero-ink);font-weight:700;}
  .ld-right span:last-child{color:var(--good);}
  .ld-wrong span:last-child{color:var(--bad);}

  /* ---------- setup ---------- */
  .prof{display:flex;gap:14px;align-items:center;}
  .avatar{width:52px;height:52px;border-radius:13px;background:var(--surface2);display:grid;place-items:center;color:var(--hero-ink);flex:0 0 auto;}
  .avatar svg{width:26px;height:26px;}
  .prof .ph{font-family:var(--fd);font-weight:800;font-size:17px;text-transform:uppercase;}
  .prof .pm{font-family:var(--fm);font-size:10.5px;letter-spacing:0.12em;color:var(--faint);margin-top:3px;}
  .segctl{display:grid;grid-template-columns:1fr 1fr;gap:5px;background:var(--surface2);border:1px solid var(--line);border-radius:11px;padding:4px;}
  .segctl button{border:none;border-radius:8px;padding:9px;font-family:var(--fm);font-size:11px;font-weight:700;letter-spacing:0.1em;cursor:pointer;background:transparent;color:var(--muted);}
  .segctl button.on{background:var(--hero);color:var(--onhero);}
  .datarow{display:flex;align-items:center;gap:12px;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:13px 14px;cursor:pointer;color:var(--text);font-size:14px;text-align:left;text-decoration:none;}
  .datarow svg{width:17px;height:17px;color:var(--muted);flex:0 0 auto;}
  .datarow small{color:var(--faint);font-size:11.5px;display:block;}
  .foot{text-align:center;font-family:var(--fm);font-size:9.5px;letter-spacing:0.18em;color:var(--faint);margin-top:26px;}

  /* ---------- progress: calendar + metrics ---------- */
  .calhd{display:flex;justify-content:space-between;align-items:center;margin-bottom:11px;}
  .calhd .nav{display:flex;gap:6px;}
  .calhd .nav button{background:var(--surface2);border:1px solid var(--line);border-radius:6px;color:var(--muted);cursor:pointer;width:26px;height:24px;font-size:12px;}
  .calhd .nav button:hover{border-color:var(--hero);}
  .cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;}
  .cal .ch{font-family:var(--fm);font-size:9px;color:var(--faint);text-align:center;text-transform:uppercase;letter-spacing:0.05em;}
  .cell{animation:v3-cell .3s cubic-bezier(.2,.9,.2,1);aspect-ratio:1;border-radius:8px;background:var(--surface2);border:1px solid var(--line);display:grid;place-items:center;font-size:10.5px;color:var(--faint);font-family:var(--fm);}
  .cell.pad{background:transparent;border:0;}
  .cell.warm{background:color-mix(in oklab,var(--hero) 12%,transparent);border-color:var(--hero);color:var(--hero-ink);font-weight:700;}
  .cell.deep{background:var(--hero);border-color:var(--hero);color:var(--onhero);font-weight:700;}
  .cell.miss{border:1px dashed var(--bad);color:var(--bad);}
  .cell.today{box-shadow:0 0 0 2px var(--hero);}
  .calleg{display:flex;gap:14px;margin-top:11px;font-size:11px;color:var(--faint);flex-wrap:wrap;}
  .calleg span{display:inline-flex;align-items:center;gap:5px;}
  .swatch{width:11px;height:11px;border-radius:3px;display:inline-block;}
  .metric{padding:12px 0;border-bottom:1px solid var(--line);} .metric:last-child{border-bottom:0;padding-bottom:2px;}
  .metric .mh{display:flex;justify-content:space-between;gap:8px;align-items:baseline;}
  .metric .mname{font-weight:600;font-size:13.5px;}
  .delta{font-family:var(--fm);font-size:11px;font-weight:700;padding:2px 7px;border-radius:5px;white-space:nowrap;}
  .delta.good{color:var(--good);background:color-mix(in oklab,var(--good) 12%,transparent);}
  .delta.bad{color:var(--bad);background:color-mix(in oklab,var(--bad) 10%,transparent);}
  .delta.na{color:var(--faint);background:var(--surface2);}
  .mhow{font-family:var(--fm);font-size:10.5px;color:var(--faint);margin:4px 0 9px;line-height:1.5;}
  /* tracks the checkpoint list (base / wk4 / wk8 / wk12) — same reason */
  .cps{display:grid;grid-template-columns:repeat(auto-fit,minmax(64px,1fr));gap:8px;}
  .cps label{font-family:var(--fm);font-size:9px;letter-spacing:0.06em;text-transform:uppercase;color:var(--faint);display:block;margin-bottom:3px;}
  .cps input{width:100%;background:var(--surface2);border:1px solid var(--line);border-radius:7px;padding:6px 8px;color:var(--text);font-family:var(--fm);font-size:12.5px;text-align:center;}
  .cps .due input{border-color:var(--hero);}
  .cps input:focus{outline:none;border-color:var(--hero);}

  /* ---------- v0.5: banners, cue, session, practice, glossary ---------- */
  .warnbanner{background:color-mix(in oklab,var(--bad) 9%,transparent);border:1px solid color-mix(in oklab,var(--bad) 40%,transparent);border-left:3px solid var(--bad);border-radius:11px;padding:11px 13px;font-size:13px;color:var(--text);margin-bottom:12px;}
  .warnbanner b{font-weight:700;}
  /* update notice — sticks to the top of the content column on every tab, so it's
     obvious without covering anything. Slim, yellow-tinted, dismissible. #updbar
     is empty (collapsed) unless there's an update, so it costs no space normally. */
  #updbar{position:sticky;top:0;z-index:30;}
  #updbar:empty{display:none;}
  .updbar-in{display:flex;align-items:center;gap:12px;flex-wrap:wrap;
    background:color-mix(in oklab,var(--hero) 15%,var(--bg));
    border-bottom:1px solid color-mix(in oklab,var(--hero) 55%,transparent);
    padding:10px 16px;}
  .updbar-in .ml{color:var(--hero-ink);font-size:11px;letter-spacing:0.12em;}
  .updbar-sub{font-size:12.5px;color:var(--muted);flex:1;min-width:120px;}
  .updbar-act{display:flex;align-items:center;gap:8px;margin-left:auto;}
  .updbar-go{background:var(--hero);border:1px solid var(--hero);color:var(--onhero);
    border-radius:9px;padding:8px 16px;font-family:var(--fm);font-size:11px;font-weight:800;
    letter-spacing:0.08em;cursor:pointer;}
  .updbar-x{background:transparent;border:none;color:var(--muted);font-size:13px;
    cursor:pointer;padding:6px 8px;line-height:1;}
  .updbar-x:hover{color:var(--text);}
  @media (min-width:720px){.updbar-in{padding:11px 30px;}}
  /* mobile: drop the reassurance line so the bar stays one slim row (label + action) */
  @media (max-width:719px){.updbar-sub{display:none;} .updbar-in{padding:9px 14px;}}
  .cuebar{display:flex;flex-direction:column;gap:2px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 14px;margin-bottom:14px;font-size:13px;color:var(--text);}
  .cuebar.prompt{cursor:pointer;border-style:dashed;}
  .cuebar.prompt:hover{border-color:var(--hero);}
  .bftoggle{background:transparent;border:1px solid var(--line);border-radius:9px;color:var(--muted);cursor:pointer;font-family:var(--fm);font-size:10px;font-weight:700;letter-spacing:0.08em;padding:8px 11px;text-transform:uppercase;}
  .bftoggle:hover{border-color:var(--hero);color:var(--text);}
  .bftoggle.on{border-color:var(--hero);color:var(--hero-ink);}
  .rtoggle{background:var(--surface2);border:1px solid var(--line);border-radius:999px;color:var(--muted);cursor:pointer;font-family:var(--fm);font-size:10px;font-weight:800;letter-spacing:0.12em;padding:7px 18px;flex:0 0 auto;}
  .rtoggle.on{background:var(--hero);border-color:var(--hero);color:var(--onhero);}
  .sessrow{display:grid;grid-template-columns:1fr auto;gap:8px;margin-bottom:12px;}
  .sessrow .startsession,.sessrow .quickbtn{margin-bottom:0;}
  .sessrow .quickbtn{white-space:nowrap;padding-left:16px;padding-right:16px;}
  .startsession{width:100%;background:var(--hero);color:var(--onhero);border:none;border-radius:12px;padding:14px;font-family:var(--fm);font-weight:800;font-size:12px;letter-spacing:0.1em;cursor:pointer;margin-bottom:12px;}
  .startsession:hover{background:var(--hero2);}
  .field{margin-top:0;} .field label{font-family:var(--fm);font-size:10px;letter-spacing:0.12em;text-transform:uppercase;color:var(--faint);display:block;margin-bottom:5px;}
  .field input{width:100%;background:var(--surface2);border:1px solid var(--line);border-radius:9px;padding:10px 12px;color:var(--text);font-family:var(--fb);font-size:14px;}
  .field input:focus{outline:none;border-color:var(--hero);}
  .taglead{width:100%;max-width:300px;text-align:left;}
  .taglead label{text-align:center;}
  .dbk{font-family:var(--fm);font-size:10px;letter-spacing:0.12em;color:var(--faint);margin-bottom:7px;}
  .help{font-size:11.5px;color:var(--faint);margin-top:8px;line-height:1.5;}
  .glo{padding:9px 0;border-bottom:1px solid var(--line);} .glo:last-of-type{border-bottom:0;}
  .glo b{display:block;font-size:12.5px;} .glo span{display:block;font-size:12px;color:var(--muted);margin-top:2px;}
  .btncopy{background:var(--surface2);border:1px solid var(--line);border-radius:8px;color:var(--muted);cursor:pointer;font-family:var(--fm);font-size:10px;font-weight:700;letter-spacing:0.08em;padding:6px 12px;text-transform:uppercase;}
  .btncopy:hover{border-color:var(--hero);color:var(--text);}
  .pcfg{background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:12px 14px;overflow-x:auto;font-family:var(--fm);font-size:11.5px;line-height:1.7;color:var(--muted);white-space:pre;margin:0;}
  code{font-family:var(--fm);font-size:0.88em;background:var(--surface2);border:1px solid var(--line);border-radius:4px;padding:1px 5px;}

  /* ---------- v0.7: insights, gate, death audit, loadout ---------- */
  /* auto-fit, not a pinned count: this tracked the number of tiles by hand and
     would wrap the moment a fifth was added. Widths chosen to keep today's
     layout exactly — 4 across on desktop, 2 on mobile. */
  .stats4{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;}
  .stt{background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:10px 12px;}
  .stt .v{font-family:var(--fd);font-weight:800;font-size:26px;line-height:1;letter-spacing:-0.02em;color:var(--hero-ink);font-variant-numeric:tabular-nums;}
  .stt .k{font-family:var(--fm);font-size:9px;letter-spacing:0.12em;text-transform:uppercase;color:var(--faint);margin-top:6px;}
  .sparkrow{display:flex;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid var(--line);}
  .sparkrow:last-child{border-bottom:0;}
  .sparkrow .sl{flex:0 0 120px;}
  .sparkrow .sl b{display:block;font-size:12.5px;font-weight:600;}
  .sparkrow .sl>span{font-family:var(--fm);font-size:9.5px;color:var(--faint);letter-spacing:0.08em;text-transform:uppercase;}
  .spark{flex:1;height:30px;min-width:0;}
  .bwrap{flex:1;min-width:0;max-width:460px;}
  .bcap{font-family:var(--fm);font-size:9px;letter-spacing:0.1em;text-transform:uppercase;color:var(--faint);margin-bottom:7px;}
  /* cap the column width so a chart with two entries doesn't render two slabs */
  .binner{width:fit-content;max-width:100%;}
  .bchart{display:flex;align-items:flex-end;gap:6px;}
  .bcol{flex:1 1 32px;min-width:26px;max-width:54px;display:flex;flex-direction:column;align-items:stretch;gap:4px;}
  /* definite height: a percentage fill inside a flex-sized track resolves to auto */
  .btrack{height:34px;display:flex;align-items:flex-end;}
  /* the history bars are meant to be QUIET, not absent. In --line2 they measured 1.65:1 dark
     and 1.55:1 light, so an eight-week chart drew one accent bar and seven ghosts and read as
     an empty panel. --edge (3.4-4.2:1) keeps the hierarchy and actually paints them. */
  .bfill{width:100%;background:var(--edge);border-radius:3px 3px 0 0;min-height:3px;}
  .bfill.now{background:var(--hero);}
  .bzero{width:100%;height:2px;background:var(--line);border-radius:2px;}
  .bval{font-family:var(--fm);font-size:10px;text-align:center;color:var(--muted);font-variant-numeric:tabular-nums;}
  .bval.off{color:var(--faint);opacity:.45;}
  .baxis{display:flex;justify-content:space-between;margin-top:5px;}
  .baxis span{font-family:var(--fm);font-size:8.5px;letter-spacing:0.08em;text-transform:uppercase;color:var(--faint);}
  .chempty{flex:1;font-family:var(--fm);font-size:10.5px;color:var(--faint);line-height:1.5;}
  @media (max-width:719px){.sparkrow{align-items:flex-start;flex-direction:column;gap:10px;} .sparkrow .sl{flex:none;} .bwrap{width:100%;max-width:none;}}
  .gate{border-left:3px solid var(--hero);}
  .gcheck{display:flex;align-items:center;gap:11px;width:100%;text-align:left;background:transparent;border:none;border-bottom:1px solid var(--line);padding:10px 0;cursor:pointer;color:var(--text);font-size:14px;}
  .gcheck .gbox{width:22px;height:22px;border-radius:7px;border:1.5px solid var(--edge);display:grid;place-items:center;flex:0 0 auto;}
  .gcheck.on .gbox{background:var(--hero);border-color:var(--hero);}
  .gcheck .gbox svg{width:12px;height:12px;color:var(--onhero);opacity:0;}
  .gcheck.on .gbox svg{opacity:1;}
  .gcheck.on{color:var(--muted);}
  .losswrap{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:14px;}
  .lossn{font-family:var(--fd);font-weight:800;font-size:26px;line-height:1;font-variant-numeric:tabular-nums;}
  /* tracks the CAUSES array length; auto-fit so adding a cause cannot wrap it */
  .causes{display:grid;grid-template-columns:repeat(auto-fit,minmax(88px,1fr));gap:6px;}
  .cbtn{background:var(--surface2);border:1px solid var(--line);border-radius:9px;padding:10px 4px;cursor:pointer;color:var(--muted);font-family:var(--fm);font-size:9px;font-weight:700;letter-spacing:0.05em;text-transform:uppercase;}
  .cbtn:hover{border-color:var(--hero-ink);color:var(--text);}
  .cbtn b{display:block;font-family:var(--fd);font-size:18px;color:var(--hero-ink);margin-bottom:3px;font-variant-numeric:tabular-nums;}
  .leakbar{display:flex;height:9px;border-radius:5px;background:var(--surface2);overflow:hidden;margin-top:12px;}
  .leakbar i{height:100%;display:block;}
  .lo-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  @media (max-width:520px){.lo-grid{grid-template-columns:1fr;}}
  .quickbtn{width:100%;background:transparent;color:var(--hero-ink);border:1px solid var(--hero-ink);border-radius:12px;padding:14px;font-family:var(--fm);font-weight:800;font-size:12px;letter-spacing:0.1em;cursor:pointer;margin-bottom:12px;}
  .quickbtn:hover{background:color-mix(in oklab,var(--hero) 12%,transparent);}

  /* ---------- v0.8: map prep ---------- */
  .mapchips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px;}
  .mchip{background:var(--surface2);border:1px solid var(--line);border-radius:999px;color:var(--muted);cursor:pointer;
    font-family:var(--fm);font-size:10.5px;font-weight:700;letter-spacing:0.08em;padding:8px 14px;text-transform:uppercase;}
  .mchip:hover{border-color:var(--hero-ink);color:var(--text);}
  .mchip.on{background:var(--hero);border-color:var(--hero);color:var(--onhero);}
  .mchip .pin{opacity:.75;}
  .jobs{margin-top:2px;}
  .job{display:flex;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);font-size:13px;color:var(--muted);}
  .job:last-child{border-bottom:0;}
  .job i{flex:0 0 auto;font-style:normal;color:var(--hero-ink);font-family:var(--fm);font-size:11px;font-weight:700;padding-top:1px;}
  .rt{display:flex;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);align-items:baseline;}
  .rt:last-child{border-bottom:0;}
  .rt b{flex:0 0 92px;font-size:12.5px;font-weight:600;}
  .rt span{font-family:var(--fm);font-size:11px;color:var(--faint);}
  .lnrow{display:flex;gap:10px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--line);}
  .lnrow:last-of-type{border-bottom:0;}
  .lnrow .lnb{flex:1;min-width:0;}
  .lnrow .lnb b{display:block;font-size:13px;font-weight:600;overflow-wrap:anywhere;}
  .lnrow .lnb>span{display:block;font-size:12px;color:var(--muted);margin-top:2px;white-space:pre-wrap;word-break:break-word;}
  /* lineup pictures: thumbnails big enough to recognise a spot at a glance, tap to enlarge */
  .lnthumbs{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;}
  /* the stand/aim pair reads as one unit: two equal columns, both always present in the vault */
  .picslots{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:8px;}
  .picslot{min-width:0;}
  .picslot .lnthumb{width:100%;}
  .picslot .lnthumb img{width:100%;height:104px;}
  .picslot.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;height:104px;
    border:1px dashed var(--line);border-radius:8px;background:transparent;color:var(--faint);cursor:pointer;
    font-family:var(--fm);font-size:9.5px;letter-spacing:0.1em;}
  .picslot.empty:hover{border-color:var(--hero);color:var(--text);}
  .picslot.empty svg{width:16px;height:16px;}
  .pslab{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-top:4px;
    font-family:var(--fm);font-size:9.5px;letter-spacing:0.1em;color:var(--faint);}
  .psdel{background:none;border:0;color:var(--faint);cursor:pointer;font-size:12px;line-height:1;padding:2px 4px;}
  .psdel:hover{color:var(--bad);}
  .lnthumbs.big .picslot .lnthumb img{width:100%;height:150px;}
  .lnthumbs.big{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));}
  .lnthumb{padding:0;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface);cursor:pointer;line-height:0;}
  .lnthumb:hover{border-color:var(--hero);}
  .lnthumb img{width:118px;height:70px;object-fit:cover;display:block;}
  .lnthumbs.big .lnthumb img{width:190px;height:112px;}
  .picadd{display:inline-flex;align-items:center;gap:6px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;
    padding:6px 10px;border:1px dashed var(--line-2,var(--line));border-radius:8px;background:transparent;color:var(--muted);cursor:pointer;}
  .picadd:hover{border-color:var(--hero);color:var(--text);}
  .picarm{margin-top:8px;padding:10px;border:1px dashed var(--hero);border-radius:8px;background:var(--surface);}
  /* the "go get a lineup" action — the first thing to do on an empty vault, so it carries the
     hero yellow like the other primary actions rather than sitting quietly as a grey row */
  .findbtn{display:flex;align-items:center;gap:11px;width:100%;background:var(--hero);border:1px solid var(--hero);
    color:var(--onhero);border-radius:12px;padding:13px 15px;margin:12px 0 4px;text-decoration:none;
    font-family:var(--fm);font-weight:800;font-size:12px;letter-spacing:0.08em;text-transform:uppercase;}
  .findbtn:hover{background:var(--hero2);border-color:var(--hero2);}
  .findbtn svg{width:18px;height:18px;flex:0 0 auto;color:var(--onhero);}
  .findbtn small{display:block;font-family:var(--fb);font-weight:500;font-size:11.5px;letter-spacing:0;
    text-transform:none;opacity:.8;margin-top:3px;}
  .findbtn .fbchev{margin-left:auto;font-size:19px;line-height:1;opacity:.65;}
  #lightbox{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:70;display:none;align-items:center;justify-content:center;
    flex-direction:column;gap:14px;padding:20px;cursor:zoom-out;}
  #lightbox.show{display:flex;}
  #lightbox img{max-width:100%;max-height:82vh;object-fit:contain;border-radius:10px;}
  .lbhint{color:var(--faint);}
  .lndel{background:transparent;border:1px solid var(--line);border-radius:7px;color:var(--faint);cursor:pointer;width:28px;height:28px;flex:0 0 auto;font-size:12px;}
  .lndel:hover{border-color:var(--bad);color:var(--bad);}
  .pcue{font-family:var(--fm);font-size:11px;color:var(--hero-ink);margin-top:4px;}
  .lnadd{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:end;margin-top:12px;}
  @media (max-width:600px){.lnadd{grid-template-columns:1fr;}}

  #session{position:fixed;inset:0;z-index:70;display:none;flex-direction:column;background:var(--bg);padding:20px 18px calc(20px + env(safe-area-inset-bottom));}
  #session.show{display:flex;}
  #session .sbar{display:flex;justify-content:space-between;align-items:center;}
  #session .siconx{background:transparent;border:1px solid var(--line);border-radius:9px;width:34px;height:34px;color:var(--muted);cursor:pointer;font-size:14px;}
  #session .sdots{display:flex;gap:6px;margin:16px 0;}
  #session .sdot{flex:1;height:4px;border-radius:2px;background:var(--surface2);}
  #session .sdot.past{background:var(--hero);opacity:.5;} #session .sdot.cur{background:var(--hero);}
  /* scrolls rather than clips if a wordy drill meets a short screen */
  #session .sctr{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:7px;}
  #session .sname{font-size:26px;max-width:16ch;line-height:1.05;}
  #session .scue{font-family:var(--fd);font-weight:800;text-transform:uppercase;letter-spacing:-0.01em;font-size:clamp(15px,3.4vw,19px);color:var(--hero-ink);max-width:22ch;margin:10px 0 2px;}
  #session .srule{font-family:var(--fm);font-size:12px;color:var(--bad);max-width:36ch;margin-top:6px;line-height:1.5;}
  /* full-strength text, not --muted: this is read mid-drill at a glance, so it
     is content rather than caption and the grey was the main legibility fault */
  #session .ssub{color:var(--text);font-size:15px;max-width:34ch;line-height:1.45;}
  /* One labelled fact per row, left-aligned so the labels form a column the eye
     runs down. Centred prose forced you to re-read to find anything. */
  /* drill screen — each piece styled by its job, not a flat list of look-alike rows */
  #session .smap{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:999px;padding:5px 13px;font-family:var(--fm);font-size:12px;color:var(--muted);margin-top:12px;}
  #session .smapk{font-size:9.5px;letter-spacing:0.13em;color:var(--faint);}
  #session .sbody{width:100%;max-width:40ch;text-align:left;margin:16px auto 2px;display:flex;flex-direction:column;gap:13px;}
  #session .sdk{display:block;font-family:var(--fm);font-size:10px;letter-spacing:0.13em;color:var(--faint);margin-bottom:5px;}
  #session .sdo{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--hero);border-radius:12px;padding:12px 15px;}
  #session .sdotxt{display:block;font-size:16px;line-height:1.4;color:var(--text);}
  #session .sgoal{border:1px solid var(--line);border-radius:12px;padding:12px 15px;}
  #session .sgk{display:block;font-family:var(--fm);font-size:10px;letter-spacing:0.13em;color:var(--faint);margin-bottom:5px;}
  #session .sgoaltxt{display:block;font-size:14px;line-height:1.45;color:var(--muted);}
  #session .srw{display:grid;grid-template-columns:1fr;gap:10px;}
  #session .srwc{border-radius:12px;padding:11px 13px;border:1px solid;}
  #session .srwc.rgood{background:color-mix(in oklab,var(--good) 9%,transparent);border-color:color-mix(in oklab,var(--good) 38%,transparent);}
  #session .srwc.rbad{background:color-mix(in oklab,var(--bad) 9%,transparent);border-color:color-mix(in oklab,var(--bad) 38%,transparent);}
  #session .srwh{font-family:var(--fm);font-size:10px;letter-spacing:0.12em;display:flex;align-items:center;gap:5px;margin-bottom:5px;}
  #session .srwc.rgood .srwh{color:var(--good);}
  #session .srwc.rbad .srwh{color:var(--bad);}
  #session .srwt{font-size:13.5px;line-height:1.45;color:var(--text);}
  #session .smind{background:color-mix(in oklab,var(--hero) 11%,transparent);border:1px solid color-mix(in oklab,var(--hero) 38%,transparent);border-radius:12px;padding:11px 15px;}
  #session .smindk{display:block;font-family:var(--fm);font-size:9.5px;letter-spacing:0.14em;color:var(--hero-ink);}
  #session .smindc{display:block;font-family:var(--fd);font-weight:800;font-size:18px;color:var(--hero-ink);margin-top:3px;letter-spacing:-0.01em;}
  #session .smeas{font-family:var(--fm);font-size:12px;color:var(--muted);margin-bottom:4px;}
  #session .stime{font-family:var(--fd);font-weight:800;font-size:clamp(64px,20vw,92px);letter-spacing:-0.03em;color:var(--hero-ink);font-variant-numeric:tabular-nums;line-height:1;margin:4px 0;}
  #session .stime.zero{color:var(--good);}
  #session .sctrls{display:flex;gap:10px;margin-top:8px;flex-wrap:wrap;justify-content:center;}
  /* Every size above is phone-tuned and never grew, so on a maximised desktop
     window the drill sat as a ~200px ribbon of small text in a field of black.
     Scale up past the phone breakpoint and let the lines actually run. */
  @media (min-width:720px){
    #session{padding:28px 32px;}
    #session .sctr{gap:11px;}
    #session .sname{font-size:clamp(34px,3.2vw,50px);max-width:24ch;}
    #session .ssub{font-size:clamp(17px,1.3vw,21px);max-width:54ch;}
    #session .scue{font-size:clamp(21px,1.9vw,29px);max-width:36ch;margin:14px 0 2px;}
    #session .smeas{font-size:13px;}
    #session .srule{font-size:15px;max-width:62ch;}
    #session .sbody{max-width:58ch;gap:15px;margin-top:22px;}
    #session .srw{grid-template-columns:1fr 1fr;}
    #session .smap{font-size:13px;margin-top:14px;}
    #session .sdotxt{font-size:18px;}
    #session .srwt,#session .sgoaltxt{font-size:15px;}
    #session .smindc{font-size:21px;}
  }

  /* ---------- celebrate overlay ---------- */
  #cele{position:fixed;inset:0;z-index:80;display:none;place-items:center;align-content:center;
    background:color-mix(in oklab,var(--bg) 88%, transparent);overflow:hidden;text-align:center;}
  #cele.show{display:grid;}
  /* the assemble: two shards meeting, a bloom behind them, a ring, then the number */
  .asmwrap{position:relative;width:96px;height:96px;display:grid;place-items:center;margin:0 auto;}
  .asm{width:66px;height:66px;color:var(--accInk);position:relative;z-index:2;}
  .asm .shA{animation:v3-shardA .42s cubic-bezier(.2,.9,.2,1);}
  .asm .shB{animation:v3-shardB .42s cubic-bezier(.2,.9,.2,1);}
  .asmbloom{position:absolute;inset:-18%;border-radius:50%;z-index:1;
    background:radial-gradient(circle,var(--bloom) 0%,transparent 68%);
    animation:v3-bloom .62s cubic-bezier(.2,.9,.2,1) .28s both;}
  .asmping{position:absolute;inset:8%;border-radius:50%;border:2px solid var(--acc);z-index:1;
    animation:v3-ping .62s cubic-bezier(.2,.9,.2,1) .40s both;}
  .asmt{margin-top:16px;font-family:var(--fm);font-size:10px;letter-spacing:0.2em;color:var(--muted);
    animation:v3-rise .34s cubic-bezier(.2,.9,.2,1) .46s both;}
  .asmn{font-family:var(--fd);font-weight:800;font-size:58px;line-height:1;letter-spacing:-0.045em;
    color:var(--accInk);margin-top:6px;animation:v3-roll .44s cubic-bezier(.2,.9,.2,1) .52s both;}
  .asmn small{display:block;font-family:var(--fm);font-size:9.5px;font-weight:400;letter-spacing:0.18em;
    color:var(--faint);margin-top:8px;}
  #cele .scan{position:absolute;left:0;right:0;height:2px;background:var(--hero);opacity:.6;animation:lk-scan 1.1s ease-in-out both;}
  #cele .inner{text-align:center;}
  #cele .ct1{font-family:var(--fd);font-weight:800;font-size:28px;text-transform:uppercase;letter-spacing:-0.02em;margin-top:18px;animation:lk-rise .45s .2s cubic-bezier(.2,.9,.2,1) both;}
  #cele .ct2{font-family:var(--fm);font-size:12px;letter-spacing:0.18em;color:var(--hero-ink);margin-top:8px;animation:lk-rise .45s .32s cubic-bezier(.2,.9,.2,1) both;}

  @keyframes lk-snap{from{transform:scale(1.55);opacity:0}to{transform:scale(1);opacity:1}}
  @keyframes lk-ping{from{transform:scale(.7);opacity:.8}to{transform:scale(2.1);opacity:0}}
  @keyframes lk-scan{from{top:0}to{top:100%}}
  @keyframes lk-rise{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}
  @keyframes lk-blink{50%{opacity:.25}}
  @keyframes v3-spin{to{transform:rotate(360deg)}}
  /* v3 motion. Standard easing cubic-bezier(.2,.9,.2,1), durations 260–450ms.
     The two shards fly in along their own diagonals and meet — "the assemble". */
  @keyframes v3-shardA{0%{transform:translate(16px,-16px) rotate(7deg);opacity:0}100%{transform:translate(0,0);opacity:1}}
  @keyframes v3-shardB{0%{transform:translate(-16px,16px) rotate(-7deg);opacity:0}100%{transform:translate(0,0);opacity:1}}
  @keyframes v3-bloom{0%{transform:scale(.5);opacity:0}45%{opacity:.95}100%{transform:scale(1.06);opacity:.45}}
  @keyframes v3-ping{0%{transform:scale(.7);opacity:.85}100%{transform:scale(2.1);opacity:0}}
  @keyframes v3-rise{0%{transform:translateY(12px);opacity:0}100%{transform:translateY(0);opacity:1}}
  @keyframes v3-roll{0%{transform:translateY(40%) scale(.84);opacity:0}100%{transform:translateY(0) scale(1);opacity:1}}
  @keyframes v3-pop{0%{transform:scale(.6);opacity:0}62%{transform:scale(1.14)}100%{transform:scale(1);opacity:1}}
  @keyframes v3-slide{0%{transform:translateY(16px);opacity:0}100%{transform:translateY(0);opacity:1}}
  /* a bar filling to its own width — scaleX, so the width itself stays the real number */
  @keyframes v3-growX{0%{transform:scaleX(0)}100%{transform:scaleX(1)}}
  @keyframes v3-badge{0%{transform:scale(.7);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
  /* the calendar is 36 cells and the biggest thing on Progress, so it must not depend on the
     animation clock to be VISIBLE. Scale-only: if the clock is stalled (occluded window, a
     throttled webview) the cells sit at 86% instead of vanishing. Chrome and celebration
     animations may still fade from 0 — they are small, and blank costs little there. */
  @keyframes v3-cell{0%{transform:scale(.86)}100%{transform:scale(1)}}
  @keyframes v3-tick{0%{transform:scale(.4);opacity:0}60%{transform:scale(1.18)}100%{transform:scale(1);opacity:1}}
  /* ---------- touch targets ----------
     Section 2: "44px minimum on any surface reachable by touch. 36px is permitted ONLY for
     pointer-only desktop chrome. When a control renders in both frames it needs two style
     variants, not one shared literal — this was a shipped bug." It was shipped again: at
     375px nineteen control types sat under 44, the worst at 24-30px (.mchip x12, the copy
     and delete buttons, the rest toggle). Desktop keeps its denser sizes because the
     sidebar and card chrome there are pointer-only; this block is the second variant. */
  @media (max-width:719px),(pointer:coarse){
    .mchip,.rtoggle,.btncopy,.bftoggle,.fbtn,.gbtn,.pbtn,.startsession,.iconbtn,.lndel,
    .picadd,.wsrecheck,.coachopt,.subtab,.moretog,.fullbtn,.pausebtn,.cbtn,.tbtn,
    .segctl button,.cal nav button,[data-cal]{
      min-height:44px;}
    .iconbtn,.lndel{min-width:44px;width:44px;height:44px;}
    .mchip{padding-top:0;padding-bottom:0;display:inline-flex;align-items:center;}
    input[type="text"],input[type="number"],input[type="time"],input[type="date"],select,textarea{
      min-height:44px;}
  }
  /* Collapse motion to ~0 but KEEP end states and every numeric update intact. */
  @media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;}}
</style>
