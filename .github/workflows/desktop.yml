name: desktop-build

on:
  push:
    tags: ["v*"]

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install deps (locked)
        run: npm ci

      - name: Version sources agree with tag
        run: node scripts/check-version.js ${{ github.ref_name }}

      - name: Frontend gate (syntax + unit tests)
        run: npm run verify

      # Reproducibility: without a committed Cargo.lock every build re-resolves the crate
      # graph, so two builds of the SAME TAG can ship different dependency trees. That is the
      # wrong property for anything distributing a signed auto-updater.
      # --locked is applied conditionally so this is correct both before and after the lockfile
      # lands: today it is a no-op, and the moment `cargo generate-lockfile` is committed the
      # build becomes reproducible with no further edit. The report step says which mode ran,
      # so "reproducible" is never something you have to take on trust.
      - name: Report dependency-pinning mode
        run: |
          if [ -f src-tauri/Cargo.lock ]; then
            echo "Cargo.lock present — building --locked (reproducible)"
          else
            echo "::warning::No src-tauri/Cargo.lock — the crate graph is re-resolved on every build. Run 'cargo generate-lockfile' in src-tauri and commit it."
          fi
        shell: bash

      - name: Rust tests (GSI win/loss derivation + config shape)
        run: cargo test --manifest-path src-tauri/Cargo.toml ${{ hashFiles('src-tauri/Cargo.lock') != '' && '--locked' || '' }}

      - name: Build and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # update-signing keypair (free, self-generated — NOT a code-signing certificate).
          # Tauri refuses to install an update it can't verify against the pubkey in tauri.conf.json.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          includeUpdaterJson: true
          tagName: ${{ github.ref_name }}
          releaseName: "Lockin ${{ github.ref_name }}"
          releaseBody: "Lockin desktop — your pocket CS2 coach. Download **Lockin_*_x64-setup.exe** (recommended) or the **.msi**, run it, done. Windows 10/11.\n\nThe app is unsigned, so Windows SmartScreen may say \"Windows protected your PC\" — click **More info -> Run anyway** to install."
          releaseDraft: false
          prerelease: false
